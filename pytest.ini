[pytest]
# This repository holds more than one project. Each one lives in its own folder
# under "projects" and brings its own tests. Pointing pytest at the "projects"
# folder means a plain "pytest -q" from the repository root runs every project's
# tests in one go.
testpaths = projects

# Import test files by their full path instead of by folder name. Without this,
# two projects that both have a "tests" folder would collide, because pytest
# would try to import two different files under the same name. This setting
# keeps each project's tests separate, so projects can be added without having
# to invent odd folder names.
addopts = --import-mode=importlib
