<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Round Logger</title>

<!--
  PM Round Logger
  ===============
  A single-file, fully offline tool for logging preventative maintenance
  readings on a daily round.

  It makes no network calls of any kind. There are no libraries, no fonts,
  and no images loaded from anywhere. Everything it needs is in this one
  file, which is why it works when you just double-click it.

  Your data lives in the browser's "local storage" on this tablet only.
  That storage is wiped if anyone clears browsing data, or if the tablet is
  re-imaged. So export regularly. The exported file is the real record.
  The tablet is a clipboard.

  To change anything, open this file in Notepad. The code is at the bottom,
  split into labelled sections. Each section says what it does.
-->

<style>
  /* -----------------------------------------------------------------------
     Colours are defined once here and used by name everywhere below.
     Change a colour in this block and it changes across the whole page.
     ----------------------------------------------------------------------- */
  :root {
    --ink: #1b1f24;          /* main text */
    --muted: #5b6570;        /* quiet text, hints */
    --line: #d7dce2;         /* borders */
    --bar: #305496;          /* header blue, main buttons */
    --bar2: #5b9bd5;         /* lighter blue */
    --accent: #c00000;       /* red, for out-of-range and warnings */
    --bg: #f4f6f8;           /* page background */
    --card: #ffffff;         /* card background */
    --ok: #2e7d32;           /* green, in range */
    --ok-bg: #e8f5e9;
    --warn: #b26a00;         /* amber, needs attention */
    --warn-bg: #fff4e0;
    --bad-bg: #fdecec;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Segoe UI, Tahoma, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 16px;        /* 16px keeps the tablet from zooming on focus */
    line-height: 1.45;
  }

  header {
    background: var(--bar);
    color: #fff;
    padding: 14px 18px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 3px 0 0; opacity: 0.9; font-size: 13px; }

  main { padding: 14px; max-width: 900px; margin: 0 auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 8px; font-size: 17px; }
  .hint { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }

  /* -----------------------------------------------------------------------
     Buttons. Everything you tap is at least 48px tall so it is easy to hit
     with a finger. Nothing on this page relies on hovering a mouse.
     ----------------------------------------------------------------------- */
  button {
    font: inherit;
    background: var(--bar);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 12px 18px;
    min-height: 48px;
    cursor: pointer;
  }
  button.secondary { background: #eef1f5; color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: var(--accent); }
  button.small { min-height: 44px; padding: 8px 12px; font-size: 15px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:active { filter: brightness(0.92); }

  /* The tab strip across the top. */
  .tabs { display: flex; gap: 6px; padding: 10px 14px 0; max-width: 900px; margin: 0 auto; }
  .tabs button {
    flex: 1;
    background: #e7ebf1;
    color: var(--ink);
    border-radius: 8px 8px 0 0;
    border: 1px solid var(--line);
    border-bottom: 0;
  }
  .tabs button.active { background: var(--card); font-weight: 600; }

  /* Only one view is shown at a time. */
  .view { display: none; }
  .view.active { display: block; }

  /* -----------------------------------------------------------------------
     Inputs. Large, with plenty of padding, for typing with a finger.
     ----------------------------------------------------------------------- */
  input[type=text], input[type=number], input[type=date], select {
    font: inherit;
    font-size: 16px;
    padding: 11px 10px;
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  input.reading { font-size: 20px; font-weight: 600; }
  input.reading.ok  { border-color: var(--ok);     background: var(--ok-bg); }
  input.reading.bad { border-color: var(--accent); background: var(--bad-bg); }

  label { display: block; font-weight: 600; margin-bottom: 4px; }

  /* -----------------------------------------------------------------------
     The tool list on the Today tab. Each row is one big tap target.
     ----------------------------------------------------------------------- */
  .toolrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    min-height: 64px;
    margin-bottom: 8px;
    font-size: 17px;
  }
  .toolrow .name { font-weight: 600; }
  .toolrow .sub { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .toolrow.done { background: var(--ok-bg); border-color: #b7dfb9; }
  .toolrow.attention { background: var(--warn-bg); border-color: #f0cf9a; }

  /* Small coloured status labels. */
  .chip, .pill {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .chip.todo { background: #e7ebf1; color: var(--muted); }
  .chip.ok   { background: var(--ok);     color: #fff; }
  .chip.bad  { background: var(--accent); color: #fff; }
  .pill.blank { display: none; }
  .pill.ok   { background: var(--ok-bg);   color: var(--ok); }
  .pill.bad  { background: var(--bad-bg);  color: var(--accent); }

  /* -----------------------------------------------------------------------
     The export reminder banner that sits under the page header.
     ----------------------------------------------------------------------- */
  .banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    max-width: 900px;
    margin: 12px auto 0;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: 15px;
  }
  .banner.show { display: flex; }
  .banner.calm { background: #eef1f5; color: var(--muted); }
  .banner.warn { background: var(--warn-bg); border-color: #f0cf9a; color: var(--warn); font-weight: 600; }
  .banner.bad  { background: var(--bad-bg);  border-color: #f2c4c4; color: var(--accent); font-weight: 600; }

  /* Message lines under buttons: green for done, red for a problem. */
  .msg { font-size: 15px; margin-top: 10px; min-height: 22px; }
  .msg.ok  { color: var(--ok); }
  .msg.err { color: var(--accent); }
  .msg.info { color: var(--muted); }

  /* Layout helpers used in a few places. */
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > .grow { flex: 1; min-width: 140px; }
  .stack > * { margin-bottom: 10px; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .big-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .big-actions button { width: 100%; font-size: 17px; min-height: 56px; }

  .field { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }

  .pointedit { border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 8px; background: #fafbfc; }
  .pointedit .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .count { font-size: 15px; color: var(--muted); }

  /* A collapsed section: one tappable row showing what is inside. Setup is a
     job done rarely, so the default should be an overview, not every field. */
  .section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 16px;
    min-height: 56px;
    margin-bottom: 8px;
    font-size: 16px;
  }
  .section.open { background: #eef1f5; border-color: var(--bar2); }
  .section .name { font-weight: 600; }
  .section .sub { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .section .caret { font-size: 13px; color: var(--muted); }
  .section.warn { background: var(--warn-bg); border-color: #f0cf9a; }

  /* One reading on one row where there is width for it, stacking on narrow
     screens. Five stacked rows per reading turns a setup screen into a
     scrolling exercise. */
  /* The "counts up to a limit" tick, sized so it is tappable. */
  .lifebox {
    display: flex; align-items: center; gap: 8px;
    font-weight: 400; font-size: 14px; margin: 0 6px 0 0;
    min-height: 44px; white-space: nowrap;
  }
  .lifebox input { width: 22px; height: 22px; min-height: 0; }

  /* The fleet summary. Deliberately dense: it is a table you scan, not a form.
     It scrolls sideways inside its own box rather than stretching the page. */
  .fleetwrap { overflow-x: auto; }
  table.fleet { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.fleet th, table.fleet td {
    border: 1px solid var(--line);
    padding: 7px 10px;
    text-align: right;
    white-space: nowrap;
  }
  table.fleet th { background: #eef1f5; text-align: left; font-size: 13px; }
  table.fleet td.name { text-align: left; }
  table.fleet td.tool { text-align: left; font-weight: 600; }
  table.fleet td.na { color: var(--muted); text-align: left; }
  table.fleet td.red   { background: #f8cbcb; color: #7d0000; font-weight: 700; }
  table.fleet td.amber { background: #f2e6a8; color: #6b4e00; font-weight: 700; }

  .readingrow { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; }
  .readingrow .lab { font-weight: 600; font-size: 13px; margin-bottom: 3px; display: block; }
  @media (max-width: 720px) {
    .readingrow { grid-template-columns: 1fr 1fr; }
  }

  /* The diagnostics footnote. Deliberately quiet: small, grey, and right at
     the bottom. There if you look for it, invisible if you are not. */
  .footnote {
    text-align: center;
    margin: 4px 0 24px;
    font-size: 12px;
    color: var(--muted);
    opacity: 0.65;
  }
  /* Small TEXT, but a full-size TAP AREA. Those are two different things, and
     on a touchscreen both matter: it should be visually quiet without being
     hard to hit. Do not shrink the padding to make it look smaller - shrink
     the font size instead. */
  .footnote button {
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    padding: 14px 18px;
    min-height: 48px;
    text-decoration: underline;
    cursor: pointer;
  }
  /* The report itself. Monospaced so columns line up when you paste it. */
  #diagText {
    width: 100%;
    min-height: 260px;
    font-family: Consolas, Menlo, monospace;
    font-size: 12px;
    line-height: 1.4;
    white-space: pre;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    background: #fbfcfd;
    color: var(--ink);
  }
  .checkline { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .checkline input { width: 22px; height: 22px; min-height: 0; }
  code { background: #eef1f5; padding: 1px 5px; border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>PM Round Logger</h1>
  <p>Runs offline on this tablet. Nothing you type is ever sent anywhere.</p>
</header>

<div id="banner" class="banner"></div>

<nav class="tabs">
  <button id="tabToday" onclick="showTab('today')">Today</button>
  <button id="tabTools" onclick="showTab('tools')">Tools</button>
  <button id="tabData"  onclick="showTab('data')">Data</button>
</nav>

<main>
  <!-- Each of these is filled in by JavaScript. Only one shows at a time. -->
  <section id="viewToday" class="view"></section>
  <section id="viewTool"  class="view"></section>
  <section id="viewEntry" class="view"></section>
  <section id="viewTools" class="view"></section>
  <section id="viewData"  class="view"></section>
</main>

<script>
"use strict";

// ---------------------------------------------------------------------------
// STORAGE
//
// Everything is kept in one browser storage slot, saved as text. The key name
// starts with "partybarte" so this tool can never clash with another local
// HTML file on the same tablet. In Edge and Chrome every file you open from
// your hard drive shares one storage area, so a unique key name matters.
//
// Every change saves straight away. There is no "save" button for setup.
// ---------------------------------------------------------------------------
var STORAGE_KEY = "partybarte.pmlogger.v1";

// ---------------------------------------------------------------------------
// VERSION
//
// Bump APP_VERSION and BUILD_DATE every time this file changes. The version
// shows in the diagnostics footnote at the bottom of the Data tab, so when
// something goes wrong we both know exactly which build is on the tablet
// instead of guessing.
//
// DATA_SHAPE is different, and changes far less often. It describes the LAYOUT
// of the stored data, and only goes up if that layout changes in a way that
// old data needs converting for. See migrateData().
// ---------------------------------------------------------------------------
var APP_VERSION = "1.8.0";
var BUILD_DATE = "2026-08-24";
var DATA_SHAPE = 3;

// A second, separate storage slot for diagnostics: the error log, the usage
// counters and the upgrade history.
//
// Deliberately kept apart from your readings. It means error text and counters
// never end up inside a JSON backup, so exports stay clean and portable, and
// clearing diagnostics can never touch a logged reading.
var DEBUG_KEY = "partybarte.pmlogger.debug.v1";

// Set to false if the browser refuses to store anything. We then warn loudly,
// because in that case closing the page loses the day's work.
var STORAGE_OK = true;

// Why the last save failed, if it did: "full" or "blocked".
var STORAGE_PROBLEM = "";

// Roughly how much room the browser gives us. Measured on Chrome and Edge, a
// page opened from a local file gets about 5 MB - and that 5 MB is SHARED with
// every other local HTML file on the tablet, so another tool storing things
// eats into the same allowance.
//
// For scale: eight tools with ten readings each, logged every working day,
// comes to about 0.36 MB a year. So this is years away. But a save that fails
// silently in the middle of a round is bad enough to be worth watching for.
var STORAGE_BUDGET = 5 * 1024 * 1024;

// The whole data set lives in this one variable while the page is open.
var DATA = blankData();

// What an empty, brand new data set looks like.
function blankData() {
  return {
    version: DATA_SHAPE,        // layout of this object, see migrateData()
    createdWith: APP_VERSION,   // app version that first wrote this data
    lastOpenedWith: APP_VERSION,// app version that last touched it
    nextId: 0,       // counter used to hand out ids, see newId()
    lastExport: "",  // date of the last export, as YYYY-MM-DD

    // When a consumable is low enough to colour, as a percentage of life left.
    // Kept here rather than in the code because the right number is a
    // maintenance judgement, not a software constant.
    lifeRedBelow: 15,
    lifeAmberBelow: 25,

    // Chamber types. A type is a NAME plus a list of readings, for example
    // "Etch" or "Strip". Chambers of the same type log the same things, so the
    // list is written once here and every chamber of that type uses it. Change
    // a reading on the type and every chamber using it changes with it.
    //
    // Types live here rather than inside a tool on purpose: two identical
    // etchers should share one definition, not keep two copies that drift.
    chamberTypes: [],  // [{ id, name, points: [...] }]

    tools: [],       // see addTool() for the shape of a tool
    entries: {}      // see unitEntry() for the shape of an entry
  };
}

// Set if the stored data came from a NEWER version of this page than the file
// currently open. See migrateData() for why that matters.
var VERSION_PROBLEM = "";

// Set by migrateData() when it changed something that needs writing back.
var MIGRATION_CHANGED = false;

// ---------------------------------------------------------------------------
// Are we running out of a temporary folder?
//
// Double-clicking an HTML file from INSIDE a zip makes Windows quietly unpack
// it to AppData\Local\Temp and open it from there. It works, so nothing looks
// wrong - until Windows clears Temp and the tool is simply gone.
//
// Your readings would survive that, because the browser stores them against
// the file:// address rather than the folder. But hunting for a vanished tool
// mid-round is a bad morning, so say something now.
// ---------------------------------------------------------------------------
function runningFromTempFolder() {
  var path = String(location.pathname || "").toLowerCase();
  return path.indexOf("appdata/local/temp") !== -1 || path.indexOf("appdata\\local\\temp") !== -1;
}

// ---------------------------------------------------------------------------
// Bring stored data up to date with the version of the page now running.
//
// Right now there is only one layout, so there is nothing to convert and this
// does almost nothing. That is the point: the hook exists BEFORE it is needed,
// so a future change to the layout can upgrade your data instead of stranding
// it. When that day comes, add a case below, oldest first.
//
// The awkward case is the other direction. If an old copy of this file is
// still sitting in Downloads and gets double-clicked by mistake, it would find
// data written by a newer version and could quietly wreck it. So going
// backwards is refused, loudly, rather than guessed at.
// ---------------------------------------------------------------------------
function migrateData() {
  var storedShape = Number(DATA.version || 1);

  if (storedShape > DATA_SHAPE) {
    VERSION_PROBLEM = "Your saved data was written by a newer version of this "
      + "page (data layout " + storedShape + ", this file understands " + DATA_SHAPE
      + "). Nothing has been changed. Find the newer pm_logger.html and use that one.";
    return false;
  }

  // Convert older layouts, oldest first.
  //
  // Layout 1 -> 2 added chambers. Every change here is additive: existing
  // tools gain an empty chamber list, existing entries gain an empty chamber
  // record, and the readings already logged are left exactly where they were.
  // Nothing is moved and nothing is dropped, which is why data written before
  // chambers existed still opens correctly.
  if (storedShape < 2) {
    if (!DATA.chamberTypes) DATA.chamberTypes = [];
    for (var t = 0; t < DATA.tools.length; t++) {
      if (!DATA.tools[t].chambers) DATA.tools[t].chambers = [];
    }
    var dates = Object.keys(DATA.entries);
    for (var d = 0; d < dates.length; d++) {
      var day = DATA.entries[dates[d]];
      var toolIds = Object.keys(day);
      for (var k = 0; k < toolIds.length; k++) {
        if (!day[toolIds[k]].chambers) day[toolIds[k]].chambers = {};
      }
    }
    MIGRATION_CHANGED = true;
  }

  // Layout 2 -> 3 added per-chamber limit overrides. Nothing needs converting:
  // a chamber with no overrides simply has none, and the code reads a missing
  // list as "use the type's limits".
  //
  // The version still moves, on purpose. An older build would not know about
  // overrides and would quietly apply the TYPE's limits to a chamber that has
  // its own, which could show a reading as in range when it is not. A wrong
  // answer given confidently is worse than a refusal, so older builds are made
  // to refuse.

  if (DATA.version !== DATA_SHAPE) { DATA.version = DATA_SHAPE; MIGRATION_CHANGED = true; }

  // Note which version of the page has been handling this data. Data written
  // before versions existed has neither field, so fill them in.
  if (!DATA.createdWith) { DATA.createdWith = "before 1.2.0"; MIGRATION_CHANGED = true; }
  var previous = DATA.lastOpenedWith || "before 1.2.0";
  if (previous !== APP_VERSION) {
    noteUpgrade(previous, APP_VERSION);
    DATA.lastOpenedWith = APP_VERSION;
    MIGRATION_CHANGED = true;
  }
  return true;
}

// Read the saved data back out of the browser.
function load() {
  var raw = null;
  try {
    raw = window.localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    // Some browsers block storage on files opened from disk. Keep going in
    // memory so the page still works, but warn the user.
    STORAGE_OK = false;
    return;
  }
  if (!raw) return;                 // nothing saved yet, first ever run
  try {
    var parsed = JSON.parse(raw);
    if (parsed && parsed.tools && parsed.entries) {
      DATA = parsed;
      // If the data came from a newer version of this page, migrateData()
      // refuses and we back out to an empty set rather than risk touching it.
      // The real data stays untouched in storage: save() refuses to write
      // while VERSION_PROBLEM is set, and the banner says what to do.
      if (!migrateData()) {
        DATA = blankData();
      } else if (MIGRATION_CHANGED) {
        // Write the new version stamp back, so the record of which build last
        // touched this data is accurate rather than just correct in memory.
        save();
      }
    }
  } catch (e) {
    // The saved text was damaged. Rather than crash, start fresh but do not
    // overwrite the damaged text until the user saves something new.
    DATA = blankData();
  }
}

// Write the data back to the browser. Called after every change.
function save() {
  // If the stored data came from a newer version of this page, we must not
  // write over it. migrateData() has already emptied DATA in memory to avoid
  // showing half-understood data, so saving now would destroy the real thing.
  // The banner tells the user to go and find the newer file.
  if (VERSION_PROBLEM !== "") return;

  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    STORAGE_OK = true;
    STORAGE_PROBLEM = "";
  } catch (e) {
    STORAGE_OK = false;
    // A full storage slot and a browser that blocks storage outright are very
    // different problems, so tell them apart and say the right thing.
    STORAGE_PROBLEM = (e.name === "QuotaExceededError") ? "full" : "blocked";
  }
  renderBanner();
}

// How much of the allowance the data currently takes up, as a percentage.
function storagePercent() {
  var used;
  try { used = JSON.stringify(DATA).length; } catch (e) { return 0; }
  return Math.round((used / STORAGE_BUDGET) * 100);
}

// ---------------------------------------------------------------------------
// THE DIAGNOSTICS SLOT
//
// Errors, usage counters and upgrade history. Kept in its own storage slot,
// away from your readings. Everything here is capped so it cannot grow without
// bound, and everything here stays on this tablet unless you export it and
// send it on yourself.
// ---------------------------------------------------------------------------
var MAX_ERRORS = 20;
var MAX_UPGRADES = 10;

function blankDebug() {
  return {
    errors: [],     // {when, what, where, stack}
    upgrades: [],   // {when, from, to}
    stats: {}       // plain counters, see bump()
  };
}

// Read the diagnostics slot. Never throws: diagnostics failing must never stop
// the page you use to do your job.
function loadDebug() {
  try {
    var raw = window.localStorage.getItem(DEBUG_KEY);
    if (!raw) return blankDebug();
    var parsed = JSON.parse(raw);
    if (!parsed || !parsed.errors || !parsed.stats) return blankDebug();
    if (!parsed.upgrades) parsed.upgrades = [];
    return parsed;
  } catch (e) {
    return blankDebug();
  }
}

function saveDebug(debug) {
  try {
    window.localStorage.setItem(DEBUG_KEY, JSON.stringify(debug));
  } catch (e) {
    // Out of room, or storage blocked. Diagnostics are the first thing that
    // should be dropped when space runs short, so give up quietly.
  }
}

// Add one to a named counter. These record WHAT YOU DO, never what you
// measured: no reading value ever passes through here. They tell us which
// parts of the tool are actually used, so it can be improved in the right
// places.
function bump(name) {
  try {
    var debug = loadDebug();
    debug.stats[name] = (debug.stats[name] || 0) + 1;
    saveDebug(debug);
  } catch (e) { /* never let a counter break a round */ }
}

// Record that the page version changed under this data.
function noteUpgrade(from, to) {
  try {
    var debug = loadDebug();
    debug.upgrades.push({ when: todayStr(), from: from, to: to });
    while (debug.upgrades.length > MAX_UPGRADES) debug.upgrades.shift();
    saveDebug(debug);
  } catch (e) { /* ignore */ }
}

// ---------------------------------------------------------------------------
// Catch errors as they happen and keep the last few.
//
// This is always on, and that is the whole point. The error worth seeing is
// the one that happened mid-round on Tuesday, not one that can be reproduced
// on demand. Because it is written to the diagnostics slot, it survives
// closing the browser.
//
// Every part of this is wrapped, so a fault inside the error logger itself can
// never cascade into the page.
// ---------------------------------------------------------------------------
function recordError(what, where, stack) {
  try {
    var debug = loadDebug();
    debug.errors.push({
      when: nowStamp(),
      what: String(what).slice(0, 300),
      where: String(where || "").slice(0, 200),
      stack: String(stack || "").slice(0, 600)
    });
    while (debug.errors.length > MAX_ERRORS) debug.errors.shift();
    saveDebug(debug);
  } catch (e) { /* ignore */ }
}

window.onerror = function (message, source, lineNo, colNo, error) {
  var where = String(source || "").split("/").pop() + " line " + lineNo + ":" + colNo;
  recordError(message, where, error && error.stack);
  return false;   // let the browser log it to the console as well
};

window.onunhandledrejection = function (event) {
  var reason = event && event.reason;
  recordError(reason && reason.message ? reason.message : reason,
    "unhandled promise", reason && reason.stack);
};

// ---------------------------------------------------------------------------
// SMALL HELPERS FOR THE DATA
//
// Ids: every tool and every data point gets a short hidden id like "i7". The
// id, not the name, is what links a saved reading to its data point. That is
// why you can rename "Etcher 3" to "Etch 03" without losing its history.
// Ids never appear in the exported CSV, which stays fully readable.
// ---------------------------------------------------------------------------
function newId() {
  DATA.nextId = DATA.nextId + 1;
  return "i" + DATA.nextId;
}

// Find a tool by its id. Returns null if it is not there.
function findTool(toolId) {
  for (var i = 0; i < DATA.tools.length; i++) {
    if (DATA.tools[i].id === toolId) return DATA.tools[i];
  }
  return null;
}

// ---------------------------------------------------------------------------
// CHAMBERS
//
// A tool may have chambers. Each chamber has a TYPE, and the type carries the
// list of readings. So "PM1 is an Etch chamber" is all a chamber stores; what
// gets logged at PM1 comes from the Etch type.
//
// A tool can also have readings of its own, for things that belong to the
// whole machine rather than one chamber - facility nitrogen, chiller
// temperature, and so on.
// ---------------------------------------------------------------------------
function findChamberType(typeId) {
  for (var i = 0; i < DATA.chamberTypes.length; i++) {
    if (DATA.chamberTypes[i].id === typeId) return DATA.chamberTypes[i];
  }
  return null;
}

function findChamberTypeByName(name) {
  var want = String(name).trim().toLowerCase();
  for (var i = 0; i < DATA.chamberTypes.length; i++) {
    if (DATA.chamberTypes[i].name.trim().toLowerCase() === want) return DATA.chamberTypes[i];
  }
  return null;
}

function findChamber(tool, chamberId) {
  var chambers = tool.chambers || [];
  for (var i = 0; i < chambers.length; i++) {
    if (chambers[i].id === chamberId) return chambers[i];
  }
  return null;
}

function findChamberByName(tool, name) {
  var want = String(name).trim().toLowerCase();
  var chambers = tool.chambers || [];
  for (var i = 0; i < chambers.length; i++) {
    if (chambers[i].name.trim().toLowerCase() === want) return chambers[i];
  }
  return null;
}

// ---------------------------------------------------------------------------
// A chamber logs whatever its type says. Usually it also uses the type's
// limits - but not always. Two chambers can run the same process to different
// specs, so a chamber may override the min and max for any of its readings.
//
// An override is stored on the chamber, against the reading's id:
//
//     chamber.limits = { "i14": { min: 0, max: 600 } }
//
// A reading with no entry there uses the type's limits. Nothing else in the
// page needs to know about any of this: chamberPoints() hands back readings
// with the limits already resolved, so the entry form, the status chips and
// the export all just work.
// ---------------------------------------------------------------------------
function effectivePoint(chamber, point) {
  var overrides = chamber.limits || {};
  var own = overrides[point.id];
  if (!own) return point;

  // A copy, so overriding one chamber never edits the type everyone shares.
  //
  // Everything that is not a limit must be carried across. Forgetting isLife
  // here made an overridden chamber vanish from the fleet summary - not an
  // error, just a missing row in an email sent to the group.
  return {
    id: point.id,
    name: point.name,
    unit: point.unit,
    isLife: !!point.isLife,
    min: own.min === undefined ? null : own.min,
    max: own.max === undefined ? null : own.max,
    overridden: true
  };
}

// What a chamber logs, with its own limits applied. A chamber whose type has
// been deleted logs nothing rather than crashing.
function chamberPoints(chamber) {
  var type = findChamberType(chamber.typeId);
  if (!type) return [];
  var out = [];
  for (var i = 0; i < type.points.length; i++) {
    out.push(effectivePoint(chamber, type.points[i]));
  }
  return out;
}

// How many readings on this chamber are set differently from its type.
function countOverrides(chamber) {
  var type = findChamberType(chamber.typeId);
  if (!type) return 0;
  var overrides = chamber.limits || {};
  var n = 0;
  for (var i = 0; i < type.points.length; i++) {
    if (overrides[type.points[i].id]) n++;
  }
  return n;
}

// Set or clear one chamber's limits for one reading.
//
// If the numbers typed match the type exactly, the override is removed rather
// than kept as a copy. That keeps "uses the type" and "happens to agree with
// the type" from looking different when they are not.
function setChamberLimit(chamber, point, min, max) {
  if (!chamber.limits) chamber.limits = {};
  if (min === point.min && max === point.max) {
    delete chamber.limits[point.id];
    return;
  }
  chamber.limits[point.id] = { min: min, max: max };
}

function chamberTypeName(chamber) {
  var type = findChamberType(chamber.typeId);
  return type ? type.name : "no type set";
}

// ---------------------------------------------------------------------------
// A "unit" is one thing you fill in and save in one go: either the tool's own
// readings, or one chamber. Everything that walks a round - the status chips,
// the progress counts, the entry form, the export - works from this list, so
// there is exactly one place that decides what still has to be logged.
//
// A tool with no readings of its own contributes no tool unit, so a pure
// multi-chamber tool shows only its chambers and no empty extra row.
// ---------------------------------------------------------------------------
function toolUnits(tool) {
  var units = [];
  if (tool.points.length > 0) {
    units.push({ kind: "tool", id: "tool", name: "Tool readings",
                 typeName: "", points: tool.points });
  }
  var chambers = tool.chambers || [];
  for (var i = 0; i < chambers.length; i++) {
    units.push({ kind: "chamber", id: chambers[i].id, name: chambers[i].name,
                 typeName: chamberTypeName(chambers[i]),
                 points: chamberPoints(chambers[i]) });
  }
  return units;
}

// The units you can actually fill in. A chamber whose type has no readings yet
// has nothing to type and no way to save, so it is not part of the round.
//
// This distinction matters more than it looks. Counting a chamber that cannot
// be completed leaves a tool stuck at "0 of 3" for ever, which also means the
// round never reaches complete and the export prompt never appears. The
// unusable chambers are still SHOWN on the tool screen, marked "Not set up",
// because hiding them would be a good way never to finish setting them up.
function loggableUnits(tool) {
  var units = toolUnits(tool);
  var out = [];
  for (var i = 0; i < units.length; i++) {
    if (units[i].points.length > 0) out.push(units[i]);
  }
  return out;
}

// The saved readings for one unit on one date, or null if it has not been
// saved yet. Tool readings live directly on the entry, which is how they were
// stored before chambers existed - that is why old data still reads correctly.
function unitEntry(toolId, unitId, date) {
  var day = DATA.entries[date];
  var entry = day ? day[toolId] : null;
  if (!entry) return null;

  if (unitId === "tool") {
    // An entry that only holds chamber readings has no tool-level save time,
    // so an empty savedAt means the tool readings were never entered.
    if (!entry.savedAt) return null;
    return { savedAt: entry.savedAt, values: entry.values || {} };
  }
  var chambers = entry.chambers || {};
  return chambers[unitId] || null;
}

// Make sure the entry object for one tool on one date exists, and hand it back.
function ensureEntry(toolId, date) {
  if (!DATA.entries[date]) DATA.entries[date] = {};
  if (!DATA.entries[date][toolId]) {
    DATA.entries[date][toolId] = { savedAt: "", values: {}, chambers: {} };
  }
  var entry = DATA.entries[date][toolId];
  if (!entry.chambers) entry.chambers = {};
  if (!entry.values) entry.values = {};
  return entry;
}

// Store one unit's readings.
function saveUnitValues(toolId, unitId, date, values) {
  var entry = ensureEntry(toolId, date);
  if (unitId === "tool") {
    entry.savedAt = nowStamp();
    entry.values = values;
  } else {
    entry.chambers[unitId] = { savedAt: nowStamp(), values: values };
  }
}

// Find a data point inside one tool, by its id.
function findPoint(tool, pointId) {
  for (var i = 0; i < tool.points.length; i++) {
    if (tool.points[i].id === pointId) return tool.points[i];
  }
  return null;
}

// Find a tool by name, ignoring case and spare spaces. Used when importing,
// because a file coming back in has names in it, not ids.
function findToolByName(name) {
  var want = String(name).trim().toLowerCase();
  for (var i = 0; i < DATA.tools.length; i++) {
    if (DATA.tools[i].name.trim().toLowerCase() === want) return DATA.tools[i];
  }
  return null;
}

function findPointByName(tool, name) {
  var want = String(name).trim().toLowerCase();
  for (var i = 0; i < tool.points.length; i++) {
    if (tool.points[i].name.trim().toLowerCase() === want) return tool.points[i];
  }
  return null;
}

// Today's date on this tablet, as YYYY-MM-DD. We build it by hand rather than
// using toISOString(), because that one converts to UTC and can hand you
// yesterday's date late in the evening.
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

// A timestamp for when a reading was saved: "2026-08-24 09:12".
function nowStamp() {
  var d = new Date();
  return todayStr() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

function pad2(n) { return (n < 10 ? "0" : "") + n; }

// Move a YYYY-MM-DD date string forward or back by a number of days.
function shiftDate(dateStr, days) {
  var bits = dateStr.split("-");
  var d = new Date(Number(bits[0]), Number(bits[1]) - 1, Number(bits[2]));
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

// How many whole days between two YYYY-MM-DD dates.
function daysBetween(fromStr, toStr) {
  var a = fromStr.split("-"), b = toStr.split("-");
  var from = new Date(Number(a[0]), Number(a[1]) - 1, Number(a[2]));
  var to = new Date(Number(b[0]), Number(b[1]) - 1, Number(b[2]));
  return Math.round((to - from) / 86400000);
}

// ---------------------------------------------------------------------------
// LIMIT CHECKING
//
// Each data point may have a min, a max, both, or neither. Leave them blank
// and nothing is checked. A reading is NEVER blocked or refused because of a
// limit. You record what the tool screen actually says, good or bad.
//
// Returns one of:
//   ""      nothing to say (no value typed, or no limits set)
//   "OK"    inside the limits
//   "LOW"   below the min
//   "HIGH"  above the max
// ---------------------------------------------------------------------------
function rangeStatus(value, point) {
  if (value === undefined || value === null || String(value).trim() === "") return "";
  if (point.min === null && point.max === null) return "";
  var n = Number(value);
  if (isNaN(n)) return "";
  if (point.min !== null && n < point.min) return "LOW";
  if (point.max !== null && n > point.max) return "HIGH";
  return "OK";
}

// Turns a status into the CSS class that colours it.
function statusClass(status) {
  if (status === "OK") return "ok";
  if (status === "LOW" || status === "HIGH") return "bad";
  return "blank";
}

// Turns a status into words for the screen.
function statusText(status, point) {
  if (status === "OK") return "In range";
  if (status === "LOW") return "Below min " + point.min;
  if (status === "HIGH") return "Above max " + point.max;
  return "";
}

// Describes a point's limits in plain words, for the hint under an input.
function limitHint(point) {
  // Say when a limit belongs to this chamber alone, so nobody has to wonder
  // why the identical chamber next door flags at a different number.
  var whose = point.overridden ? " (set for this chamber)" : "";
  if (point.min !== null && point.max !== null) {
    return "Expected " + point.min + " to " + point.max + whose;
  }
  if (point.min !== null) return "Expected " + point.min + " or above" + whose;
  if (point.max !== null) return "Expected " + point.max + " or below" + whose;
  return point.overridden ? "No limits, set for this chamber" : "No limits set";
}

// ---------------------------------------------------------------------------
// LIFE REMAINING
//
// Most readings have a max meaning "flag it if the value goes above this". A
// few mean something different: the value counts UP towards a rated life, and
// what you actually care about is how much is left. Kit life, target life, RF
// energy - all of them count up until the part is replaced.
//
// The two cannot be told apart from the numbers. A chamber pressure of 8 to 12
// and a kit rated to 500 kW-hrs look identical to the code, which is why a
// reading has to be MARKED as a consumable rather than guessed at. Guessing
// would report "22% remaining" for a chamber pressure, in an email sent to
// the whole group.
// ---------------------------------------------------------------------------

// How much life is left, as a percentage. Returns null - shown as N/A - when
// the question does not apply: not a consumable, no rated life set, or nothing
// logged yet.
//
// Going past the rated life gives a NEGATIVE number rather than stopping at
// zero. A kit at 130% of its life reads -30%, because "used up" and "thirty
// percent overdue" are different things to know.
function lifeRemaining(value, point) {
  if (!point || !point.isLife) return null;
  if (point.max === null || point.max === undefined) return null;
  if (Number(point.max) <= 0) return null;          // a life of zero has no meaning
  if (value === undefined || value === null || String(value).trim() === "") return null;
  var used = Number(value);
  if (isNaN(used)) return null;
  return ((Number(point.max) - used) / Number(point.max)) * 100;
}

// The colouring thresholds, with fallbacks so data written before 1.8.0 opens
// unchanged.
function lifeRedBelow() {
  var n = Number(DATA.lifeRedBelow);
  return isNaN(n) ? 15 : n;
}
function lifeAmberBelow() {
  var n = Number(DATA.lifeAmberBelow);
  return isNaN(n) ? 25 : n;
}

// "red", "amber", "ok", or "" for nothing to say.
function lifeStatus(percent) {
  if (percent === null) return "";
  if (percent < lifeRedBelow()) return "red";
  if (percent < lifeAmberBelow()) return "amber";
  return "ok";
}

// The most recent reading on or before a date, and the day it came from.
// Returns null if there has never been one.
//
// Dates are YYYY-MM-DD, so comparing them as text sorts them correctly and
// there is no need to turn them into Date objects.
function latestValue(toolId, unitId, pointId, onOrBefore) {
  var dates = Object.keys(DATA.entries).sort();
  var found = null;
  for (var i = 0; i < dates.length; i++) {
    if (dates[i] > onOrBefore) break;               // sorted, so nothing later matters
    var entry = unitEntry(toolId, unitId, dates[i]);
    if (!entry) continue;
    var value = entry.values[pointId];
    if (value === undefined || String(value).trim() === "") continue;
    found = { value: value, date: dates[i] };       // keep going: later wins
  }
  return found;
}

// The consumable readings across the whole fleet, by name, in the order they
// were first defined. These become the columns of the fleet table.
function lifeMetrics() {
  var seen = {};
  var out = [];

  function consider(point) {
    if (!point.isLife) return;
    var key = "n:" + point.name.trim().toLowerCase();
    if (seen[key] === true) return;
    seen[key] = true;
    out.push(point.name.trim());
  }

  for (var y = 0; y < DATA.chamberTypes.length; y++) {
    for (var q = 0; q < DATA.chamberTypes[y].points.length; q++) consider(DATA.chamberTypes[y].points[q]);
  }
  for (var t = 0; t < DATA.tools.length; t++) {
    for (var p = 0; p < DATA.tools[t].points.length; p++) consider(DATA.tools[t].points[p]);
  }
  return out;
}

// ---------------------------------------------------------------------------
// The fleet table: one row per chamber, one column per consumable.
//
// Built once here and rendered twice - on the Today tab and into the email -
// so what you look at each morning is exactly what your colleagues receive.
// ---------------------------------------------------------------------------
function fleetLife(date) {
  var metrics = lifeMetrics();
  var rows = [];
  var lastUpdated = "";
  var stale = [];

  for (var t = 0; t < DATA.tools.length; t++) {
    var tool = DATA.tools[t];
    var units = toolUnits(tool);

    for (var u = 0; u < units.length; u++) {
      var unit = units[u];
      var cells = [];
      var anyValue = false;
      var rowDate = "";

      for (var m = 0; m < metrics.length; m++) {
        // Does this unit take this reading at all? Limits come from
        // chamberPoints(), so a chamber's own rating is already applied.
        var point = null;
        for (var i = 0; i < unit.points.length; i++) {
          if (unit.points[i].name.trim().toLowerCase() === metrics[m].toLowerCase()) {
            point = unit.points[i];
          }
        }
        if (!point || !point.isLife) { cells.push({ percent: null, status: "" }); continue; }

        var latest = latestValue(tool.id, unit.id, point.id, date);
        if (!latest) { cells.push({ percent: null, status: "" }); continue; }

        var percent = lifeRemaining(latest.value, point);
        cells.push({
          percent: percent,
          status: lifeStatus(percent),
          value: latest.value,
          max: point.max,
          unit: point.unit || "",
          when: latest.date
        });
        anyValue = true;
        if (latest.date > rowDate) rowDate = latest.date;
        if (latest.date > lastUpdated) lastUpdated = latest.date;
      }

      // A unit that takes none of these readings is left out entirely, rather
      // than filling the table with rows that are N/A all the way across.
      var takesAny = false;
      for (var c = 0; c < cells.length; c++) if (cells[c].percent !== null) takesAny = true;
      if (!takesAny && !unitTakesAnyMetric(unit, metrics)) continue;

      if (anyValue && rowDate !== "" && daysBetween(rowDate, date) > 14) {
        stale.push(tool.name + " / " + unit.name + " (" + daysBetween(rowDate, date) + " days)");
      }

      rows.push({ tool: tool.name, unit: unit.name, kind: unit.kind, cells: cells, when: rowDate });
    }
  }

  return { metrics: metrics, rows: rows, lastUpdated: lastUpdated, stale: stale };
}

// Does this unit take any of the fleet's consumable readings? Used to decide
// whether a row belongs in the table at all, even before anything is logged.
function unitTakesAnyMetric(unit, metrics) {
  for (var i = 0; i < unit.points.length; i++) {
    if (!unit.points[i].isLife) continue;
    for (var m = 0; m < metrics.length; m++) {
      if (unit.points[i].name.trim().toLowerCase() === metrics[m].toLowerCase()) return true;
    }
  }
  return false;
}

// ---------------------------------------------------------------------------
// Render the fleet table.
//
// One renderer for both places it appears. The colours are written as inline
// styles as well as classes, because an email client pasting this from the
// clipboard has no stylesheet to consult - Outlook keeps inline styles and
// throws everything else away.
// ---------------------------------------------------------------------------
function fleetTableHtml(fleet) {
  if (fleet.metrics.length === 0) {
    return '<p class="hint">No readings are marked as counting up to a limit yet. '
      + 'Tick "Counts up to a limit" on a reading in the Tools tab - kit life, '
      + 'target life - and it appears here as a percentage remaining.</p>';
  }
  if (fleet.rows.length === 0) {
    return '<p class="hint">Nothing takes those readings yet.</p>';
  }

  var html = '<div class="fleetwrap"><table class="fleet">'
    + '<tr><th>Tool</th><th>Chamber</th>';
  for (var m = 0; m < fleet.metrics.length; m++) {
    html += '<th style="text-align:right">' + esc(fleet.metrics[m]) + ' % remain</th>';
  }
  html += '</tr>';

  var lastTool = null;
  for (var r = 0; r < fleet.rows.length; r++) {
    var row = fleet.rows[r];
    // The tool name is written once per group, as in the sheet you send.
    var toolCell = (row.tool === lastTool) ? "" : esc(row.tool);
    lastTool = row.tool;

    html += '<tr><td class="tool" style="text-align:left;font-weight:600">' + toolCell + '</td>'
      + '<td class="name" style="text-align:left">' + esc(row.unit) + '</td>';

    for (var c = 0; c < row.cells.length; c++) {
      var cell = row.cells[c];
      if (cell.percent === null) {
        html += '<td class="na" style="text-align:left;color:#5b6570">N/A</td>';
        continue;
      }
      var shade = cell.status === "red" ? ' style="text-align:right;background:#f8cbcb;color:#7d0000;font-weight:700"'
        : cell.status === "amber" ? ' style="text-align:right;background:#f2e6a8;color:#6b4e00;font-weight:700"'
        : ' style="text-align:right"';
      html += '<td class="' + cell.status + '"' + shade + '>'
        + Math.round(cell.percent) + '%</td>';
    }
    html += '</tr>';
  }

  return html + '</table></div>';
}

// ---------------------------------------------------------------------------
// WHAT HAS BEEN LOGGED
//
// Works out, for one tool on one date, whether it has been logged and how
// many of its readings fell outside their limits.
// ---------------------------------------------------------------------------
// One unit's status: has it been saved, and how many readings were outside
// their limits.
function unitStatus(tool, unit, date) {
  var entry = unitEntry(tool.id, unit.id, date);
  if (!entry) return { logged: false, outOfRange: 0, savedAt: "" };

  var outOfRange = 0;
  for (var i = 0; i < unit.points.length; i++) {
    var status = rangeStatus(entry.values[unit.points[i].id], unit.points[i]);
    if (status === "LOW" || status === "HIGH") outOfRange++;
  }
  return { logged: true, outOfRange: outOfRange, savedAt: entry.savedAt || "" };
}

// A whole tool's status, adding up its units. A tool counts as logged only
// once every one of its units is in, so a four-chamber etcher with three
// chambers done still shows as outstanding on the round.
function toolStatus(tool, date) {
  var units = loggableUnits(tool);
  var done = 0;
  var outOfRange = 0;
  var savedAt = "";

  for (var i = 0; i < units.length; i++) {
    var st = unitStatus(tool, units[i], date);
    if (!st.logged) continue;
    done++;
    outOfRange += st.outOfRange;
    if (st.savedAt > savedAt) savedAt = st.savedAt;   // dates sort as text
  }

  return {
    // A tool with nothing set up yet is not "logged", but it is not part of
    // the round either. See countTotal().
    logged: units.length > 0 && done === units.length,
    ready: units.length > 0,
    done: done,
    total: units.length,
    outOfRange: outOfRange,
    savedAt: savedAt
  };
}

// How many tools are fully logged on a given date.
function countLogged(date) {
  var n = 0;
  for (var i = 0; i < DATA.tools.length; i++) {
    if (toolStatus(DATA.tools[i], date).logged) n++;
  }
  return n;
}

// How many tools are actually part of the round. A tool with no readings and
// no chambers is left out of the count rather than making the round
// permanently impossible to finish.
function countTotal(date) {
  var n = 0;
  for (var i = 0; i < DATA.tools.length; i++) {
    if (toolStatus(DATA.tools[i], date).ready) n++;
  }
  return n;
}

// The next unit within one tool that still needs doing.
function nextUnitInTool(tool, date, afterUnitId) {
  var units = loggableUnits(tool);
  var seen = false;
  var i;
  for (i = 0; i < units.length; i++) {
    if (units[i].id === afterUnitId) { seen = true; continue; }
    if (!seen) continue;
    if (!unitStatus(tool, units[i], date).logged) return units[i];
  }
  for (i = 0; i < units.length; i++) {
    if (units[i].id === afterUnitId) continue;
    if (!unitStatus(tool, units[i], date).logged) return units[i];
  }
  return null;
}

// The next tool on the round that has not been logged yet. Used by the
// "Save and next tool" button so the round drives itself.
function nextUnlogged(date, afterToolId) {
  var seenCurrent = false;
  var i, tool;
  // First look after the tool we are on, so the round keeps its order.
  for (i = 0; i < DATA.tools.length; i++) {
    tool = DATA.tools[i];
    if (tool.id === afterToolId) { seenCurrent = true; continue; }
    if (!seenCurrent) continue;
    if (toolStatus(tool, date).ready && !toolStatus(tool, date).logged) return tool;
  }
  // Then wrap round to the start and pick up anything skipped.
  for (i = 0; i < DATA.tools.length; i++) {
    tool = DATA.tools[i];
    if (tool.id === afterToolId) continue;
    if (toolStatus(tool, date).ready && !toolStatus(tool, date).logged) return tool;
  }
  return null;
}

// ---------------------------------------------------------------------------
// WHICH SCREEN IS SHOWING
//
// There are four screens. Three are tabs. The fourth, the entry form, opens
// when you tap a tool and closes when you save or cancel.
// ---------------------------------------------------------------------------
var VIEW = "today";          // "today", "entry", "tools" or "data"
var CURRENT_DATE = todayStr();  // the date the Today tab is showing
var CURRENT_TOOL = null;     // id of the tool being worked on
var CURRENT_UNIT = null;     // id of the unit being entered: "tool" or a chamber id

function showTab(name) {
  VIEW = name;
  CURRENT_TOOL = null;
  CURRENT_UNIT = null;
  if (name !== "tools") { OPEN_LIMITS = {}; OPEN_SECTIONS = {}; }
  render();
}

// Draw whichever screen is current, plus the banner and the tab highlights.
function render() {
  document.getElementById("viewToday").className = "view" + (VIEW === "today" ? " active" : "");
  document.getElementById("viewTool").className  = "view" + (VIEW === "tool"  ? " active" : "");
  document.getElementById("viewEntry").className = "view" + (VIEW === "entry" ? " active" : "");
  document.getElementById("viewTools").className = "view" + (VIEW === "tools" ? " active" : "");
  document.getElementById("viewData").className  = "view" + (VIEW === "data"  ? " active" : "");

  // The Today tab stays highlighted while the entry form is open, because the
  // entry form is part of doing the round.
  document.getElementById("tabToday").className =
    (VIEW === "today" || VIEW === "tool" || VIEW === "entry") ? "active" : "";
  document.getElementById("tabTools").className = (VIEW === "tools") ? "active" : "";
  document.getElementById("tabData").className  = (VIEW === "data")  ? "active" : "";

  if (VIEW === "today") renderToday();
  if (VIEW === "tool")  renderToolScreen();
  if (VIEW === "entry") renderEntry();
  if (VIEW === "tools") renderTools();
  if (VIEW === "data")  renderData();
  renderBanner();
}

// ---------------------------------------------------------------------------
// THE EXPORT REMINDER BANNER
//
// This is the most important safety feature in the tool. Browser storage is
// not a database. It disappears if anyone clears browsing data or the tablet
// is re-imaged, with no warning and no undo. So the page nags you, gently at
// first and then loudly, until you export.
//
// To change how patient it is, edit the day numbers below.
// ---------------------------------------------------------------------------
function renderBanner() {
  var banner = document.getElementById("banner");
  var readings = countAllReadings();

  // An old copy of the page opened against newer data beats everything else:
  // carry on and you would damage data you cannot get back.
  if (VERSION_PROBLEM !== "") {
    banner.className = "banner show bad";
    banner.innerHTML = "<span>" + esc(VERSION_PROBLEM) + "</span>";
    return;
  }

  // A failed save beats every other message: the round in front of you is at
  // risk right now, not at some point in the future.
  if (!STORAGE_OK) {
    banner.className = "banner show bad";
    banner.innerHTML = "<span>" + (STORAGE_PROBLEM === "full"
        ? "This tablet's storage for local pages is FULL, so your last entry may not have saved. "
          + "Export everything now, then use Erase all data to start a clean slate."
        : "This browser is blocking local storage, so nothing will be remembered after you close "
          + "this page. Export before you close it.")
      + "</span><button class=\"small\" onclick=\"exportAllCsv()\">Export everything</button>";
    return;
  }

  // Opened straight out of a zip. Worth interrupting for once, because the fix
  // takes ten seconds and the alternative is the tool disappearing.
  if (runningFromTempFolder()) {
    banner.className = "banner show warn";
    banner.innerHTML = "<span>This page is running from a temporary Windows folder, "
      + "probably opened from inside the zip. Windows deletes that folder eventually. "
      + "Extract the zip properly and open it from there instead. Your readings are safe "
      + "either way.</span>";
    return;
  }

  // Getting close to full. Years away at a normal round size, but say so early
  // rather than letting a save fail mid-round.
  if (storagePercent() >= 80) {
    banner.className = "banner show warn";
    banner.innerHTML = "<span>Storage for local pages is " + storagePercent() + "% full. "
      + "Export everything, then erase and re-import just the recent months.</span>"
      + "<button class=\"small\" onclick=\"exportAllCsv()\">Export everything</button>";
    return;
  }

  // Nothing logged yet, so nothing to lose. Stay out of the way.
  if (readings === 0) { banner.className = "banner"; banner.innerHTML = ""; return; }

  var text, tone;
  if (DATA.lastExport === "") {
    tone = "bad";
    text = "You have never exported. The only copy of these readings is in this browser.";
  } else {
    var days = daysBetween(DATA.lastExport, todayStr());
    if (days <= 0)      { tone = "calm"; text = "Exported today. You are backed up."; }
    else if (days === 1){ tone = "warn"; text = "Last export was yesterday."; }
    else if (days < 3)  { tone = "warn"; text = "Last export was " + days + " days ago."; }
    else                { tone = "bad";  text = "Last export was " + days + " days ago. Export now."; }
  }

  banner.className = "banner show " + tone;
  banner.innerHTML = "<span>" + esc(text) + "</span>"
    + "<button class=\"small\" onclick=\"exportRoundCsv()\">Export now</button>";
}

// Total number of readings actually typed in, across every day.
function countAllReadings() {
  var total = 0;
  var dates = Object.keys(DATA.entries);
  for (var d = 0; d < dates.length; d++) {
    var day = DATA.entries[dates[d]];
    var toolIds = Object.keys(day);
    for (var t = 0; t < toolIds.length; t++) {
      var entry = day[toolIds[t]];
      total += countFilled(entry.values || {});
      var chamberIds = Object.keys(entry.chambers || {});
      for (var c = 0; c < chamberIds.length; c++) {
        total += countFilled(entry.chambers[chamberIds[c]].values);
      }
    }
  }
  return total;
}

// ---------------------------------------------------------------------------
// SCREEN 1: TODAY
//
// The round itself. Shows the date, how many tools are done, and one big row
// per tool. Tools you have not logged sort to the top so you can work down
// the list without thinking about it.
// ---------------------------------------------------------------------------
function renderToday() {
  var host = document.getElementById("viewToday");

  // No tools set up yet. Point the user at the Tools tab instead of showing
  // them an empty list with no explanation.
  if (DATA.tools.length === 0) {
    host.innerHTML =
      '<div class="card">'
      + '<h2>No tools set up yet</h2>'
      + '<p class="hint">Before you can log a round, tell the tool which machines you '
      + 'walk and which readings you take at each one. You only do this once.</p>'
      + '<div class="big-actions">'
      + '<button onclick="showTab(\'tools\')">Set up my tools</button>'
      + '<button class="secondary" onclick="loadExample()">Load an example setup to try it</button>'
      + '</div></div>';
    return;
  }

  var done = countLogged(CURRENT_DATE);
  var total = countTotal(CURRENT_DATE);
  var isToday = (CURRENT_DATE === todayStr());

  var html = '<div class="card">';

  // Date picker with a day back / day forward button either side, so you can
  // review yesterday or fill in a day you missed.
  html += '<div class="row">'
    + '<button class="secondary small" onclick="stepDate(-1)">&#9664; Day</button>'
    + '<div class="grow"><input type="date" id="dateBox" value="' + esc(CURRENT_DATE) + '" onchange="pickDate(this.value)"></div>'
    + '<button class="secondary small" onclick="stepDate(1)">Day &#9654;</button>'
    + '</div>';

  if (!isToday) {
    html += '<p class="hint" style="margin-top:10px">You are looking at a past date, not today. '
      + '<a href="#" onclick="pickDate(todayStr());return false;">Jump back to today</a>.</p>';
  }

  html += '<div class="spread" style="margin-top:12px">'
    + '<strong>' + done + ' of ' + total + ' tools logged</strong>'
    + '</div></div>';

  // When the round is finished, offer the export right here rather than
  // making the user go and find the Data tab.
  if (total > 0 && done === total) {
    html += '<div class="card" style="background:var(--ok-bg);border-color:#b7dfb9">'
      + '<h2>Round complete</h2>'
      + '<p class="hint">Every tool is logged for this date. Get the readings off the tablet now, '
      + 'while you are thinking about it.</p>'
      + '<div class="big-actions"><button onclick="exportRoundCsv()">Export this round</button></div>'
      + '</div>';
  }

  html += fleetCardHtml();

  // Build the list: not-logged tools first, then logged ones. Within each
  // group the tools keep the order you set up on the Tools tab.
  var pending = [];
  var complete = [];
  for (var i = 0; i < DATA.tools.length; i++) {
    var tool = DATA.tools[i];
    if (toolStatus(tool, CURRENT_DATE).logged) complete.push(tool); else pending.push(tool);
  }

  html += '<div class="card"><h2>Tools</h2>';
  html += '<p class="hint">Tap a tool to enter its readings. Tools still to do are at the top.</p>';
  html += pending.concat(complete).map(toolRowHtml).join("");
  html += '</div>';

  host.innerHTML = html;
}

// Whether the fleet summary on the Today tab is open. Open by default: you
// asked to see it before starting a round. Collapsible because twelve chambers
// of table between you and the round is a lot of thumb on a tablet.
var FLEET_OPEN = true;

function toggleFleet() {
  FLEET_OPEN = !FLEET_OPEN;
  render();
}

// The fleet summary card, above the round. Nothing to show if no reading has
// been marked as counting up to a limit, in which case it stays out of the way
// entirely rather than explaining itself every morning.
function fleetCardHtml() {
  var fleet = fleetLife(CURRENT_DATE);
  if (fleet.metrics.length === 0) return "";

  var low = 0;
  for (var r = 0; r < fleet.rows.length; r++) {
    for (var c = 0; c < fleet.rows[r].cells.length; c++) {
      var st = fleet.rows[r].cells[c].status;
      if (st === "red" || st === "amber") low++;
    }
  }

  var headline = low === 0
    ? "nothing low"
    : low + (low === 1 ? " reading low" : " readings low");

  var html = '<div class="card"' + (low > 0
      ? ' style="background:var(--warn-bg);border-color:#f0cf9a"' : '') + '>'
    + '<div class="spread">'
    + '<h2 style="margin:0">Life remaining &mdash; ' + headline + '</h2>'
    + '<button class="secondary small" onclick="toggleFleet()">'
    + (FLEET_OPEN ? 'Hide' : 'Show') + '</button></div>';

  if (!FLEET_OPEN) return html + '</div>';

  html += '<p class="hint" style="margin:8px 0">'
    + (fleet.lastUpdated === ""
        ? 'Nothing logged yet.'
        : 'Last updated ' + esc(fleet.lastUpdated) + '.')
    + ' Under ' + lifeRedBelow() + '% is red, under ' + lifeAmberBelow() + '% amber.</p>'
    + fleetTableHtml(fleet);

  if (fleet.stale.length > 0) {
    html += '<p class="hint" style="margin-top:10px"><strong>Not logged recently:</strong> '
      + esc(fleet.stale.join(", ")) + '. Those percentages are as of the last reading, '
      + 'not today.</p>';
  }

  return html + '</div>';
}

// One row in the tool list on the Today tab.
function toolRowHtml(tool) {
  var st = toolStatus(tool, CURRENT_DATE);
  var chambers = (tool.chambers || []).length;
  var rowClass = "toolrow";
  var chip;
  var sub;

  if (!st.ready) {
    // Nothing set up on this tool yet, so it is not part of the round.
    return '<button class="toolrow" onclick="showTab(\'tools\')">'
      + '<span><span class="name">' + esc(tool.name) + '</span>'
      + '<span class="sub">No readings or chambers set up yet</span></span>'
      + '<span class="chip todo">Not set up</span></button>';
  }

  // What the tool is made of, so a four-chamber etcher says so on the round.
  var parts = [];
  if (chambers > 0) parts.push(chambers + (chambers === 1 ? " chamber" : " chambers"));
  if (tool.points.length > 0) parts.push(tool.points.length
    + (tool.points.length === 1 ? " tool reading" : " tool readings"));
  sub = parts.join(" \u00b7 ");

  if (!st.logged) {
    chip = '<span class="chip todo">' + st.done + ' of ' + st.total + ' done</span>';
    // Part way through is worth showing differently from not started at all.
    if (st.done > 0) sub = sub + " \u00b7 part done";
  } else if (st.outOfRange > 0) {
    rowClass += " attention";
    chip = '<span class="chip bad">' + st.outOfRange + ' out of range</span>';
    sub = "Logged " + esc(shortTime(st.savedAt)) + " \u00b7 " + sub;
  } else {
    rowClass += " done";
    chip = '<span class="chip ok">Logged</span>';
    sub = "Logged " + esc(shortTime(st.savedAt)) + " \u00b7 " + sub;
  }

  return '<button class="' + rowClass + '" onclick="openTool(\'' + tool.id + '\')">'
    + '<span><span class="name">' + esc(tool.name) + '</span>'
    + '<span class="sub">' + sub + '</span></span>'
    + chip + '</button>';
}

// Pull just the time out of a "2026-08-24 09:12" stamp.
function shortTime(stamp) {
  var bits = String(stamp).split(" ");
  return bits.length > 1 ? bits[1] : stamp;
}

function stepDate(days) { pickDate(shiftDate(CURRENT_DATE, days)); }

function pickDate(dateStr) {
  if (!dateStr) return;
  CURRENT_DATE = dateStr;
  VIEW = "today";
  render();
}

// ---------------------------------------------------------------------------
// SCREEN 2: THE ENTRY FORM
//
// One big numeric box per reading. Values colour themselves as you type, but
// nothing is ever refused. If a tool reads badly, you record the bad number.
// ---------------------------------------------------------------------------
// Tapping a tool on the round. A tool with chambers shows its list of
// chambers first. A tool without chambers goes straight into its readings, so
// nothing changes for the simple case: one tap, start typing.
function openTool(toolId) {
  var tool = findTool(toolId);
  if (!tool) return;
  CURRENT_TOOL = toolId;

  // Straight into the readings when there is only one thing to fill in, and
  // nothing else to look at.
  var usable = loggableUnits(tool);
  if (usable.length === 1 && toolUnits(tool).length === 1) {
    openUnit(toolId, usable[0].id);
    return;
  }

  VIEW = "tool";
  CURRENT_UNIT = null;
  render();
}

function openUnit(toolId, unitId) {
  CURRENT_TOOL = toolId;
  CURRENT_UNIT = unitId;
  VIEW = "entry";
  bump("entryScreensOpened");
  render();
}

// Find one unit on the current tool by its id.
function findUnit(tool, unitId) {
  var units = toolUnits(tool);
  for (var i = 0; i < units.length; i++) {
    if (units[i].id === unitId) return units[i];
  }
  return null;
}

// ---------------------------------------------------------------------------
// THE TOOL SCREEN
//
// Only shown for a tool that has more than one thing to log. Lists the tool's
// own readings and each chamber as its own row, with the same done / not done
// chips used on the round itself.
// ---------------------------------------------------------------------------
function renderToolScreen() {
  var host = document.getElementById("viewTool");
  var tool = findTool(CURRENT_TOOL);
  if (!tool) { showTab("today"); return; }

  var st = toolStatus(tool, CURRENT_DATE);
  var usable = loggableUnits(tool);

  // Anything with nothing to log goes to the bottom, out of the way of the
  // round, but still visible so it gets finished off.
  var notSetUp = [];
  var all = toolUnits(tool);
  for (var n = 0; n < all.length; n++) {
    if (all[n].points.length === 0) notSetUp.push(all[n]);
  }

  var html = '<div class="card">'
    + '<div class="spread"><h2 style="margin:0">' + esc(tool.name) + '</h2>'
    + '<span class="count">' + esc(CURRENT_DATE) + '</span></div>'
    + '<p class="hint" style="margin-top:8px">'
    + (st.total === 0
        ? 'Nothing is set up to log on this tool yet.'
        : st.done + ' of ' + st.total + ' done. Tap one to enter its readings.')
    + '</p></div>';

  if (usable.length > 0) {
    html += '<div class="card">';
    for (var i = 0; i < usable.length; i++) html += unitRowHtml(tool, usable[i]);
    html += '</div>';
  }

  if (notSetUp.length > 0) {
    html += '<div class="card">'
      + '<h2>Not set up yet</h2>'
      + '<p class="hint">' + notSetUp.length
      + (notSetUp.length === 1 ? ' chamber has' : ' chambers have')
      + ' no readings to log, so they are not counted on the round. '
      + 'Give their chamber type some readings on the Tools tab.</p>';
    for (var m = 0; m < notSetUp.length; m++) html += unitRowHtml(tool, notSetUp[m]);
    html += '</div>';
  }

  html += '<div class="card"><div class="big-actions">';
  if (st.logged) {
    var next = nextUnlogged(CURRENT_DATE, tool.id);
    if (next) {
      html += '<button onclick="openTool(\'' + next.id + '\')">Next tool ('
        + esc(next.name) + ')</button>';
    }
  }
  html += '<button class="secondary" onclick="showTab(\'today\')">Back to the round</button>'
    + '</div></div>';

  host.innerHTML = html;
}

// One row on the tool screen: the tool's own readings, or one chamber.
function unitRowHtml(tool, unit) {
  var st = unitStatus(tool, unit, CURRENT_DATE);
  var rowClass = "toolrow";
  var chip;
  var sub;

  if (unit.points.length === 0) {
    return '<button class="toolrow" onclick="showTab(\'tools\')">'
      + '<span><span class="name">' + esc(unit.name) + '</span>'
      + '<span class="sub">' + (unit.kind === "chamber"
          ? 'Its type "' + esc(unit.typeName) + '" has no readings yet'
          : 'No readings set up') + '</span></span>'
      + '<span class="chip todo">Not set up</span></button>';
  }

  sub = (unit.kind === "chamber" ? esc(unit.typeName) + " \u00b7 " : "")
    + unit.points.length + (unit.points.length === 1 ? " reading" : " readings");

  if (!st.logged) {
    chip = '<span class="chip todo">Not logged</span>';
  } else if (st.outOfRange > 0) {
    rowClass += " attention";
    chip = '<span class="chip bad">' + st.outOfRange + ' out of range</span>';
    sub = "Logged " + esc(shortTime(st.savedAt)) + " \u00b7 " + sub;
  } else {
    rowClass += " done";
    chip = '<span class="chip ok">Logged</span>';
    sub = "Logged " + esc(shortTime(st.savedAt)) + " \u00b7 " + sub;
  }

  return '<button class="' + rowClass + '" onclick="openUnit(\'' + tool.id + '\',\''
    + unit.id + '\')">'
    + '<span><span class="name">' + esc(unit.name) + '</span>'
    + '<span class="sub">' + sub + '</span></span>'
    + chip + '</button>';
}

function renderEntry() {
  var host = document.getElementById("viewEntry");
  var tool = findTool(CURRENT_TOOL);
  if (!tool) { showTab("today"); return; }
  var unit = findUnit(tool, CURRENT_UNIT);
  if (!unit) { showTab("today"); return; }

  // If this unit was already logged on this date, put those values back in the
  // boxes so correcting a typo is easy.
  var saved = {};
  var existing = unitEntry(tool.id, unit.id, CURRENT_DATE);
  if (existing) saved = existing.values;

  var manyUnits = toolUnits(tool).length > 1;

  var heading = manyUnits ? esc(tool.name) + " \u2013 " + esc(unit.name) : esc(tool.name);
  var html = '<div class="card">'
    + '<div class="spread"><h2 style="margin:0">' + heading + '</h2>'
    + '<span class="count">' + esc(CURRENT_DATE) + '</span></div>';

  if (unit.kind === "chamber") {
    html += '<p class="hint" style="margin-top:6px">Chamber type: ' + esc(unit.typeName) + '</p>';
  }
  if (existing) {
    html += '<p class="hint" style="margin-top:6px">Already logged at ' + esc(shortTime(existing.savedAt))
      + '. Saving again replaces what is there.</p>';
  }
  html += '</div>';

  if (unit.points.length === 0) {
    html += '<div class="card"><p class="hint">Nothing is set up to log here yet. '
      + (unit.kind === "chamber"
          ? 'Add readings to the "' + esc(unit.typeName) + '" chamber type on the Tools tab.'
          : 'Add some readings on the Tools tab.') + '</p>'
      + '<div class="big-actions"><button onclick="showTab(\'tools\')">Go to Tools</button>'
      + '<button class="secondary" onclick="backFromEntry()">Back</button></div></div>';
    host.innerHTML = html;
    return;
  }

  // One block per reading.
  html += '<div class="card">';
  for (var i = 0; i < unit.points.length; i++) {
    var point = unit.points[i];
    var value = saved[point.id] !== undefined ? saved[point.id] : "";
    var status = rangeStatus(value, point);
    var unitLabel = point.unit ? " (" + esc(point.unit) + ")" : "";

    html += '<div class="field">'
      + '<label for="val_' + point.id + '">' + esc(point.name) + unitLabel + '</label>'
      + '<input type="number" inputmode="decimal" step="any" '
      + 'id="val_' + point.id + '" class="reading ' + statusClass(status) + '" '
      + 'value="' + esc(value) + '" oninput="colorField(\'' + point.id + '\')">'
      + '<div class="spread" style="margin-top:6px">'
      + '<span class="hint" style="margin:0">' + esc(limitHint(point))
      + '<span id="life_' + point.id + '">' + esc(lifeNote(value, point)) + '</span></span>'
      + '<span class="pill ' + statusClass(status) + '" id="st_' + point.id + '">'
      + esc(statusText(status, point)) + '</span>'
      + '</div></div>';
  }
  html += '</div>';

  // The buttons. Full width and extra tall, because these get tapped most.
  // On a multi-chamber tool the next step is the next chamber; on a plain tool
  // it is the next tool, exactly as before.
  html += '<div class="card"><div class="big-actions">';
  if (manyUnits) {
    var nextUnit = nextUnitInTool(tool, CURRENT_DATE, unit.id);
    if (nextUnit) {
      html += '<button onclick="saveEntry(\'next\')">Save and next ('
        + esc(nextUnit.name) + ')</button>';
    }
    html += '<button' + (nextUnit ? ' class="secondary"' : '') + ' onclick="saveEntry(\'close\')">'
      + 'Save and back to ' + esc(tool.name) + '</button>';
  } else {
    var nextTool = nextUnlogged(CURRENT_DATE, tool.id);
    if (nextTool) {
      html += '<button onclick="saveEntry(\'next\')">Save and next tool ('
        + esc(nextTool.name) + ')</button>';
    }
    html += '<button' + (nextTool ? ' class="secondary"' : '') + ' onclick="saveEntry(\'close\')">'
      + 'Save and close</button>';
  }
  html += '<button class="secondary" onclick="backFromEntry()">Cancel, do not save</button>'
    + '</div><div class="msg" id="entryMsg"></div></div>';

  host.innerHTML = html;
}

// Leaving the entry form without saving. Goes back to wherever you came from:
// the tool screen for a multi-chamber tool, the round itself otherwise.
function backFromEntry() {
  var tool = findTool(CURRENT_TOOL);
  if (tool && toolUnits(tool).length > 1) {
    VIEW = "tool";
    CURRENT_UNIT = null;
    render();
    return;
  }
  showTab("today");
}

// For a consumable, say how much life is left as you type. Doing that
// subtraction in your head at the tool is exactly where mistakes come from.
function lifeNote(value, point) {
  var percent = lifeRemaining(value, point);
  if (percent === null) return "";
  return "  \u00b7  " + Math.round(percent) + "% of life remaining";
}

// Recolour one box while the user types. Purely cosmetic, changes no data.
function colorField(pointId) {
  var tool = findTool(CURRENT_TOOL);
  if (!tool) return;
  var unit = findUnit(tool, CURRENT_UNIT);
  if (!unit) return;

  var point = null;
  for (var i = 0; i < unit.points.length; i++) {
    if (unit.points[i].id === pointId) point = unit.points[i];
  }
  if (!point) return;

  var input = document.getElementById("val_" + pointId);
  var pill = document.getElementById("st_" + pointId);
  var status = rangeStatus(input.value, point);
  input.className = "reading " + statusClass(status);
  pill.className = "pill " + statusClass(status);
  pill.textContent = statusText(status, point);

  var life = document.getElementById("life_" + pointId);
  if (life) life.textContent = lifeNote(input.value, point);
}

// Save what is in the boxes, then move on. Blank boxes are saved as blank,
// which is fine: a blank reading simply does not appear in the export. That is
// also how a chamber that was not run today is recorded - leave it empty.
function saveEntry(mode) {
  var tool = findTool(CURRENT_TOOL);
  if (!tool) return;
  var unit = findUnit(tool, CURRENT_UNIT);
  if (!unit) return;

  var values = {};
  for (var i = 0; i < unit.points.length; i++) {
    var point = unit.points[i];
    values[point.id] = document.getElementById("val_" + point.id).value.trim();
  }

  // Counters, for working out which parts of the tool actually get used.
  // Taken before the save, so we can tell a first entry from a correction.
  var wasComplete = (countTotal(CURRENT_DATE) > 0
    && countLogged(CURRENT_DATE) === countTotal(CURRENT_DATE));
  var hadEntry = !!unitEntry(tool.id, unit.id, CURRENT_DATE);

  saveUnitValues(tool.id, unit.id, CURRENT_DATE, values);
  save();

  if (hadEntry) bump("reEditsOfASavedTool");
  if (CURRENT_DATE !== todayStr()) bump("backFilledSaves");
  if (unit.kind === "chamber") bump("chamberSaves");
  // Only count the moment a round TIPS into complete, not every later re-save.
  if (!wasComplete && countTotal(CURRENT_DATE) > 0
      && countLogged(CURRENT_DATE) === countTotal(CURRENT_DATE)) {
    bump("roundsCompleted");
  }

  var manyUnits = toolUnits(tool).length > 1;

  if (mode === "next") {
    if (manyUnits) {
      var nextUnit = nextUnitInTool(tool, CURRENT_DATE, unit.id);
      if (nextUnit) { openUnit(tool.id, nextUnit.id); return; }
    } else {
      var nextTool = nextUnlogged(CURRENT_DATE, tool.id);
      if (nextTool) { openTool(nextTool.id); return; }
    }
  }

  backFromEntry();
}

// ---------------------------------------------------------------------------
// SCREEN 3: TOOLS SETUP
//
// Add the machines you walk, and the readings you take at each one. You do
// this once, then only touch it when the round changes.
//
// Every box on this screen saves the moment you leave it. There is no save
// button, on purpose: fewer taps, and nothing to forget.
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// WHAT IS NOT FINISHED
//
// The one place that says what still needs doing. Without it the only way to
// discover a chamber type with no readings is to scroll the whole tab, or to
// walk the round and find a chamber you cannot log.
//
// It disappears completely once everything is set up, so it costs nothing
// after the first week.
// ---------------------------------------------------------------------------
function setupIssuesHtml() {
  var lines = [];

  // Chamber types with no readings, and how many chambers they leave stranded.
  var emptyTypes = [];
  var strandedChambers = 0;
  for (var y = 0; y < DATA.chamberTypes.length; y++) {
    var type = DATA.chamberTypes[y];
    if (type.points.length > 0) continue;
    var used = countChambersOfType(type.id);
    strandedChambers += used;
    emptyTypes.push(esc(type.name) + (used > 0 ? " (" + used
      + (used === 1 ? " chamber" : " chambers") + ")" : " (unused)"));
  }
  if (emptyTypes.length > 0) {
    lines.push('<strong>' + emptyTypes.length
      + (emptyTypes.length === 1 ? ' chamber type has' : ' chamber types have')
      + ' no readings' + (strandedChambers > 0
        ? ', so ' + strandedChambers + ' chambers will log nothing' : '')
      + ':</strong><br>' + emptyTypes.join(" &middot; "));
  }

  // Tools that are not on the round at all.
  var idleTools = [];
  for (var t = 0; t < DATA.tools.length; t++) {
    if (!toolStatus(DATA.tools[t], CURRENT_DATE).ready) idleTools.push(esc(DATA.tools[t].name));
  }
