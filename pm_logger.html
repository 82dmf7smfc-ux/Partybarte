  if (idleTools.length > 0) {
    lines.push('<strong>' + idleTools.length
      + (idleTools.length === 1 ? ' tool is' : ' tools are')
      + ' not on the round</strong>, because nothing on '
      + (idleTools.length === 1 ? 'it' : 'them') + ' can be logged yet:<br>'
      + idleTools.join(" &middot; "));
  }

  // Chambers whose type has been deleted out from under them.
  var orphans = [];
  for (var t2 = 0; t2 < DATA.tools.length; t2++) {
    var chambers = DATA.tools[t2].chambers || [];
    for (var c = 0; c < chambers.length; c++) {
      if (!findChamberType(chambers[c].typeId)) {
        orphans.push(esc(DATA.tools[t2].name) + " / " + esc(chambers[c].name));
      }
    }
  }
  if (orphans.length > 0) {
    lines.push('<strong>' + orphans.length + ' chambers have no chamber type:</strong><br>'
      + orphans.join(" &middot; "));
  }

  if (lines.length === 0) return '<div id="setupIssues"></div>';

  return '<div id="setupIssues"><div class="card" '
    + 'style="background:var(--warn-bg);border-color:#f0cf9a">'
    + '<h2>Setup not finished</h2>'
    + '<p class="hint">' + lines.join('</p><p class="hint">') + '</p>'
    + '<p class="hint">None of this loses data. It just means those chambers are '
    + 'skipped on the round until they have something to log.</p>'
    + '</div></div>';
}

function renderTools() {
  var host = document.getElementById("viewTools");

  var html = '<div id="dupWarn"></div>'
    + setupIssuesHtml()
    + '<div class="card">'
    + '<h2>Add a tool</h2>'
    + '<p class="hint">The name you type here is what shows on your round and in the export.</p>'
    + '<div class="row">'
    + '<div class="grow"><input type="text" id="newToolName" placeholder="For example: Etcher 3" '
    + 'onkeydown="onEnter(event, addTool)"></div>'
    + '<button onclick="addTool()">Add tool</button>'
    + '</div><div class="msg" id="toolsMsg"></div>';

  if (DATA.tools.length === 0) {
    html += '<div class="big-actions">'
      + '<button class="secondary" onclick="loadExample()">Load an example setup to try it</button>'
      + '</div>';
  }
  html += '</div>';

  // One suggestion list, shared by every "add a reading" box below.
  html += readingSuggestionsHtml();
  html += chamberTypesHtml();

  // One card per tool, holding that tool's data points.
  for (var i = 0; i < DATA.tools.length; i++) {
    html += toolEditorHtml(DATA.tools[i], i);
  }

  host.innerHTML = html;
  warnAboutDuplicateNames();
}

// ---------------------------------------------------------------------------
// Two tools with the same name, or two readings on one tool with the same
// name, are a problem only in one place: importing. A file has names in it,
// not ids, so two tools called "Etcher 3" would collapse into one on the way
// back in. We do not stop you renaming, because blocking you halfway through
// typing a name is worse. We just say so, right on the setup screen.
//
// This updates one small box on its own instead of redrawing the screen, so
// it is safe to call while someone is typing.
// ---------------------------------------------------------------------------
function warnAboutDuplicateNames() {
  var box = document.getElementById("dupWarn");
  if (!box) return;

  var problems = [];
  var toolSeen = {};
  for (var i = 0; i < DATA.tools.length; i++) {
    var tool = DATA.tools[i];
    // The "n:" in front of the key stops a tool named something like
    // "constructor" from colliding with a built-in property name.
    var key = "n:" + tool.name.trim().toLowerCase();
    if (toolSeen[key] === true) problems.push('Two tools are both called "' + tool.name + '".');
    toolSeen[key] = true;

    var pointSeen = {};
    for (var p = 0; p < tool.points.length; p++) {
      var pkey = "n:" + tool.points[p].name.trim().toLowerCase();
      if (pointSeen[pkey] === true) {
        problems.push('"' + tool.name + '" has two readings called "' + tool.points[p].name + '".');
      }
      pointSeen[pkey] = true;
    }

    var chamberSeen = {};
    var chambers = tool.chambers || [];
    for (var c = 0; c < chambers.length; c++) {
      var ckey = "n:" + chambers[c].name.trim().toLowerCase();
      if (chamberSeen[ckey] === true) {
        problems.push('"' + tool.name + '" has two chambers called "' + chambers[c].name + '".');
      }
      chamberSeen[ckey] = true;
    }
  }

  var typeSeen = {};
  for (var y = 0; y < DATA.chamberTypes.length; y++) {
    var tkey = "n:" + DATA.chamberTypes[y].name.trim().toLowerCase();
    if (typeSeen[tkey] === true) {
      problems.push('Two chamber types are both called "' + DATA.chamberTypes[y].name + '".');
    }
    typeSeen[tkey] = true;
  }

  // The same reading logged in two different units is the quietest problem
  // here. Nothing looks wrong on the tablet, and it only shows up months later
  // when a chart adds hours to minutes and the trend is nonsense.
  var library = knownReadings();
  for (var r = 0; r < library.length; r++) {
    var unitKeys = Object.keys(library[r].unitsSeen);
    if (unitKeys.length < 2) continue;
    var shown = [];
    for (var u = 0; u < unitKeys.length; u++) {
      shown.push(library[r].unitsSeen[unitKeys[u]] === "" ? "(no unit)" : library[r].unitsSeen[unitKeys[u]]);
    }
    problems.push('"' + library[r].name + '" is logged in more than one unit ('
      + shown.join(", ") + ') across ' + library[r].usedBy.join(", ")
      + '. Excel will treat them as one column and add them together.');
  }

  if (problems.length === 0) { box.innerHTML = ""; return; }

  box.innerHTML = '<div class="card" style="background:var(--warn-bg);border-color:#f0cf9a">'
    + '<h2>Worth a look before you trend this</h2>'
    + '<p class="hint">' + problems.map(esc).join("<br>") + '</p>'
    + '<p class="hint">Names are how an imported file finds its way back to the right '
    + 'tool, so duplicates merge together on a restore. And a reading logged in two '
    + 'different units becomes one confused column in Excel. Neither breaks anything '
    + 'today, which is exactly why they are easy to miss.</p></div>';
}

// The editor card for one tool.
// ---------------------------------------------------------------------------
// THE READING LIBRARY
//
// Every reading name you have used anywhere - on a chamber type or on a tool -
// is offered as a suggestion when you add the next one. Type three letters of
// "RF Time On" and it is there, with its unit and limits already filled in.
//
// This list is WORKED OUT from what already exists, not stored separately.
// That is deliberate. A stored copy would have to be kept in step every time a
// reading is renamed, deleted, or imported, and every one of those is a chance
// to get out of step. Deriving it means it is always right, there is nothing
// to migrate, and it updates the moment you add a reading.
//
// Picking a suggestion COPIES the name, unit and limits. It does not link
// them. Editing the reading on one type never changes another, because an etch
// chamber and a sputter chamber can measure the same thing to different specs.
// ---------------------------------------------------------------------------
function knownReadings() {
  var byName = {};
  var out = [];

  function remember(point, where) {
    // The "n:" prefix keeps a reading named something like "constructor" from
    // colliding with a built-in property name.
    var key = "n:" + point.name.trim().toLowerCase();
    var unit = point.unit || "";

    if (byName[key] === undefined) {
      byName[key] = {
        name: point.name.trim(),
        unit: unit,
        min: point.min === undefined ? null : point.min,
        max: point.max === undefined ? null : point.max,
        usedBy: [where],
        unitsSeen: {}
      };
      byName[key].unitsSeen["u:" + unit.toLowerCase()] = unit;
      out.push(byName[key]);
      return;
    }

    var known = byName[key];
    if (known.usedBy.indexOf(where) === -1) known.usedBy.push(where);
    known.unitsSeen["u:" + unit.toLowerCase()] = unit;
  }

  for (var y = 0; y < DATA.chamberTypes.length; y++) {
    var type = DATA.chamberTypes[y];
    for (var q = 0; q < type.points.length; q++) remember(type.points[q], type.name);
  }
  for (var t = 0; t < DATA.tools.length; t++) {
    for (var p = 0; p < DATA.tools[t].points.length; p++) remember(DATA.tools[t].points[p], DATA.tools[t].name);
  }

  out.sort(function (a, b) { return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1; });
  return out;
}

// One reading from the library, by name. Used when adding, to fill in the
// unit and limits you already typed once somewhere else.
function findKnownReading(name) {
  var want = String(name).trim().toLowerCase();
  var all = knownReadings();
  for (var i = 0; i < all.length; i++) {
    if (all[i].name.trim().toLowerCase() === want) return all[i];
  }
  return null;
}

// The type-ahead list itself. One list, shared by every "add a reading" box on
// the tab, rebuilt whenever the tab is drawn - so a reading you add becomes a
// suggestion everywhere else straight away.
function readingSuggestionsHtml() {
  var all = knownReadings();
  var html = '<datalist id="readingSuggestions">';
  for (var i = 0; i < all.length; i++) {
    var known = all[i];
    // The label is what the browser shows beside the name in the drop-down.
    var label = (known.unit ? known.unit : "no unit")
      + "  \u00b7  " + plainLimits(known)
      + "  \u00b7  used on " + known.usedBy.join(", ");
    html += '<option value="' + esc(known.name) + '" label="' + esc(label) + '"></option>';
  }
  return html + '</datalist>';
}

// A short line telling the user the suggestions exist. A type-ahead box that
// looks like a plain text box is a feature nobody finds.
function suggestionsHintHtml() {
  var n = knownReadings().length;
  if (n === 0) return "";
  return '<p class="hint" style="margin:6px 0 0">' + n
    + (n === 1 ? ' reading has' : ' readings have')
    + ' been set up already. Start typing to reuse one, with its unit and limits.</p>';
}

// ---------------------------------------------------------------------------
// CHAMBER TYPES
//
// A type is a name plus a list of readings. Chambers of the same type log the
// same things, so an etcher with four etch chambers needs the list typed once,
// and two identical etchers share one definition rather than keeping two
// copies that drift apart.
//
// Change a reading here and every chamber of that type changes with it, on
// every tool. That is the point of types, and it is also the thing to be
// careful about.
// ---------------------------------------------------------------------------
function chamberTypesHtml() {
  var html = '<div class="card">'
    + '<h2>Chamber types</h2>'
    + '<p class="hint">Only needed if your tools have chambers. A type is a name plus the '
    + 'readings taken at any chamber of that kind, for example "Etch" or "Strip". '
    + 'Set it up once here, then give each chamber its type on the tool below.</p>'
    + '<div class="row">'
    + '<div class="grow"><input type="text" id="newTypeName" placeholder="For example: Etch" '
    + 'onkeydown="onEnter(event, addChamberType)"></div>'
    + '<button onclick="addChamberType()">Add type</button>'
    + '</div><div class="msg" id="typesMsg"></div>';

  for (var i = 0; i < DATA.chamberTypes.length; i++) {
    var type = DATA.chamberTypes[i];
    var used = countChambersOfType(type.id);

    // The collapsed summary. A type with no readings is flagged here, because
    // every chamber using it logs nothing until that is fixed.
    var summary = (used === 0 ? "not used yet" : used + (used === 1 ? " chamber" : " chambers"))
      + " \u00b7 " + (type.points.length === 0
          ? "NO READINGS YET"
          : type.points.length + (type.points.length === 1 ? " reading" : " readings"));
    html += sectionRowHtml(type.id, type.name, summary,
      type.points.length === 0 ? "warn" : "");

    if (!OPEN_SECTIONS[type.id]) continue;

    html += '<div class="pointedit" style="margin:0 0 14px">'
      + '<div class="row">'
      + '<div class="grow"><label>Type name</label>'
      + '<input type="text" value="' + esc(type.name) + '" '
      + 'oninput="renameChamberType(\'' + type.id + '\', this.value)"></div>'
      + '<button class="danger small" onclick="deleteChamberType(\'' + type.id + '\')">Delete</button>'
      + '</div>'
      + '<p class="hint" style="margin:8px 0 4px">' + esc(chamberUsageText(type.id))
      + ' Readings taken at every chamber of this type:</p>';

    for (var q = 0; q < type.points.length; q++) {
      html += pointEditorHtml(type.points[q], q, type.points.length,
        "updateTypePoint('" + type.id + "','" + type.points[q].id + "'",
        "moveTypePoint('" + type.id + "','" + type.points[q].id + "'",
        "deleteTypePoint('" + type.id + "','" + type.points[q].id + "')");
    }
    if (type.points.length === 0) {
      html += '<p class="hint">No readings yet. Add the first one below.</p>';
    }

    html += '<div class="row" style="margin-top:10px">'
      + '<div class="grow"><input type="text" id="newTypePoint_' + type.id + '" '
      + 'list="readingSuggestions" placeholder="For example: RF hours" '
      + 'onkeydown="onEnter(event, function () { addTypePoint(\'' + type.id + '\'); })"></div>'
      + '<button onclick="addTypePoint(\'' + type.id + '\')">Add reading</button>'
      + '</div>'
      + suggestionsHintHtml();

    // Clone a whole reading list from a similar type. Two CVD types or two
    // etch types usually share most of their readings, so this is one tap
    // instead of typing the same list out again.
    var otherTypes = [];
    for (var o = 0; o < DATA.chamberTypes.length; o++) {
      if (DATA.chamberTypes[o].id !== type.id && DATA.chamberTypes[o].points.length > 0) {
        otherTypes.push(DATA.chamberTypes[o]);
      }
    }
    if (otherTypes.length > 0) {
      html += '<div class="row" style="margin-top:10px">'
        + '<div class="grow"><select id="copyTypeFrom_' + type.id + '">';
      for (var m2 = 0; m2 < otherTypes.length; m2++) {
        html += '<option value="' + otherTypes[m2].id + '">' + esc(otherTypes[m2].name)
          + ' (' + otherTypes[m2].points.length + ')</option>';
      }
      html += '</select></div>'
        + '<button class="secondary" onclick="copyTypePoints(\'' + type.id + '\')">'
        + 'Copy its readings here</button></div>';
    }

    html += '</div>';
  }

  html += '</div>';
  return html;
}

// A tool's one-line summary while it is collapsed.
function toolSummary(tool) {
  var chambers = (tool.chambers || []).length;
  var st = toolStatus(tool, CURRENT_DATE);
  var bits = [];
  if (chambers > 0) bits.push(chambers + (chambers === 1 ? " chamber" : " chambers"));
  if (tool.points.length > 0) {
    bits.push(tool.points.length + (tool.points.length === 1 ? " tool reading" : " tool readings"));
  }
  if (bits.length === 0) return "nothing set up yet";
  if (!st.ready) return bits.join(" \u00b7 ") + " \u00b7 NOT ON THE ROUND";
  return bits.join(" \u00b7 ") + " \u00b7 " + st.total
    + (st.total === 1 ? " thing" : " things") + " to log";
}

// The editor block for one reading. Shared by chamber types and by a tool's
// own readings, so both look and behave the same. The three handler strings
// are the calls to make when this particular reading is edited, moved or
// deleted - they differ only in which list the reading lives in.
function pointEditorHtml(point, index, total, updateCall, moveCall, deleteCall) {
  return '<div class="pointedit">'
    + '<div class="readingrow">'
    + '<div><span class="lab">Reading name</span>'
    + '<input type="text" value="' + esc(point.name) + '" '
    + 'oninput="' + updateCall + ',\'name\',this.value)"></div>'
    + '<div><span class="lab">Unit</span>'
    + '<input type="text" value="' + esc(point.unit) + '" placeholder="mTorr" '
    + 'oninput="' + updateCall + ',\'unit\',this.value)"></div>'
    + '<div><span class="lab">Min</span>'
    + '<input type="number" step="any" placeholder="no min" value="'
    + (point.min === null ? "" : esc(point.min)) + '" '
    + 'oninput="' + updateCall + ',\'min\',this.value)"></div>'
    + '<div><span class="lab">Max</span>'
    + '<input type="number" step="any" placeholder="no max" value="'
    + (point.max === null ? "" : esc(point.max)) + '" '
    + 'oninput="' + updateCall + ',\'max\',this.value)"></div>'
    + '</div>'
    + '<div class="row" style="margin-top:8px">'
    + '<label class="lifebox"><input type="checkbox"' + (point.isLife ? ' checked' : '')
    + ' oninput="' + updateCall + ',\'isLife\',this.checked)">'
    + 'Counts up to a limit</label>'
    + '<button class="secondary small" onclick="' + moveCall + ',-1)"'
    + (index === 0 ? ' disabled' : '') + '>&#9650;</button>'
    + '<button class="secondary small" onclick="' + moveCall + ',1)"'
    + (index === total - 1 ? ' disabled' : '') + '>&#9660;</button>'
    + '<button class="danger small" onclick="' + deleteCall + '">Delete</button>'
    + '</div>'
    + (point.isLife
        ? '<p class="hint" style="margin:6px 0 0">Max is the rated life. The fleet '
          + 'summary shows how much is left.</p>'
        : '')
    + '</div>';
}

// Which tools use a type, and which chambers on them. "Used by 4 chambers"
// does not tell you what a limit change is about to affect.
function chamberUsageText(typeId) {
  var parts = [];
  for (var t = 0; t < DATA.tools.length; t++) {
    var chambers = DATA.tools[t].chambers || [];
    var names = [];
    for (var c = 0; c < chambers.length; c++) {
      if (chambers[c].typeId === typeId) names.push(chambers[c].name);
    }
    if (names.length > 0) parts.push(DATA.tools[t].name + " (" + names.join(", ") + ")");
  }
  if (parts.length === 0) return "Not used by any chamber yet.";
  return "Used by " + parts.join(", ") + ".";
}

function countChambersOfType(typeId) {
  var n = 0;
  for (var t = 0; t < DATA.tools.length; t++) {
    var chambers = DATA.tools[t].chambers || [];
    for (var c = 0; c < chambers.length; c++) if (chambers[c].typeId === typeId) n++;
  }
  return n;
}

function addChamberType() {
  var box = document.getElementById("newTypeName");
  var name = box.value.trim();
  if (name === "") { setMsg("typesMsg", "err", "Type a name for the chamber type first."); return; }
  if (findChamberTypeByName(name)) { setMsg("typesMsg", "err", "There is already a type called that."); return; }

  DATA.chamberTypes.push({ id: newId(), name: name, points: [] });
  save();
  box.value = "";
  render();
  setMsg("typesMsg", "ok", "Added the " + name + " type. Now add the readings taken at it.");
}

function renameChamberType(typeId, name) {
  var type = findChamberType(typeId);
  if (!type) return;
  name = name.trim();
  if (name === "") return;
  type.name = name;
  save();
}

// A type in use cannot be deleted: the chambers using it would be left logging
// nothing, silently. Say which tools are in the way instead.
function deleteChamberType(typeId) {
  var type = findChamberType(typeId);
  if (!type) return;

  var users = [];
  for (var t = 0; t < DATA.tools.length; t++) {
    var chambers = DATA.tools[t].chambers || [];
    for (var c = 0; c < chambers.length; c++) {
      if (chambers[c].typeId === typeId && users.indexOf(DATA.tools[t].name) === -1) {
        users.push(DATA.tools[t].name);
      }
    }
  }
  if (users.length > 0) {
    setMsg("typesMsg", "err", 'Cannot delete "' + type.name + '": still used by '
      + users.join(", ") + '. Change or remove those chambers first.');
    return;
  }
  if (!window.confirm('Delete the chamber type "' + type.name + '"?')) return;

  var kept = [];
  for (var i = 0; i < DATA.chamberTypes.length; i++) {
    if (DATA.chamberTypes[i].id !== typeId) kept.push(DATA.chamberTypes[i]);
  }
  DATA.chamberTypes = kept;
  save();
  render();
  setMsg("typesMsg", "ok", "Deleted " + type.name + ".");
}

function addTypePoint(typeId) {
  var type = findChamberType(typeId);
  if (!type) return;
  var box = document.getElementById("newTypePoint_" + typeId);
  var name = box.value.trim();
  if (name === "") { setMsg("typesMsg", "err", "Type a name for the reading first."); return; }
  for (var i = 0; i < type.points.length; i++) {
    if (type.points[i].name.trim().toLowerCase() === name.toLowerCase()) {
      setMsg("typesMsg", "err", type.name + " already has a reading called that.");
      return;
    }
  }
  type.points.push(newPointFrom(name));
  save();
  render();
  setMsg("typesMsg", "ok", "Added " + name + reusedNote(name)
    + " to every " + type.name + " chamber.");
}

// Build a new reading. If this name has been used before, its unit and limits
// come along, and the spelling already in use wins - so "rf time on" becomes
// "RF Time On" rather than starting a second column in your spreadsheet.
function newPointFrom(name) {
  var known = findKnownReading(name);
  if (!known) return { id: newId(), name: name, unit: "", min: null, max: null };
  return { id: newId(), name: known.name, unit: known.unit, min: known.min, max: known.max };
}

// Says what was filled in for you, so a copied unit or limit is never a
// surprise you find out about later.
function reusedNote(name) {
  var known = findKnownReading(name);
  if (!known) return "";
  var bits = [];
  if (known.unit) bits.push(known.unit);
  if (known.min !== null || known.max !== null) bits.push(plainLimits(known));
  if (bits.length === 0) return " (reused)";
  return " (" + bits.join(", ") + ", reused from " + known.usedBy[0] + ")";
}

// Copy every reading from another chamber type. Readings this type already
// has, by name, are left alone rather than duplicated.
function copyTypePoints(typeId) {
  var type = findChamberType(typeId);
  var picker = document.getElementById("copyTypeFrom_" + typeId);
  if (!type || !picker) return;
  var source = findChamberType(picker.value);
  if (!source) return;

  var added = 0;
  for (var i = 0; i < source.points.length; i++) {
    var point = source.points[i];
    var already = false;
    for (var k = 0; k < type.points.length; k++) {
      if (type.points[k].name.trim().toLowerCase() === point.name.trim().toLowerCase()) already = true;
    }
    if (already) continue;
    type.points.push({ id: newId(), name: point.name, unit: point.unit,
                       min: point.min, max: point.max });
    added++;
  }
  save();
  render();
  setMsg("typesMsg", added === 0 ? "info" : "ok",
    added === 0
      ? type.name + " already has every reading from " + source.name + "."
      : "Copied " + added + " readings from " + source.name + " into " + type.name
        + ". Adjust any limits that differ.");
}

function updateTypePoint(typeId, pointId, field, value) {
  var type = findChamberType(typeId);
  if (!type) return;
  for (var i = 0; i < type.points.length; i++) {
    if (type.points[i].id === pointId) { applyPointField(type.points[i], field, value); break; }
  }
  save();
  // Updates one small box, so it is safe to call while someone is typing.
  warnAboutDuplicateNames();
}

function deleteTypePoint(typeId, pointId) {
  var type = findChamberType(typeId);
  if (!type) return;
  var point = null;
  for (var i = 0; i < type.points.length; i++) if (type.points[i].id === pointId) point = type.points[i];
  if (!point) return;
  if (!window.confirm('Delete "' + point.name + '" from every ' + type.name
      + ' chamber?\n\nAny values already logged for it are deleted too.')) return;

  var kept = [];
  for (var k = 0; k < type.points.length; k++) {
    if (type.points[k].id !== pointId) kept.push(type.points[k]);
  }
  type.points = kept;
  forgetPointEverywhere(pointId);
  forgetOverrideEverywhere(pointId);
  save();
  render();
}

function moveTypePoint(typeId, pointId, step) {
  var type = findChamberType(typeId);
  if (!type) return;
  movePointInList(type.points, pointId, step);
  save();
  render();
}

// Shared by the tool and chamber-type editors so both behave identically.
function applyPointField(point, field, value) {
  if (field === "name") {
    var name = String(value).trim();
    if (name !== "") point.name = name;
  } else if (field === "unit") {
    point.unit = String(value).trim();
  } else if (field === "min" || field === "max") {
    var text = String(value).trim();
    point[field] = (text === "" || isNaN(Number(text))) ? null : Number(text);
  } else if (field === "isLife") {
    // A consumable: the value counts UP towards max, which is the rated life
    // rather than an alarm level. See lifeRemaining().
    point.isLife = !!value;
  }
}

function movePointInList(list, pointId, step) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].id !== pointId) continue;
    var to = i + step;
    if (to < 0 || to >= list.length) return;
    var moved = list[i];
    list[i] = list[to];
    list[to] = moved;
    return;
  }
}

// Drop any chamber's own limits for a reading that no longer exists.
function forgetOverrideEverywhere(pointId) {
  for (var t = 0; t < DATA.tools.length; t++) {
    var chambers = DATA.tools[t].chambers || [];
    for (var c = 0; c < chambers.length; c++) {
      if (chambers[c].limits) delete chambers[c].limits[pointId];
    }
  }
}

// Drop every logged value for one reading, wherever it was stored.
function forgetPointEverywhere(pointId) {
  var dates = Object.keys(DATA.entries);
  for (var d = 0; d < dates.length; d++) {
    var day = DATA.entries[dates[d]];
    var toolIds = Object.keys(day);
    for (var t = 0; t < toolIds.length; t++) {
      var entry = day[toolIds[t]];
      if (entry.values) delete entry.values[pointId];
      var chamberIds = Object.keys(entry.chambers || {});
      for (var c = 0; c < chamberIds.length; c++) {
        delete entry.chambers[chamberIds[c]].values[pointId];
      }
    }
  }
}

function toolEditorHtml(tool, index) {
  var st = toolStatus(tool, CURRENT_DATE);
  var html = sectionRowHtml(tool.id, tool.name, toolSummary(tool), st.ready ? "" : "warn");
  if (!OPEN_SECTIONS[tool.id]) return html;

  html += '<div class="card">';

  // Tool name, plus move up / move down / delete.
  html += '<label>Tool name</label>'
    + '<div class="row">'
    + '<div class="grow"><input type="text" value="' + esc(tool.name) + '" '
    + 'oninput="renameTool(\'' + tool.id + '\', this.value)"></div>'
    + '<button class="secondary small" onclick="moveTool(\'' + tool.id + '\', -1)"'
    + (index === 0 ? ' disabled' : '') + '>&#9650;</button>'
    + '<button class="secondary small" onclick="moveTool(\'' + tool.id + '\', 1)"'
    + (index === DATA.tools.length - 1 ? ' disabled' : '') + '>&#9660;</button>'
    + '<button class="danger small" onclick="deleteTool(\'' + tool.id + '\')">Delete</button>'
    + '</div>';

  html += '<h2 style="margin-top:16px">Chambers</h2>';
  html += chamberEditorHtml(tool);

  html += '<h2 style="margin-top:16px">Readings logged at the tool itself</h2>';
  html += '<p class="hint">For things that belong to the whole machine rather than one '
    + 'chamber - facility nitrogen, chiller temperature. Leave empty if everything you log '
    + 'is per chamber.</p>';

  if (tool.points.length === 0) {
    html += '<p class="hint">None yet.</p>';
  }
  for (var i = 0; i < tool.points.length; i++) {
    html += pointEditorHtml(tool.points[i], i, tool.points.length,
      "updatePoint('" + tool.id + "','" + tool.points[i].id + "'",
      "movePoint('" + tool.id + "','" + tool.points[i].id + "'",
      "deletePoint('" + tool.id + "','" + tool.points[i].id + "')");
  }

  // Add a new tool-level reading.
  html += '<div class="row" style="margin-top:10px">'
    + '<div class="grow"><input type="text" id="newPoint_' + tool.id + '" '
    + 'list="readingSuggestions" placeholder="For example: N2 pressure" '
    + 'onkeydown="onEnter(event, function () { addPoint(\'' + tool.id + '\'); })"></div>'
    + '<button onclick="addPoint(\'' + tool.id + '\')">Add tool reading</button>'
    + '</div>'
    + suggestionsHintHtml();

  // Copy the tool-level reading list from another tool.
  var others = [];
  for (var k = 0; k < DATA.tools.length; k++) {
    if (DATA.tools[k].id !== tool.id && DATA.tools[k].points.length > 0) others.push(DATA.tools[k]);
  }
  if (others.length > 0) {
    html += '<div class="row" style="margin-top:10px">'
      + '<div class="grow"><select id="copyFrom_' + tool.id + '">';
    for (var m = 0; m < others.length; m++) {
      html += '<option value="' + others[m].id + '">' + esc(others[m].name) + '</option>';
    }
    html += '</select></div>'
      + '<button class="secondary" onclick="copyPoints(\'' + tool.id + '\')">'
      + 'Copy its tool readings here</button>'
      + '</div>';
  }

  html += '</div>';
  return html;
}

// ---------------------------------------------------------------------------
// The chambers on one tool. A chamber is just a name and a type; what it logs
// comes from the type, which is defined once at the top of this tab.
// ---------------------------------------------------------------------------
function chamberEditorHtml(tool) {
  var chambers = tool.chambers || [];
  var html = '';

  if (DATA.chamberTypes.length === 0) {
    return '<p class="hint">This tool has no chambers. If it should, first add a chamber '
      + 'type at the top of this tab, then come back and add chambers here.</p>';
  }

  if (chambers.length === 0) {
    html += '<p class="hint">None. Leave it that way for a single-chamber tool like a wet bench.</p>';
  }

  for (var i = 0; i < chambers.length; i++) {
    var chamber = chambers[i];
    html += '<div class="pointedit">'
      + '<div class="grid">'
      + '<div><label>Chamber name</label>'
      + '<input type="text" value="' + esc(chamber.name) + '" '
      + 'oninput="renameChamber(\'' + tool.id + '\',\'' + chamber.id + '\', this.value)"></div>'
      + '<div><label>Type</label><select '
      + 'onchange="setChamberType(\'' + tool.id + '\',\'' + chamber.id + '\', this.value)">';
    for (var q = 0; q < DATA.chamberTypes.length; q++) {
      var type = DATA.chamberTypes[q];
      html += '<option value="' + type.id + '"'
        + (type.id === chamber.typeId ? ' selected' : '') + '>' + esc(type.name)
        + (type.points.length === 0
            ? ' \u2014 no readings yet'
            : ' \u2014 ' + type.points.length + (type.points.length === 1 ? ' reading' : ' readings'))
        + '</option>';
    }
    html += '</select></div></div>'
      + '<div class="row" style="margin-top:8px">'
      + '<button class="secondary small" onclick="moveChamber(\'' + tool.id + '\',\''
      + chamber.id + '\',-1)"' + (i === 0 ? ' disabled' : '') + '>&#9650;</button>'
      + '<button class="secondary small" onclick="moveChamber(\'' + tool.id + '\',\''
      + chamber.id + '\',1)"' + (i === chambers.length - 1 ? ' disabled' : '') + '>&#9660;</button>'
      + '<button class="secondary small" onclick="toggleChamberLimits(\'' + chamber.id + '\')">'
      + limitsButtonLabel(chamber) + '</button>'
      + '<button class="danger small" onclick="deleteChamber(\'' + tool.id + '\',\''
      + chamber.id + '\')">Delete chamber</button>'
      + '</div>'
      + chamberLimitsHtml(tool, chamber)
      + '</div>';
  }

  html += '<div class="row" style="margin-top:10px">'
    + '<div class="grow"><input type="text" id="newChamber_' + tool.id + '" '
    + 'placeholder="For example: PM1" '
    + 'onkeydown="onEnter(event, function () { addChamber(\'' + tool.id + '\'); })"></div>'
    + '<button onclick="addChamber(\'' + tool.id + '\')">Add chamber</button>'
    + '</div>';

  return html;
}

// Which chambers have their limits panel open. Reset on every visit to the
// tab, so the setup screen is never a wall of open panels.
var OPEN_LIMITS = {};

// Which chamber types and tools are expanded. Reset whenever you leave the
// tab, so setup always opens as an overview rather than as it was left.
var OPEN_SECTIONS = {};

function toggleSection(id) {
  OPEN_SECTIONS[id] = !OPEN_SECTIONS[id];
  render();
}

// The one-line summary row a collapsed section shows.
//
// tone: "" normal, "warn" for something that still needs attention.
function sectionRowHtml(id, name, summary, tone) {
  var open = !!OPEN_SECTIONS[id];
  return '<button class="section' + (open ? ' open' : '') + (tone ? ' ' + tone : '') + '" '
    + 'onclick="toggleSection(\'' + id + '\')">'
    + '<span><span class="name">' + esc(name) + '</span>'
    + '<span class="sub">' + summary + '</span></span>'
    + '<span class="caret">' + (open ? 'Hide &#9650;' : 'Edit &#9660;') + '</span></button>';
}

// Pressing Enter in an "add" box should do what the button next to it does.
// On a tablet the keyboard's Enter is under your thumb and the button is
// across the screen, so this is most of the typing saved during setup.
function onEnter(event, action) {
  if (event.key !== "Enter") return;
  event.preventDefault();
  action();
}

function toggleChamberLimits(chamberId) {
  OPEN_LIMITS[chamberId] = !OPEN_LIMITS[chamberId];
  render();
}

function limitsButtonLabel(chamber) {
  var n = countOverrides(chamber);
  var tail = n === 0 ? "" : " (" + n + " custom)";
  // The count stays on the label while the panel is open, so you can see what
  // you have changed without closing it again.
  return (OPEN_LIMITS[chamber.id] ? "Hide limits" : "Limits") + tail;
}

// ---------------------------------------------------------------------------
// One chamber's limits.
//
// Normally a chamber uses its type's limits and there is nothing to do here.
// This is for the case where two chambers run the same process to different
// specs - a tighter kit life on one chamber, a looser leak rate on another.
//
// Only the min and max can differ. The reading's name and unit always come
// from the type, so the chambers stay comparable in Excel.
// ---------------------------------------------------------------------------
function chamberLimitsHtml(tool, chamber) {
  if (!OPEN_LIMITS[chamber.id]) return "";

  var type = findChamberType(chamber.typeId);
  if (!type) return '<p class="hint">This chamber has no type, so there is nothing to set.</p>';
  if (type.points.length === 0) {
    return '<p class="hint">The "' + esc(type.name) + '" type has no readings yet.</p>';
  }

  var overrides = chamber.limits || {};
  var html = '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'
    + '<p class="hint">Limits for ' + esc(chamber.name) + ' only. Blank boxes mean no limit. '
    + 'Leave a reading alone and it uses the ' + esc(type.name) + ' type\'s limits.</p>';

  for (var i = 0; i < type.points.length; i++) {
    var point = type.points[i];
    var own = overrides[point.id];
    var effective = own ? own : point;
    var isCustom = !!own;
    var rowId = chamber.id + "_" + point.id;

    // The "custom" chip and the reset button are always in the page, shown or
    // hidden as needed. Building them up front means typing a limit can update
    // this block in place instead of redrawing it and taking the cursor away.
    html += '<div class="pointedit" id="clirow_' + rowId + '"' + (isCustom ? customRowStyle() : '') + '>'
      + '<div class="spread">'
      + '<strong style="font-size:15px">' + esc(point.name)
      + (point.unit ? ' (' + esc(point.unit) + ')' : '') + '</strong>'
      + '<span class="chip bad" id="clichip_' + rowId + '"'
      + (isCustom ? '' : ' style="display:none"') + '>custom</span></div>'
      + '<p class="hint" style="margin:4px 0 8px">Type default: '
      + esc(plainLimits(point)) + '</p>'
      + '<div class="grid">'
      + '<div><label>Min</label><input type="number" step="any" value="'
      + (effective.min === null || effective.min === undefined ? "" : esc(effective.min))
      + '" placeholder="no min" oninput="updateChamberLimit(\'' + tool.id + '\',\''
      + chamber.id + '\',\'' + point.id + '\')" id="climin_' + rowId + '"></div>'
      + '<div><label>Max</label><input type="number" step="any" value="'
      + (effective.max === null || effective.max === undefined ? "" : esc(effective.max))
      + '" placeholder="no max" oninput="updateChamberLimit(\'' + tool.id + '\',\''
      + chamber.id + '\',\'' + point.id + '\')" id="climax_' + rowId + '"></div>'
      + '</div>'
      + '<div class="row" style="margin-top:8px">'
      + '<button class="secondary small" id="clireset_' + rowId + '"'
      + (isCustom ? '' : ' disabled')
      + ' onclick="clearChamberLimit(\'' + tool.id + '\',\'' + chamber.id + '\',\''
      + point.id + '\')">Use the type default again</button></div>'
      + '</div>';
  }

  html += '</div>';
  return html;
}

// The amber highlight that marks a reading set differently from its type.
function customRowStyle() {
  return ' style="background:var(--warn-bg);border-color:#f0cf9a"';
}

// Show or hide one row's "custom" marks, without redrawing anything.
function refreshLimitRow(chamberId, pointId, isCustom) {
  var rowId = chamberId + "_" + pointId;
  var row = document.getElementById("clirow_" + rowId);
  var chip = document.getElementById("clichip_" + rowId);
  var reset = document.getElementById("clireset_" + rowId);
  if (!row || !chip || !reset) return;

  row.style.background = isCustom ? "var(--warn-bg)" : "";
  row.style.borderColor = isCustom ? "#f0cf9a" : "";
  chip.style.display = isCustom ? "" : "none";
  reset.disabled = !isCustom;
}

// The type's limits in plain words, for the "what you are deviating from" line.
function plainLimits(point) {
  if (point.min !== null && point.max !== null) return point.min + " to " + point.max;
  if (point.min !== null) return point.min + " or above";
  if (point.max !== null) return point.max + " or below";
  return "no limits";
}

// Read both boxes and store the result. Both are taken together, because a
// limit is a pair: setting only a max still means "and no min".
function updateChamberLimit(toolId, chamberId, pointId) {
  var tool = findTool(toolId);
  if (!tool) return;
  var chamber = findChamber(tool, chamberId);
  if (!chamber) return;
  var type = findChamberType(chamber.typeId);
  if (!type) return;

  var point = null;
  for (var i = 0; i < type.points.length; i++) {
    if (type.points[i].id === pointId) point = type.points[i];
  }
  if (!point) return;

  var minBox = document.getElementById("climin_" + chamberId + "_" + pointId);
  var maxBox = document.getElementById("climax_" + chamberId + "_" + pointId);
  setChamberLimit(chamber, point, numberOrNull(minBox.value.trim()), numberOrNull(maxBox.value.trim()));
  save();

  // Update the marks in place rather than redrawing, which would throw away
  // the box being typed in along with the cursor sitting in it.
  refreshLimitRow(chamber.id, point.id, !!(chamber.limits && chamber.limits[point.id]));
  refreshLimitsButton(chamber);
}

function clearChamberLimit(toolId, chamberId, pointId) {
  var tool = findTool(toolId);
  if (!tool) return;
  var chamber = findChamber(tool, chamberId);
  if (!chamber || !chamber.limits) return;
  delete chamber.limits[pointId];
  save();
  render();
}

// Update just the "Limits (n custom)" label, without a full redraw.
function refreshLimitsButton(chamber) {
  var buttons = document.querySelectorAll('button[onclick="toggleChamberLimits(\'' + chamber.id + '\')"]');
  for (var i = 0; i < buttons.length; i++) buttons[i].textContent = limitsButtonLabel(chamber);
}

function addChamber(toolId) {
  var tool = findTool(toolId);
  if (!tool) return;
  if (DATA.chamberTypes.length === 0) {
    setMsg("toolsMsg", "err", "Add a chamber type at the top of this tab first.");
    return;
  }
  var box = document.getElementById("newChamber_" + toolId);
  var name = box.value.trim();
  if (name === "") { setMsg("toolsMsg", "err", "Type a name for the chamber first."); return; }
  if (findChamberByName(tool, name)) {
    setMsg("toolsMsg", "err", tool.name + " already has a chamber called that.");
    return;
  }

  if (!tool.chambers) tool.chambers = [];
  // Default to the first type. Almost always right for a tool whose chambers
  // are all the same, and one tap to change when they are not.
  tool.chambers.push({ id: newId(), name: name, typeId: DATA.chamberTypes[0].id, limits: {} });
  save();
  render();
  setMsg("toolsMsg", "ok", "Added " + name + " to " + tool.name
    + ". Check its type is right.");
}

function renameChamber(toolId, chamberId, name) {
  var tool = findTool(toolId);
  if (!tool) return;
  var chamber = findChamber(tool, chamberId);
  if (!chamber) return;
  name = String(name).trim();
  if (name === "") return;
  chamber.name = name;
  save();
}

function setChamberType(toolId, chamberId, typeId) {
  var tool = findTool(toolId);
  if (!tool) return;
  var chamber = findChamber(tool, chamberId);
  if (!chamber) return;
  chamber.typeId = typeId;
  save();
  render();
}

function moveChamber(toolId, chamberId, step) {
  var tool = findTool(toolId);
  if (!tool) return;
  movePointInList(tool.chambers, chamberId, step);
  save();
  render();
}

function deleteChamber(toolId, chamberId) {
  var tool = findTool(toolId);
  if (!tool) return;
  var chamber = findChamber(tool, chamberId);
  if (!chamber) return;

  var logged = countReadingsForChamber(toolId, chamberId);
  var question = 'Delete the chamber "' + chamber.name + '" from ' + tool.name + '?';
  if (logged > 0) question += "\n\nThis also deletes " + logged
    + " readings logged against it. This cannot be undone.";
  if (!window.confirm(question)) return;
  if (logged > 0 && !window.confirm("Really delete " + logged
      + " readings? Export first if you are not sure.")) return;

  var kept = [];
  for (var i = 0; i < tool.chambers.length; i++) {
    if (tool.chambers[i].id !== chamberId) kept.push(tool.chambers[i]);
  }
  tool.chambers = kept;

  var dates = Object.keys(DATA.entries);
  for (var d = 0; d < dates.length; d++) {
    var entry = DATA.entries[dates[d]][toolId];
    if (entry && entry.chambers) delete entry.chambers[chamberId];
  }
  save();
  render();
  setMsg("toolsMsg", "ok", "Deleted " + chamber.name + ".");
}

function countReadingsForChamber(toolId, chamberId) {
  var total = 0;
  var dates = Object.keys(DATA.entries);
  for (var d = 0; d < dates.length; d++) {
    var entry = DATA.entries[dates[d]][toolId];
    if (!entry || !entry.chambers || !entry.chambers[chamberId]) continue;
    var values = entry.chambers[chamberId].values;
    var keys = Object.keys(values);
    for (var k = 0; k < keys.length; k++) {
      if (String(values[keys[k]]).trim() !== "") total++;
    }
  }
  return total;
}

function addTool() {
  var box = document.getElementById("newToolName");
  var name = box.value.trim();
  if (name === "") { setMsg("toolsMsg", "err", "Type a name for the tool first."); return; }
  if (findToolByName(name)) { setMsg("toolsMsg", "err", "There is already a tool called that."); return; }

  DATA.tools.push({ id: newId(), name: name, points: [], chambers: [] });
  save();
  box.value = "";
  render();
  setMsg("toolsMsg", "ok", "Added " + name + ". Now add the readings you take at it.");
}

function renameTool(toolId, name) {
  var tool = findTool(toolId);
  if (!tool) return;
  name = name.trim();
  // An empty box means the user is mid-way through retyping. Keep the old name
  // until they have typed a new one, rather than leaving a nameless tool.
  if (name === "") return;
  tool.name = name;
  save();
  warnAboutDuplicateNames();
}

// Deleting a tool also deletes its logged readings. There is no way to keep
// readings for a tool that no longer exists, so we say so plainly and ask
// twice when there is real data at stake.
function deleteTool(toolId) {
  var tool = findTool(toolId);
  if (!tool) return;

  var readings = countReadingsForTool(toolId);
  var question = "Delete the tool \"" + tool.name + "\"?";
  if (readings > 0) question += "\n\nThis also deletes " + readings + " logged readings for it. This cannot be undone.";
  if (!window.confirm(question)) return;
  if (readings > 0 && !window.confirm("Really delete " + readings + " readings? Export first if you are not sure.")) return;

  // Remove the tool.
  var kept = [];
  for (var i = 0; i < DATA.tools.length; i++) {
    if (DATA.tools[i].id !== toolId) kept.push(DATA.tools[i]);
  }
  DATA.tools = kept;

  // Remove its entries on every date.
  var dates = Object.keys(DATA.entries);
  for (var d = 0; d < dates.length; d++) {
    delete DATA.entries[dates[d]][toolId];
    if (Object.keys(DATA.entries[dates[d]]).length === 0) delete DATA.entries[dates[d]];
  }

  save();
  render();
  setMsg("toolsMsg", "ok", "Deleted " + tool.name + ".");
}

// Every reading logged against a tool, including all of its chambers.
function countReadingsForTool(toolId) {
  var total = 0;
  var dates = Object.keys(DATA.entries);
  for (var d = 0; d < dates.length; d++) {
    var entry = DATA.entries[dates[d]][toolId];
    if (!entry) continue;
    total += countFilled(entry.values || {});
    var chamberIds = Object.keys(entry.chambers || {});
    for (var c = 0; c < chamberIds.length; c++) {
      total += countFilled(entry.chambers[chamberIds[c]].values);
    }
  }
  return total;
}

// How many of a set of values were actually filled in.
function countFilled(values) {
  var n = 0;
  var keys = Object.keys(values);
  for (var k = 0; k < keys.length; k++) {
    if (String(values[keys[k]]).trim() !== "") n++;
  }
  return n;
}

// Move a tool up or down the round order.
function moveTool(toolId, step) {
  for (var i = 0; i < DATA.tools.length; i++) {
    if (DATA.tools[i].id !== toolId) continue;
    var to = i + step;
    if (to < 0 || to >= DATA.tools.length) return;
    var moved = DATA.tools[i];
    DATA.tools[i] = DATA.tools[to];
    DATA.tools[to] = moved;
    save();
    render();
    return;
  }
}

function addPoint(toolId) {
  var tool = findTool(toolId);
  if (!tool) return;
  var box = document.getElementById("newPoint_" + toolId);
  var name = box.value.trim();
  if (name === "") { setMsg("toolsMsg", "err", "Type a name for the reading first."); return; }
  if (findPointByName(tool, name)) { setMsg("toolsMsg", "err", tool.name + " already has a reading called that."); return; }

  tool.points.push(newPointFrom(name));
  save();
  render();
  setMsg("toolsMsg", "ok", "Added " + name + reusedNote(name) + " to " + tool.name + ".");
}

// Change one field of one data point. Min and max come in as text from the
// box: an empty box means "no limit", which we store as null.
//
// IMPORTANT: this is called from oninput, which fires on every keystroke, and
// it deliberately does NOT redraw the screen. Two reasons. Redrawing while you
// are typing throws away the box you are typing in, which on a touchscreen
// means a lost keypress and a lost cursor. And an earlier version used
// onchange, which only fires when a box loses focus: type a limit, tap
// straight to another tab, and the limit was never saved. Saving on every
// keystroke has neither problem.
function updatePoint(toolId, pointId, field, value) {
  var tool = findTool(toolId);
  if (!tool) return;
  var point = findPoint(tool, pointId);
  if (!point) return;

  applyPointField(point, field, value);
  save();
  warnAboutDuplicateNames();
}

function deletePoint(toolId, pointId) {
  var tool = findTool(toolId);
  if (!tool) return;
  var point = findPoint(tool, pointId);
  if (!point) return;
  if (!window.confirm("Delete the reading \"" + point.name + "\" from " + tool.name
      + "?\n\nAny values already logged for it are deleted too.")) return;

  var kept = [];
  for (var i = 0; i < tool.points.length; i++) {
    if (tool.points[i].id !== pointId) kept.push(tool.points[i]);
  }
  tool.points = kept;
  forgetPointEverywhere(pointId);
  save();
  render();
}

function movePoint(toolId, pointId, step) {
  var tool = findTool(toolId);
  if (!tool) return;
  movePointInList(tool.points, pointId, step);
  save();
  render();
}

// Copy every reading from another tool into this one. Readings this tool
// already has, by name, are left alone rather than duplicated.
function copyPoints(toolId) {
  var tool = findTool(toolId);
  var fromId = document.getElementById("copyFrom_" + toolId).value;
  var source = findTool(fromId);
  if (!tool || !source) return;

  var added = 0;
  for (var i = 0; i < source.points.length; i++) {
    var point = source.points[i];
    if (findPointByName(tool, point.name)) continue;
    tool.points.push({ id: newId(), name: point.name, unit: point.unit, min: point.min, max: point.max });
    added++;
  }
  save();
  render();
  setMsg("toolsMsg", "ok", "Copied " + added + " readings from " + source.name + " into " + tool.name + ".");
}

// A small made-up setup so you can try the whole flow before typing your own.
// Build the example's one custom limit, by finding the reading by name.
function kitLifeOverride(type, max) {
  var limits = {};
  for (var i = 0; i < type.points.length; i++) {
    if (type.points[i].name === "Kit life used") {
      limits[type.points[i].id] = { min: null, max: max };
    }
  }
  return limits;
}

function loadExample() {
  if (DATA.tools.length > 0 && !window.confirm("This adds two example tools to your list. Continue?")) return;

  // Two chamber types, to show how a tool with mixed chambers works.
  var etchType = { id: newId(), name: "Example Etch", points: [
    { id: newId(), name: "Chamber pressure", unit: "mTorr", min: 8, max: 12 },
    { id: newId(), name: "He leak rate", unit: "sccm", min: null, max: 2.5 },
    { id: newId(), name: "RF hours", unit: "h", min: null, max: null },
    { id: newId(), name: "Kit life used", unit: "%", min: null, max: 80 }
  ] };
  var stripType = { id: newId(), name: "Example Strip", points: [
    { id: newId(), name: "Chamber pressure", unit: "mTorr", min: 800, max: 1200 },
    { id: newId(), name: "Source hours", unit: "h", min: null, max: null }
  ] };
  DATA.chamberTypes.push(etchType);
  DATA.chamberTypes.push(stripType);

  // A cluster tool: three chambers of two different types, plus facilities
  // readings that belong to the whole machine.
  DATA.tools.push({
    id: newId(), name: "Example Etcher 3",
    points: [
      { id: newId(), name: "Chiller temperature", unit: "C", min: 18, max: 22 },
      { id: newId(), name: "N2 pressure", unit: "psi", min: 40, max: 60 }
    ],
    chambers: [
      { id: newId(), name: "PM1", typeId: etchType.id, limits: {} },
      // PM2 runs the same process but its kit is held to a tighter limit, to
      // show how one chamber can differ without affecting the others.
      { id: newId(), name: "PM2", typeId: etchType.id,
        limits: kitLifeOverride(etchType, 60) },
      { id: newId(), name: "PM3", typeId: stripType.id, limits: {} }
    ]
  });

  // A single-chamber tool, to show that nothing changes for the simple case.
  DATA.tools.push({
    id: newId(), name: "Example Wet Bench 1",
    points: [
      { id: newId(), name: "Bath temperature", unit: "C", min: 60, max: 65 },
      { id: newId(), name: "DI resistivity", unit: "Mohm-cm", min: 17, max: null },
      { id: newId(), name: "N2 pressure", unit: "psi", min: 40, max: 60 }
    ],
    chambers: []
  });
  save();
  showTab("tools");
  setMsg("toolsMsg", "ok", "Loaded two example tools, one with chambers and one without. "
    + "Delete them once you have added your real ones.");
}

// THE FLEET SUMMARY EMAIL
//
// Produces the message you used to assemble by hand: an opening line, the
// date, and the table of percentages remaining with the low ones shaded.
//
// The colours are inline styles rather than classes because that is the only
// styling an email client keeps. Pasting into Outlook has no stylesheet to
// consult.
// ---------------------------------------------------------------------------
function emailGreeting() {
  return DATA.emailGreeting || "Hello All,";
}

function updateGreeting() {
  DATA.emailGreeting = document.getElementById("greetingBox").value;
  save();
}

function updateThresholds() {
  var red = Number(document.getElementById("redBox").value);
  var amber = Number(document.getElementById("amberBox").value);
  if (!isNaN(red)) DATA.lifeRedBelow = red;
  if (!isNaN(amber)) DATA.lifeAmberBelow = amber;
  save();
  // Redraw only the generated table, so the boxes keep the cursor.
  if (document.getElementById("emailBody")) refreshEmailBody();
}

// The whole message, as HTML. Also what gets copied and downloaded.
function emailHtml() {
  var fleet = fleetLife(CURRENT_DATE);
  return '<div style="font-family:Segoe UI,Arial,sans-serif;font-size:14px">'
    + '<p>' + esc(emailGreeting()) + '</p>'
    + '<p>Here is a snapshot of percentages remaining on kit life for each '
    + 'chamber by tool:</p>'
    + '<p><strong>Fleet Summary</strong> &nbsp; Last updated &nbsp; '
    + esc(fleet.lastUpdated === "" ? CURRENT_DATE : fleet.lastUpdated) + '</p>'
    + fleetTableHtml(fleet)
    + (fleet.stale.length > 0
        ? '<p style="color:#5b6570"><em>Not logged in the last 14 days: '
          + esc(fleet.stale.join(", ")) + '. Those figures are as of the last reading.</em></p>'
        : '')
    + '</div>';
}

// A plain-text version, for a client that refuses HTML.
function emailText() {
  var fleet = fleetLife(CURRENT_DATE);
  var lines = [emailGreeting(), ""];
  lines.push("Here is a snapshot of percentages remaining on kit life for each chamber by tool:");
  lines.push("Fleet Summary - last updated " + (fleet.lastUpdated || CURRENT_DATE));
  lines.push("");

  var header = [padRight("Tool", 12), padRight("Chamber", 10)];
  for (var m = 0; m < fleet.metrics.length; m++) header.push(padRight(fleet.metrics[m] + " %", 20));
  lines.push(header.join(""));

  for (var r = 0; r < fleet.rows.length; r++) {
    var row = fleet.rows[r];
    var out = [padRight(row.tool, 12), padRight(row.unit, 10)];
    for (var c = 0; c < row.cells.length; c++) {
      out.push(padRight(row.cells[c].percent === null
        ? "N/A" : Math.round(row.cells[c].percent) + "%", 20));
    }
    lines.push(out.join(""));
  }
  return lines.join("\n");
}

function generateEmail() {
  var fleet = fleetLife(CURRENT_DATE);
  if (fleet.metrics.length === 0) {
    setMsg("emailMsg", "err", "No readings are ticked as counting up to a limit yet, "
      + "so there is nothing to report. Tick one on the Tools tab.");
