  bump("emailsGenerated");
  document.getElementById("emailPanel").innerHTML =
    '<p class="hint" style="margin-top:12px">This is what will be pasted. '
    + 'Check it, then copy.</p>'
    + '<div id="emailBody" style="border:1px solid var(--line);border-radius:6px;'
    + 'padding:12px;background:#fff;overflow-x:auto">' + emailHtml() + '</div>'
    + '<div class="big-actions">'
    + '<button onclick="copyEmail()">Copy for Outlook</button>'
    + '<button class="secondary" onclick="downloadEmail()">Download as a file</button>'
    + '<button class="secondary" onclick="hideEmail()">Hide</button>'
    + '</div>';
  setMsg("emailMsg", "ok", "Built from readings up to " + CURRENT_DATE + ".");
}

function refreshEmailBody() {
  var box = document.getElementById("emailBody");
  if (box) box.innerHTML = emailHtml();
}

function hideEmail() {
  document.getElementById("emailPanel").innerHTML = "";
  setMsg("emailMsg", "info", "");
}

// Put the table on the clipboard as real HTML, so pasting into Outlook keeps
// the table and the shading. Falls back to selecting it for you, which
// preserves formatting just as well when you press Ctrl+C yourself.
async function copyEmail() {
  var html = emailHtml();
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([emailText()], { type: "text/plain" })
      })]);
      setMsg("emailMsg", "ok", "Copied. Paste into Outlook and the table keeps its colours.");
      return;
    }
  } catch (e) {
    // Fall through to selecting it by hand.
  }
  selectEmailBody();
  setMsg("emailMsg", "info", "This browser would not let the page copy for you. "
    + "The table is selected - press Ctrl+C, and the formatting still comes across.");
}

function selectEmailBody() {
  var box = document.getElementById("emailBody");
  if (!box || !window.getSelection) return;
  var range = document.createRange();
  range.selectNodeContents(box);
  var selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
}

function downloadEmail() {
  var name = "fleet_summary_" + CURRENT_DATE + ".html";
  // A whole page rather than a fragment, so double-clicking it opens properly.
  downloadFile('<!DOCTYPE html><html><head><meta charset="utf-8">'
    + '<title>Fleet summary ' + esc(CURRENT_DATE) + '</title></head><body>'
    + emailHtml() + '</body></html>', name, "text/html");
  setMsg("emailMsg", "ok", "Saved " + name + ". Open it, select all, and copy into Outlook.");
}

// ---------------------------------------------------------------------------
// EXPORT
//
// The CSV has one row per reading. That shape is called "long" or "tidy". It
// is deliberately not a grid with one column per reading, because your tools
// each log different things and a grid would be full of holes. Long format is
// also exactly what an Excel PivotTable wants.
//
// To change which columns come out, edit the header row and the row built
// just below it. Keep the two in the same order.
// ---------------------------------------------------------------------------
// Pass a date to get just that day's round. Pass null to get everything.
function buildCsv(onlyDate) {
  var rows = [["Date", "Tool", "Chamber", "Chamber type", "Data point", "Unit",
               "Value", "Min", "Max", "Status", "Saved at"]];

  var dates = onlyDate ? [onlyDate] : Object.keys(DATA.entries).sort();
  for (var d = 0; d < dates.length; d++) {
    var date = dates[d];
    var day = DATA.entries[date];
    if (!day) continue;
    // Walk the tools in round order, so the file reads the way you walk.
    for (var t = 0; t < DATA.tools.length; t++) {
      var tool = DATA.tools[t];
      if (!day[tool.id]) continue;

      // Tool readings first, then each chamber, matching the tool screen.
      var units = toolUnits(tool);
      for (var u = 0; u < units.length; u++) {
        var unit = units[u];
        var stored = unitEntry(tool.id, unit.id, date);
        if (!stored) continue;

        for (var p = 0; p < unit.points.length; p++) {
          var point = unit.points[p];
          var value = stored.values[point.id];
          if (value === undefined || String(value).trim() === "") continue;  // skip blanks
          rows.push([
            date,
            tool.name,
            // Tool-level readings leave the chamber columns empty, so an Excel
            // filter on Chamber cleanly separates the two.
            unit.kind === "chamber" ? unit.name : "",
            unit.kind === "chamber" ? unit.typeName : "",
            point.name,
            point.unit,
            value,
            point.min === null ? "" : point.min,
            point.max === null ? "" : point.max,
            rangeStatus(value, point),
            stored.savedAt || ""
          ]);
        }
      }
    }
  }

  // The "\uFEFF" at the front is a byte order mark: an invisible marker
  // that tells Excel to read the file as UTF-8. Without it, degree signs and
  // other symbols come out as gibberish when Excel opens the file.
  // \r\n line endings are what Excel on Windows expects.
  return "\uFEFF" + rows.map(csvLine).join("\r\n") + "\r\n";
}

// Turn one row into a line of CSV, quoting anything that needs it.
function csvLine(row) {
  return row.map(function (cell) {
    var s = String(cell === undefined || cell === null ? "" : cell);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",");
}

// The daily habit: one file per round, named for THE DAY THE READINGS WERE
// TAKEN, not the day you pressed the button. Back-fill a missed Tuesday on
// Thursday and the file is still named for the Tuesday.
function exportRoundCsv() {
  var date = CURRENT_DATE;
  if (countReadingsOnDate(date) === 0) {
    setMsg("exportMsg", "err", "Nothing is logged for " + date + " yet, so there is nothing to export.");
    return;
  }
  var name = "pm_round_" + date + ".csv";
  downloadFile(buildCsv(date), name, "text/csv");
  bump("exportsRound");
  markExported(name, "exportMsg");
}

// Everything in one file, for trending in Excel. Named for the last day it
// contains, so the name says what is actually inside it.
function exportAllCsv() {
  if (countAllReadings() === 0) {
    setMsg("exportMsg", "err", "There are no readings to export yet.");
    return;
  }
  var name = "pm_readings_through_" + lastLoggedDate() + ".csv";
  downloadFile(buildCsv(null), name, "text/csv");
  bump("exportsEverything");
  markExported(name, "exportMsg");
}

function exportJson() {
  var name = "pm_backup_through_" + lastLoggedDate() + ".json";
  downloadFile(JSON.stringify(DATA, null, 2), name, "application/json");
  bump("exportsBackup");
  markExported(name, "exportMsg");
}

// How many readings were typed in on one particular day.
function countReadingsOnDate(date) {
  var day = DATA.entries[date];
  if (!day) return 0;
  var total = 0;
  var toolIds = Object.keys(day);
  for (var t = 0; t < toolIds.length; t++) {
    var entry = day[toolIds[t]];
    total += countFilled(entry.values || {});
    var chamberIds = Object.keys(entry.chambers || {});
    for (var c = 0; c < chamberIds.length; c++) {
      total += countFilled(entry.chambers[chamberIds[c]].values);
    }
  }
  return total;
}

// The most recent day that has anything logged against it.
function lastLoggedDate() {
  var dates = Object.keys(DATA.entries).sort();
  return dates.length > 0 ? dates[dates.length - 1] : todayStr();
}

// ---------------------------------------------------------------------------
// SAVING SOMEWHERE YOU CHOOSE
//
// Normally an export lands wherever Edge is set to put downloads, which is the
// right answer for the daily round: point that setting at your OneDrive folder
// once and every export files itself with no taps at all.
//
// This is for the exceptions - a copy onto a USB stick, or one file that needs
// to go somewhere else - without touching your Edge settings.
//
// We tested the other approach on the real tablet and rejected it: letting the
// page remember a folder and write into it silently is possible, but the
// browser asks permission again every session, so it would have cost a tap
// every single morning. A Save As box costs one dialog only when you ask for
// it. That is why this is a separate button and not the default.
// ---------------------------------------------------------------------------
function canSaveAs() {
  return typeof window.showSaveFilePicker === "function";
}

// Written with async/await rather than the plain functions used elsewhere in
// this file, because the browser's save dialog hands back promises and this
// reads far better than chaining .then() calls.
async function exportRoundToChosenFolder() {
  var date = CURRENT_DATE;
  if (countReadingsOnDate(date) === 0) {
    setMsg("exportMsg", "err", "Nothing is logged for " + date + " yet, so there is nothing to export.");
    return;
  }

  var name = "pm_round_" + date + ".csv";
  var text = buildCsv(date);

  try {
    var handle = await window.showSaveFilePicker({
      suggestedName: name,
      types: [{ description: "CSV for Excel", accept: { "text/csv": [".csv"] } }]
    });
    var writer = await handle.createWritable();
    await writer.write(text);
    await writer.close();
    bump("exportsRoundToChosenFolder");
    markExported(handle.name, "exportMsg");
  } catch (e) {
    if (e.name === "AbortError") {
      setMsg("exportMsg", "info", "Cancelled. Nothing was saved.");
      return;
    }
    // Anything else - a locked folder, a full disk, a browser that changed its
    // mind - falls back to a normal download. Never lose the export just
    // because the fancy route failed.
    downloadFile(text, name, "text/csv");
    bump("exportsRound");
    markExported(name, "exportMsg");
    setMsg("exportMsg", "info", "Could not save where you picked (" + e.name
      + "), so " + name + " went to the download folder instead.");
  }
}

// Remember that we exported today, so the reminder banner goes quiet.
function markExported(filename, msgId) {
  DATA.lastExport = todayStr();
  save();
  setMsg(msgId, "ok", "Saved " + filename + " to this tablet's Downloads folder. "
    + "Move it somewhere safe now.");
  renderBanner();
}

// Hand the browser a file to save. This is all done in memory. Nothing is
// uploaded and no network connection is opened.
function downloadFile(text, filename, mimeType) {
  var blob = new Blob([text], { type: mimeType });
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// ---------------------------------------------------------------------------
// IMPORT
//
// Both file types end up in the same shape before anything is changed:
//
//   { tools: [ {name, points:[{name,unit,min,max}]} ],
//     rows:  [ {date, tool, point, unit, min, max, value, savedAt} ] }
//
// That way there is only one piece of code that actually changes your data,
// no matter which kind of file you picked. Tools and readings are matched by
// NAME on the way in, because a file has names in it, not ids.
// ---------------------------------------------------------------------------
var PENDING_IMPORT = null;   // the parsed file, waiting for merge or replace

// Read every file the user picked. Because the daily habit makes one file per
// round, restoring a wiped tablet means picking a whole year of them at once,
// so this takes as many as you like and rolls them into one import.
//
// A file that cannot be read does not sink the rest. It is reported by name
// and the others still go in.
function fileChosen() {
  var input = document.getElementById("importFile");
  if (!input.files || input.files.length === 0) return;

  // Sort by name so importing the same folder twice behaves the same way.
  // Daily files are named by date, so this also puts them in date order.
  var files = [];
  for (var i = 0; i < input.files.length; i++) files.push(input.files[i]);
  files.sort(function (a, b) { return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0); });

  var combined = { tools: [], chamberTypes: [], rows: [] };
  var problems = [];
  var waitingFor = files.length;

  setMsg("importMsg", "info", "Reading " + files.length + (files.length === 1 ? " file..." : " files..."));

  // Called as each file finishes, whether it worked or not. When the last one
  // is done, we show the merge or replace choice.
  function oneFileDone() {
    waitingFor = waitingFor - 1;
    if (waitingFor > 0) return;

    if (combined.tools.length === 0 && combined.rows.length === 0) {
      setMsg("importMsg", "err", "Nothing could be read. " + problems.join("  "));
      return;
    }
    PENDING_IMPORT = combined;
    askMergeOrReplace(files.length === 1 ? files[0].name : files.length + " files", combined, problems);
  }

  files.forEach(function (file) {
    var reader = new FileReader();
    reader.onerror = function () {
      problems.push(file.name + ": could not be read.");
      oneFileDone();
    };
    reader.onload = function () {
      var text = String(reader.result);
      try {
        var parsed = (file.name.toLowerCase().indexOf(".json") !== -1 || text.trim().charAt(0) === "{")
          ? parseBackupJson(text)
          : parseReadingsCsv(text);
        // Duplicate tools across files are harmless: ensureTool() matches on
        // name, so the second and later copies simply find the first one.
        combined.tools = combined.tools.concat(parsed.tools);
        combined.chamberTypes = combined.chamberTypes.concat(parsed.chamberTypes || []);
        combined.rows = combined.rows.concat(parsed.rows);
      } catch (e) {
        problems.push(file.name + ": " + e.message);
      }
      oneFileDone();
    };
    reader.readAsText(file);
  });
}

// Count distinct names or dates, so a folder of daily files does not report
// "250 tools" when it is really the same eight tools 250 times over.
function countDistinct(list) {
  var seen = {};
  var n = 0;
  for (var i = 0; i < list.length; i++) {
    // The "n:" prefix stops a name like "constructor" colliding with a
    // built-in property.
    var key = "n:" + String(list[i]).trim().toLowerCase();
    if (seen[key] !== true) { seen[key] = true; n++; }
  }
  return n;
}

// Show the two big choices once the files have been read.
function askMergeOrReplace(label, parsed, problems) {
  var box = document.getElementById("importChoice");

  var toolNames = parsed.tools.map(function (t) { return t.name; });
  var dates = parsed.rows.map(function (r) { return r.date; });
  var chamberCount = 0;
  for (var i = 0; i < parsed.tools.length; i++) {
    chamberCount += (parsed.tools[i].chambers || []).length;
  }

  var trouble = "";
  if (problems && problems.length > 0) {
    trouble = '<p class="hint" style="color:var(--accent)"><strong>Skipped '
      + problems.length + (problems.length === 1 ? ' file:</strong> ' : ' files:</strong> ')
      + esc(problems.join("  ")) + '</p>';
  }

  box.innerHTML = '<p class="hint" style="margin-top:12px"><strong>' + esc(label) + '</strong> holds '
    + countDistinct(toolNames) + ' tools'
    + (chamberCount > 0 ? ', ' + chamberCount + ' chambers' : '')
    + ' and ' + parsed.rows.length + ' readings across '
    + countDistinct(dates) + ' days. What should happen to '
    + 'what is already on this tablet?</p>'
    + trouble
    + '<div class="big-actions">'
    + '<button onclick="runImport(\'merge\')">Merge &ndash; keep what is here, add what is missing</button>'
    + '<button class="secondary" onclick="runImport(\'replace\')">Replace &ndash; erase this tablet, use the file</button>'
    + '<button class="secondary" onclick="cancelImport()">Cancel</button>'
    + '</div>';
  setMsg("importMsg", "info", "Nothing has changed yet.");
}

function cancelImport() {
  PENDING_IMPORT = null;
  document.getElementById("importChoice").innerHTML = "";
  document.getElementById("importFile").value = "";
  setMsg("importMsg", "info", "Import cancelled. Nothing changed.");
}

// The one place that actually changes your data on an import.
function runImport(mode) {
  var parsed = PENDING_IMPORT;
  if (!parsed) return;

  if (mode === "replace") {
    if (!window.confirm("Erase everything on this tablet and use the file instead?")) return;
    DATA.tools = [];
    DATA.entries = {};
    DATA.chamberTypes = [];
  }
  bump(mode === "replace" ? "importsReplace" : "importsMerge");

  // Note which tool-and-date combinations were already here BEFORE we start.
  // In merge mode those are left exactly as they are: the tablet wins.
  var alreadyHere = {};
  var dates = Object.keys(DATA.entries);
  for (var d = 0; d < dates.length; d++) {
    var toolIds = Object.keys(DATA.entries[dates[d]]);
    for (var t = 0; t < toolIds.length; t++) {
      var existing = DATA.entries[dates[d]][toolIds[t]];
      // An entry that holds nothing at all is a leftover scaffold, not real
      // data, so it must not block an import from filling that day in.
      var hasTool = !!existing.savedAt;
      var hasChambers = Object.keys(existing.chambers || {}).length > 0;
      if (hasTool || hasChambers) alreadyHere[dates[d] + "|" + toolIds[t]] = true;
    }
  }

  // Step 1: chamber types first, because a chamber refers to one by name.
  var incomingTypes = parsed.chamberTypes || [];
  for (var y = 0; y < incomingTypes.length; y++) ensureChamberType(incomingTypes[y]);

  // Step 2: make sure every tool, reading and chamber in the file exists here.
  for (var i = 0; i < parsed.tools.length; i++) ensureTool(parsed.tools[i]);

  // Step 3: put the readings in.
  var added = 0, skipped = 0;
  for (var r = 0; r < parsed.rows.length; r++) {
    var row = parsed.rows[r];
    var tool = findToolByName(row.tool);
    if (!tool) continue;

    if (alreadyHere[row.date + "|" + tool.id]) { skipped++; continue; }

    var entry = ensureEntry(tool.id, row.date);

    if (!row.chamber) {
      // A tool-level reading.
      var point = findPointByName(tool, row.point);
      if (!point) continue;
      if (!entry.savedAt) entry.savedAt = row.savedAt || "";
      entry.values[point.id] = row.value;
      added++;
    } else {
      // A chamber reading. Its reading list comes from the chamber's type.
      var chamber = findChamberByName(tool, row.chamber);
      if (!chamber) continue;
      var type = findChamberType(chamber.typeId);
      if (!type) continue;

      var chamberPoint = null;
      for (var q = 0; q < type.points.length; q++) {
        if (type.points[q].name.trim().toLowerCase() === String(row.point).trim().toLowerCase()) {
          chamberPoint = type.points[q];
        }
      }
      if (!chamberPoint) continue;

      if (!entry.chambers[chamber.id]) {
        entry.chambers[chamber.id] = { savedAt: row.savedAt || "", values: {} };
      }
      entry.chambers[chamber.id].values[chamberPoint.id] = row.value;
      added++;
    }
  }

  save();
  PENDING_IMPORT = null;
  showTab("data");

  var note = "Imported " + added + " readings.";
  if (skipped > 0) note += " Skipped " + skipped + " that this tablet already had for the same tool and day.";
  setMsg("importMsg", "ok", note);
}

// Find a tool by name or create it, then do the same for each of its readings.
// Limits from the file are only applied when a reading is brand new here, so
// an import never quietly rewrites limits you have tuned on this tablet.
function ensureTool(incoming) {
  var tool = findToolByName(incoming.name);
  if (!tool) {
    tool = { id: newId(), name: String(incoming.name).trim(), points: [], chambers: [] };
    DATA.tools.push(tool);
  }
  if (!tool.chambers) tool.chambers = [];

  for (var i = 0; i < incoming.points.length; i++) {
    var wanted = incoming.points[i];
    if (findPointByName(tool, wanted.name)) continue;
    tool.points.push(makePoint(wanted));
  }

  // Chambers point at a type by name. The type itself is created separately,
  // by ensureChamberType, before this runs.
  var incomingChambers = incoming.chambers || [];
  for (var c = 0; c < incomingChambers.length; c++) {
    if (findChamberByName(tool, incomingChambers[c].name)) continue;
    var type = findChamberTypeByName(incomingChambers[c].typeName);
    if (!type) continue;
    var made = {
      id: newId(),
      name: String(incomingChambers[c].name).trim(),
      typeId: type.id,
      limits: {}
    };
    // Apply this chamber's own limits, matching readings by name.
    var wantedLimits = incomingChambers[c].limits || [];
    for (var L = 0; L < wantedLimits.length; L++) {
      for (var q2 = 0; q2 < type.points.length; q2++) {
        if (type.points[q2].name.trim().toLowerCase()
            !== String(wantedLimits[L].point).trim().toLowerCase()) continue;
        setChamberLimit(made, type.points[q2],
          wantedLimits[L].min === undefined ? null : wantedLimits[L].min,
          wantedLimits[L].max === undefined ? null : wantedLimits[L].max);
      }
    }
    tool.chambers.push(made);
  }
  return tool;
}

// Find a chamber type by name or create it. Readings are only added when the
// type is brand new here, so an import never quietly rewrites limits you have
// tuned on this tablet.
function ensureChamberType(incoming) {
  var type = findChamberTypeByName(incoming.name);
  if (!type) {
    type = { id: newId(), name: String(incoming.name).trim(), points: [] };
    DATA.chamberTypes.push(type);
  }
  for (var i = 0; i < incoming.points.length; i++) {
    var wanted = incoming.points[i];
    var already = false;
    for (var k = 0; k < type.points.length; k++) {
      if (type.points[k].name.trim().toLowerCase() === String(wanted.name).trim().toLowerCase()) {
        already = true;
      }
    }
    if (already) continue;
    type.points.push(makePoint(wanted));
  }
  return type;
}

function makePoint(wanted) {
  return {
    id: newId(),
    name: String(wanted.name).trim(),
    unit: wanted.unit || "",
    min: wanted.min === undefined ? null : wanted.min,
    max: wanted.max === undefined ? null : wanted.max
  };
}

function parseBackupJson(text) {
  var obj = JSON.parse(text);
  if (!obj || !obj.tools || !obj.entries) throw new Error("It is missing its tools or entries.");

  // Chamber types, if the backup has any. A backup taken before chambers
  // existed simply has none.
  var typesById = {};
  var chamberTypes = [];
  var sourceTypes = obj.chamberTypes || [];
  for (var y = 0; y < sourceTypes.length; y++) {
    var st = sourceTypes[y];
    typesById[st.id] = st;
    chamberTypes.push({ name: st.name, points: copyPointList(st.points) });
  }

  var tools = [];
  var byId = {};
  for (var i = 0; i < obj.tools.length; i++) {
    var t = obj.tools[i];
    byId[t.id] = t;
    var chambers = [];
    var sourceChambers = t.chambers || [];
    for (var c = 0; c < sourceChambers.length; c++) {
      var type = typesById[sourceChambers[c].typeId];
      // Overrides are carried by reading NAME, not by id, because ids are
      // private to the tablet that wrote the file.
      var limits = [];
      var own = sourceChambers[c].limits || {};
      if (type) {
        for (var z = 0; z < type.points.length; z++) {
          var setting = own[type.points[z].id];
          if (!setting) continue;
          limits.push({ point: type.points[z].name,
                        min: setting.min === undefined ? null : setting.min,
                        max: setting.max === undefined ? null : setting.max });
        }
      }
      chambers.push({ name: sourceChambers[c].name,
                      typeName: type ? type.name : "Imported",
                      limits: limits });
    }
    tools.push({ name: t.name, points: copyPointList(t.points), chambers: chambers });
  }

  // Flatten the saved entries into one row per reading.
  var rows = [];
  var dates = Object.keys(obj.entries);
  for (var d = 0; d < dates.length; d++) {
    var day = obj.entries[dates[d]];
    var toolIds = Object.keys(day);
    for (var k = 0; k < toolIds.length; k++) {
      var tool = byId[toolIds[k]];
      if (!tool) continue;                       // an entry for a deleted tool
      var entry = day[toolIds[k]];

      // Tool-level readings.
      if (entry.savedAt) {
        addRows(rows, dates[d], tool.name, "", "", tool.points, entry.values, entry.savedAt);
      }

      // Chamber readings. Which readings a chamber has comes from its type.
      var storedChambers = entry.chambers || {};
      var chamberIds = Object.keys(storedChambers);
      for (var q = 0; q < chamberIds.length; q++) {
        var chamber = null;
        var toolChambers = tool.chambers || [];
        for (var w = 0; w < toolChambers.length; w++) {
          if (toolChambers[w].id === chamberIds[q]) chamber = toolChambers[w];
        }
        if (!chamber) continue;                  // a reading for a deleted chamber
        var chamberType = typesById[chamber.typeId];
        if (!chamberType) continue;
        // Use the limits this chamber actually ran to, so an exported row
        // always agrees with the pass or fail recorded beside it.
        var effectivePoints = [];
        for (var z2 = 0; z2 < chamberType.points.length; z2++) {
          effectivePoints.push(effectivePoint(chamber, chamberType.points[z2]));
        }
        addRows(rows, dates[d], tool.name, chamber.name, chamberType.name,
          effectivePoints, storedChambers[chamberIds[q]].values,
          storedChambers[chamberIds[q]].savedAt);
      }
    }
  }
  return { tools: tools, chamberTypes: chamberTypes, rows: rows };
}

// Copy a reading list, keeping only the parts a file needs to carry.
//
// Named copyPointList, not copyPoints: there is already a copyPoints() used by
// the Tools tab, and two functions with one name means the later one silently
// replaces the earlier. That is exactly what happened here in 1.4.0, and it
// killed the "Copy its tool readings here" button until 1.6.0 without any
// error appearing anywhere.
function copyPointList(points) {
  var out = [];
  for (var i = 0; i < (points || []).length; i++) {
    out.push({
      name: points[i].name,
      unit: points[i].unit || "",
      min: points[i].min === undefined ? null : points[i].min,
      max: points[i].max === undefined ? null : points[i].max
    });
  }
  return out;
}

// Turn one set of saved values into rows, skipping anything left blank.
function addRows(rows, date, toolName, chamberName, typeName, points, values, savedAt) {
  for (var i = 0; i < points.length; i++) {
    var value = (values || {})[points[i].id];
    if (value === undefined || String(value).trim() === "") continue;
    rows.push({
      date: date, tool: toolName, chamber: chamberName, chamberType: typeName,
      point: points[i].name, unit: points[i].unit || "",
      min: points[i].min, max: points[i].max,
      value: String(value), savedAt: savedAt || ""
    });
  }
}

// Read an exported CSV into the common shape. The CSV carries the limits as
// well as the values, so it can rebuild your whole setup on its own. The one
// thing it cannot carry is a tool or reading you set up but never logged,
// because those have no rows. That is what the JSON backup is for.
function parseReadingsCsv(text) {
  var table = parseCsv(text);
  if (table.length < 2) throw new Error("It has no rows in it.");

  // Match the header names to column numbers, so column order can change.
  var header = table[0];
  var col = {};
  for (var h = 0; h < header.length; h++) {
    col[String(header[h]).trim().toLowerCase()] = h;
  }
  var needed = ["date", "tool", "data point", "value"];
  for (var n = 0; n < needed.length; n++) {
    if (col[needed[n]] === undefined) throw new Error("It has no \"" + needed[n] + "\" column.");
  }

  var toolsByName = {};
  var typesByName = {};
  var tools = [];
  var chamberTypes = [];
  var rows = [];

  for (var r = 1; r < table.length; r++) {
    var line = table[r];
    if (line.length === 1 && String(line[0]).trim() === "") continue;   // blank line

    var date = cell(line, col["date"]);
    var toolName = cell(line, col["tool"]);
    var pointName = cell(line, col["data point"]);
    var value = cell(line, col["value"]);
    if (date === "" || toolName === "" || pointName === "") continue;

    var unit = cell(line, col["unit"]);
    var min = numberOrNull(cell(line, col["min"]));
    var max = numberOrNull(cell(line, col["max"]));
    var savedAt = cell(line, col["saved at"]);

    // Chamber columns are optional. A file exported before chambers existed
    // has none, and every row in it is a tool-level reading - which is exactly
    // what it was. That is why older exports still import correctly.
    var chamberName = cell(line, col["chamber"]);
    var typeName = cell(line, col["chamber type"]);
    if (chamberName !== "" && typeName === "") typeName = "Imported";

    // Collect the tool, chamber and reading definitions as we go.
    // The "n:" in front of each key keeps a tool or reading named something
    // like "constructor" from colliding with a built-in property name.
    var key = "n:" + toolName.toLowerCase();
    if (toolsByName[key] === undefined) {
      toolsByName[key] = { name: toolName, points: [], chambers: [], seen: {} };
      tools.push(toolsByName[key]);
    }
    var holder = toolsByName[key];

    if (chamberName === "") {
      // A tool-level reading, belonging to the whole machine.
      var pkey = "n:tool:" + pointName.toLowerCase();
      if (holder.seen[pkey] === undefined) {
        holder.seen[pkey] = true;
        holder.points.push({ name: pointName, unit: unit, min: min, max: max });
      }
    } else {
      // A chamber reading. The reading belongs to the chamber TYPE, so it is
      // collected there; the chamber itself only records which type it is.
      var ckey = "n:cham:" + chamberName.toLowerCase();
      if (holder.seen[ckey] === undefined) {
        holder.seen[ckey] = true;
        holder.chambers.push({ name: chamberName, typeName: typeName, limits: [] });
      }
      // Remember the limits this chamber actually used, so a chamber running
      // to its own spec keeps that spec on the way back in.
      var chamberRef = null;
      for (var cf = 0; cf < holder.chambers.length; cf++) {
        if (holder.chambers[cf].name.toLowerCase() === chamberName.toLowerCase()) {
          chamberRef = holder.chambers[cf];
        }
      }
      if (chamberRef) chamberRef.limits.push({ point: pointName, min: min, max: max });
      var tkey = "n:type:" + typeName.toLowerCase();
      if (typesByName[tkey] === undefined) {
        typesByName[tkey] = { name: typeName, points: [], seen: {} };
        chamberTypes.push(typesByName[tkey]);
      }
      var type = typesByName[tkey];
      var tpkey = "n:" + pointName.toLowerCase();
      if (type.seen[tpkey] === undefined) {
        type.seen[tpkey] = true;
        type.points.push({ name: pointName, unit: unit, min: min, max: max });
      }
    }

    if (value !== "") {
      rows.push({ date: date, tool: toolName, chamber: chamberName, chamberType: typeName,
                  point: pointName, unit: unit, min: min, max: max,
                  value: value, savedAt: savedAt });
    }
  }
  // A CSV has no idea which limits were "the type" and which were one
  // chamber's own - every row just carries the numbers that were applied. So
  // the first chamber seen defines the type, and any chamber that used
  // different numbers becomes an override. The split may not match the tablet
  // the file came from, but every chamber ends up checked against exactly the
  // limits it was checked against before, which is what actually matters.
  for (var i2 = 0; i2 < tools.length; i2++) {
    var toolRef = tools[i2];
    for (var c2 = 0; c2 < toolRef.chambers.length; c2++) {
      var chamberRef2 = toolRef.chambers[c2];
      var typeRef = typesByName["n:type:" + chamberRef2.typeName.toLowerCase()];
      var keptLimits = [];
      for (var L2 = 0; L2 < chamberRef2.limits.length; L2++) {
        var wanted2 = chamberRef2.limits[L2];
        var typePoint = null;
        if (typeRef) {
          for (var q3 = 0; q3 < typeRef.points.length; q3++) {
            if (typeRef.points[q3].name.toLowerCase() === wanted2.point.toLowerCase()) {
              typePoint = typeRef.points[q3];
            }
          }
        }
        if (!typePoint) continue;
        if (wanted2.min === typePoint.min && wanted2.max === typePoint.max) continue;
        keptLimits.push(wanted2);
      }
      chamberRef2.limits = keptLimits;
    }
  }

  // "seen" was only a working note while parsing. Leave it behind.
  for (var i = 0; i < tools.length; i++) delete tools[i].seen;
  for (var y = 0; y < chamberTypes.length; y++) delete chamberTypes[y].seen;

  return { tools: tools, chamberTypes: chamberTypes, rows: rows };
}

// Read one cell out of a CSV line, safely if the column is missing.
function cell(line, index) {
  if (index === undefined || index >= line.length) return "";
  return String(line[index]).trim();
}

function numberOrNull(text) {
  if (text === "" || isNaN(Number(text))) return null;
  return Number(text);
}

// Split CSV text into rows of cells. Handles quoted fields, doubled quotes
// inside them, and commas or line breaks inside quotes.
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, "");     // drop the byte order mark if present

  var rows = [];
  var row = [];
  var field = "";
  var inQuotes = false;

  for (var i = 0; i < text.length; i++) {
    var c = text.charAt(i);

    if (inQuotes) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i++; }   // "" means one "
        else inQuotes = false;
      } else {
        field += c;
      }
      continue;
    }

    if (c === '"') { inQuotes = true; }
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c === "\r") { /* ignore, Windows line endings use \r\n */ }
    else { field += c; }
  }
  if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }

  return rows;
}

// ---------------------------------------------------------------------------
// ERASE
// ---------------------------------------------------------------------------
function eraseAll() {
  var readings = countAllReadings();
  if (!window.confirm("Erase every tool and all " + readings + " readings from this tablet?")) return;
  if (!window.confirm("This cannot be undone. Have you exported? Press OK only if you are sure.")) return;

  bump("erases");
  DATA = blankData();
  save();
  showTab("data");
  setMsg("importMsg", "ok", "Everything erased. You can import a file above to bring it back.");
}

// ---------------------------------------------------------------------------
// SMALL HELPERS
// ---------------------------------------------------------------------------

// Make text safe to drop into the page. Without this, a tool named with a
// "<" in it would break the layout.
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
  });
}

// Put a coloured message under a set of buttons.
function setMsg(id, kind, text) {
  var box = document.getElementById(id);
  if (!box) return;
  box.className = "msg " + kind;
  box.textContent = text;
}

// ---------------------------------------------------------------------------
// THE REPORT
//
// Plain text, laid out in columns so it stays readable when pasted into a
// message. Everything in it is either about this tablet, about this tool, or a
// count of something you did. No reading value ever appears, and tool names
// only appear if you tick the box.
// ---------------------------------------------------------------------------
function buildReport() {
  var lines = [];
  function head(title) { lines.push(""); lines.push(title); }
  function row(label, value) { lines.push("  " + padRight(label, 20) + value); }

  lines.push("PM Round Logger - diagnostics");
  lines.push("Generated " + nowStamp());

  head("TOOL");
  row("App version", APP_VERSION + " (built " + BUILD_DATE + ")");
  row("Data shape", String(DATA.version || "unknown"));
  row("Created with", String(DATA.createdWith || "unknown"));
  row("Last opened with", String(DATA.lastOpenedWith || "unknown"));
  var debug = loadDebug();
  if (debug.upgrades.length === 0) {
    row("Upgrades", "none recorded");
  } else {
    for (var u = 0; u < debug.upgrades.length; u++) {
      var up = debug.upgrades[u];
      row(u === 0 ? "Upgrades" : "", up.from + " -> " + up.to + " on " + up.when);
    }
  }
  if (VERSION_PROBLEM !== "") row("PROBLEM", VERSION_PROBLEM);

  head("BROWSER");
  row("User agent", String(navigator.userAgent));
  row("Protocol", String(location.protocol));
  row("Secure context", window.isSecureContext ? "yes" : "no");
  row("Window", window.innerWidth + " x " + window.innerHeight
    + ", dpr " + (window.devicePixelRatio || 1));
  row("Language", String(navigator.language || "unknown"));

  var caps = probeCapabilities();
  head("STORAGE");
  row("localStorage", caps.localStorage);
  row("Used by readings", kb(sizeOf(DATA)) + " of about " + kb(STORAGE_BUDGET)
    + " (" + storagePercent() + "%)");
  row("Used by diagnostics", kb(sizeOf(debug)));
  if (!STORAGE_OK) row("Last save", "FAILED - " + STORAGE_PROBLEM);
  row("IndexedDB", caps.indexedDB);
  row("Save As API", caps.saveAs);
  row("Folder picker", caps.folderPicker);

  var stats = dataStats();
  head("DATA");
  row("Tools", String(DATA.tools.length));
  row("Chambers", String(stats.chamberCount) + " across " + stats.typeCount
    + (stats.typeCount === 1 ? " type" : " types")
    + (stats.overrideCount > 0 ? ", " + stats.overrideCount + " custom limits" : ""));
  row("Readings defined", String(stats.pointCount));
  row("Days logged", String(stats.dayCount));
  row("Date range", stats.dayCount === 0 ? "nothing logged yet" : stats.first + " to " + stats.last);
  row("Readings stored", String(stats.readingCount));
  row("Out of range", String(stats.outOfRange));
  row("Blank readings", String(stats.blankCount));
  row("Last export", DATA.lastExport === "" ? "never" : DATA.lastExport);
  row("Names", DIAG_NAMES ? "included below" : "not included");

  if (DIAG_NAMES) {
    head("NAMES");
    for (var t = 0; t < DATA.tools.length; t++) {
      var tool = DATA.tools[t];
      lines.push("  " + tool.name);
      var nameUnits = toolUnits(tool);
      for (var n2 = 0; n2 < nameUnits.length; n2++) {
        var nu = nameUnits[n2];
        lines.push("    " + nu.name + (nu.typeName ? "  [" + nu.typeName + "]" : ""));
        for (var q = 0; q < nu.points.length; q++) {
          var point = nu.points[q];
          lines.push("        " + padRight(point.name, 26)
            + padRight(point.unit || "-", 12)
            + "min " + (point.min === null ? "-" : point.min)
            + "  max " + (point.max === null ? "-" : point.max)
            + (point.overridden ? "   (custom for this chamber)" : ""));
        }
      }
    }
  }

  head("USAGE (local only, never sent anywhere)");
  var names = Object.keys(debug.stats).sort();
  if (names.length === 0) {
    row("nothing recorded yet", "");
  } else {
    for (var n = 0; n < names.length; n++) row(names[n], String(debug.stats[names[n]]));
  }

  head("ERRORS (newest last, at most " + MAX_ERRORS + ")");
  if (debug.errors.length === 0) {
    lines.push("  none recorded");
  } else {
    for (var e = 0; e < debug.errors.length; e++) {
      var err = debug.errors[e];
      lines.push("  " + err.when + "  " + err.what);
      if (err.where) lines.push("      at " + err.where);
      if (err.stack) lines.push("      " + err.stack.split("\n").slice(0, 3).join(" | "));
    }
  }

  head("SELF-TEST");
  if (!DIAG_SELFTEST) {
    lines.push("  not run");
  } else {
    for (var c = 0; c < DIAG_SELFTEST.length; c++) {
      var res = DIAG_SELFTEST[c];
      lines.push("  " + (res.pass ? "pass  " : "FAIL  ") + res.name
        + (res.detail ? "  (" + res.detail + ")" : ""));
    }
  }

  lines.push("");
  return lines.join("\n");
}

function padRight(text, width) {
  text = String(text);
  while (text.length < width) text += " ";
  return text;
}

function sizeOf(obj) {
  try { return JSON.stringify(obj).length; } catch (e) { return 0; }
}

function kb(chars) {
  if (chars < 1024) return chars + " bytes";
  if (chars < 1024 * 1024) return (chars / 1024).toFixed(1) + " KB";
  return (chars / 1048576).toFixed(2) + " MB";
}

// Counts across the whole data set. No values, only tallies.
function dataStats() {
  var out = { pointCount: 0, dayCount: 0, readingCount: 0, outOfRange: 0,
              blankCount: 0, first: "", last: "", overrideCount: 0,
              chamberCount: 0, typeCount: DATA.chamberTypes.length };

  for (var t = 0; t < DATA.tools.length; t++) {
    var toolChambers = DATA.tools[t].chambers || [];
    out.chamberCount += toolChambers.length;
    for (var oc = 0; oc < toolChambers.length; oc++) {
      out.overrideCount += countOverrides(toolChambers[oc]);
    }
    var units = toolUnits(DATA.tools[t]);
    for (var u = 0; u < units.length; u++) out.pointCount += units[u].points.length;
  }

  var dates = Object.keys(DATA.entries).sort();
  out.dayCount = dates.length;
  if (dates.length > 0) { out.first = dates[0]; out.last = dates[dates.length - 1]; }

  for (var d = 0; d < dates.length; d++) {
    for (var i = 0; i < DATA.tools.length; i++) {
      var tool = DATA.tools[i];
      if (!DATA.entries[dates[d]][tool.id]) continue;
      var toolUnitList = toolUnits(tool);
      for (var q = 0; q < toolUnitList.length; q++) {
        var unit = toolUnitList[q];
        var stored = unitEntry(tool.id, unit.id, dates[d]);
        if (!stored) continue;
        for (var p = 0; p < unit.points.length; p++) {
          var point = unit.points[p];
          var value = stored.values[point.id];
          if (value === undefined || String(value).trim() === "") { out.blankCount++; continue; }
          out.readingCount++;
          var status = rangeStatus(value, point);
          if (status === "LOW" || status === "HIGH") out.outOfRange++;
        }
      }
    }
  }
  return out;
}

// What this browser can do. Presence checks only - this deliberately never
// OPENS a picker, because a dialog you did not ask for is worse than the
// question it answers. To find out whether a chosen folder is REMEMBERED
// between days, use the separate capability test page, which needs the real
// dialogs to answer it.
function probeCapabilities() {
  var out = {};
  out.saveAs = (typeof window.showSaveFilePicker === "function") ? "available" : "not available";
  out.folderPicker = (typeof window.showDirectoryPicker === "function") ? "available" : "not available";
  out.indexedDB = window.indexedDB ? "available" : "not available";
  try {
    window.localStorage.setItem("partybarte.pmlogger.probe", "1");
    window.localStorage.removeItem("partybarte.pmlogger.probe");
    out.localStorage = "working";
  } catch (e) {
    out.localStorage = "BLOCKED (" + e.name + ")";
  }
  return out;
}

// ---------------------------------------------------------------------------
// SELF-TEST
//
// Checks the fiddly parts still behave on THIS tablet: the CSV round trip,
// limit checking at its boundaries, and the date arithmetic.
//
// SAFETY. This must never touch your readings. Two rules make that true, and
// both matter:
//
//   1. It swaps in a made-up data set, runs, and puts the real one back in a
//      "finally" block, so even a crash mid-test restores it.
//   2. It only calls functions that READ. Nothing here calls save(), so
//      nothing can reach browser storage at all.
//
// It then compares stored data before and after, and reports that comparison
// as a check of its own. A self-test that could damage a round would be worse
// than having no self-test.
// ---------------------------------------------------------------------------
function runSelfTest() {
  var results = [];
  function check(name, pass, detail) { results.push({ name: name, pass: !!pass, detail: detail || "" }); }

  var storedBefore = null;
  try { storedBefore = window.localStorage.getItem(STORAGE_KEY); } catch (e) { /* ignore */ }

  var realData = DATA;
  try {
    // Deliberately awkward names: a comma and a quote in a tool name are
    // exactly what breaks a careless CSV writer.
    DATA = {
      version: DATA_SHAPE, createdWith: "self-test", lastOpenedWith: "self-test",
      nextId: 0, lastExport: "",
      chamberTypes: [{ id: "ct1", name: "Etch type", points: [
        { id: "c1", name: "RF hours", unit: "h", min: null, max: 500 },
        { id: "c2", name: "Kit life", unit: "%", min: null, max: 80 }
      ] }],
      tools: [{ id: "t1", name: 'Etch, "A"',
        points: [
          { id: "p1", name: "Pressure, mTorr", unit: "mTorr", min: 8, max: 12 },
          { id: "p2", name: "Hours", unit: "h", min: null, max: null }
        ],
        chambers: [
          { id: "ch1", name: "PM1", typeId: "ct1" },
          // PM2 runs the same process to a tighter kit-life spec.
          { id: "ch2", name: "PM2", typeId: "ct1", limits: { c2: { min: null, max: 40 } } }
        ] }],
      entries: { "2026-01-31": { t1: {
        savedAt: "2026-01-31 09:00",
        values: { p1: "9.4", p2: "1875.5" },
        chambers: {
          ch1: { savedAt: "2026-01-31 09:05", values: { c1: "120", c2: "44" } },
          ch2: { savedAt: "2026-01-31 09:08", values: { c1: "610", c2: "60" } }
        }
      } } }
    };

    var csv = buildCsv(null);
    check("CSV starts with the marker Excel needs", csv.charAt(0) === "\uFEFF");

    var parsed = parseReadingsCsv(csv);
    // Two tool readings plus two readings on each of two chambers.
    check("every reading survives the round trip", parsed.rows.length === 6,
      parsed.rows.length + " of 6 rows");

    var byName = {};
    for (var r = 0; r < parsed.rows.length; r++) {
      byName["n:" + parsed.rows[r].chamber + "|" + parsed.rows[r].point] = parsed.rows[r];
    }
    var back = byName["n:|Pressure, mTorr"];
    check("a comma in a name survives", !!back);
    check("a quote in a name survives", back && back.tool === 'Etch, "A"', back ? back.tool : "missing");
    check("the value is unchanged", back && back.value === "9.4", back ? back.value : "missing");
    check("limits come back out of the file", back && back.min === 8 && back.max === 12,
      back ? back.min + "/" + back.max : "missing");

    var limited = { min: 8, max: 12 };
    var unlimited = { min: null, max: null };
    check("blank reading has no status", rangeStatus("", limited) === "");
    check("a value on the min counts as in range", rangeStatus("8", limited) === "OK");
    check("a value on the max counts as in range", rangeStatus("12", limited) === "OK");
    check("just under the min reads LOW", rangeStatus("7.9", limited) === "LOW");
    check("just over the max reads HIGH", rangeStatus("12.1", limited) === "HIGH");
    check("no limits set means no status", rangeStatus("5", unlimited) === "");

    check("date steps over a month end", shiftDate("2026-01-31", 1) === "2026-02-01",
      shiftDate("2026-01-31", 1));
    check("date steps back over a month end", shiftDate("2026-03-01", -1) === "2026-02-28",
      shiftDate("2026-03-01", -1));
    check("days between two dates", daysBetween("2026-08-20", "2026-08-24") === 4);

    check("duplicate check copes with awkward names",
      countDistinct(["constructor", "constructor", "toString"]) === 2,
      String(countDistinct(["constructor", "constructor", "toString"])));

    // Chambers: the two PMs share a type, so they log the same readings, but
    // their values and their pass/fail must stay independent.
    var pm1 = byName["n:PM1|RF hours"];
    var pm2 = byName["n:PM2|RF hours"];
    check("chamber readings carry their chamber name", !!pm1 && !!pm2);
    check("chambers of one type keep separate values",
      pm1 && pm2 && pm1.value === "120" && pm2.value === "610",
      pm1 && pm2 ? pm1.value + " / " + pm2.value : "missing");
    check("the chamber type travels with the reading",
      pm1 && pm1.chamberType === "Etch type", pm1 ? pm1.chamberType : "missing");
    check("one chamber can fail while its twin passes",
      pm1 && pm2 && pm1.value !== undefined
        && rangeStatus(pm1.value, { min: null, max: 500 }) === "OK"
        && rangeStatus(pm2.value, { min: null, max: 500 }) === "HIGH");
    check("tool readings leave the chamber column empty",
      back && back.chamber === "", back ? '"' + back.chamber + '"' : "missing");
    check("a tool knows how many things it has to log",
      toolUnits(DATA.tools[0]).length === 3,
      String(toolUnits(DATA.tools[0]).length) + " of 3");

    // Overrides: PM2 is held to a tighter kit-life limit than its type, so the
    // same number passes on PM1 and fails on PM2.
    var pm1Kit = byName["n:PM1|Kit life"];
    var pm2Kit = byName["n:PM2|Kit life"];
    check("the type limit applies where nothing was overridden",
      pm1Kit && pm1Kit.max === 80, pm1Kit ? String(pm1Kit.max) : "missing");
    check("a chamber's own limit is exported instead of the type's",
      pm2Kit && pm2Kit.max === 40, pm2Kit ? String(pm2Kit.max) : "missing");
    check("44 passes on the type limit but fails the tighter one",
      rangeStatus("44", { min: null, max: 80 }) === "OK"
        && rangeStatus("44", { min: null, max: 40 }) === "HIGH");
    check("60 would pass the type limit of 80",
      rangeStatus("60", { min: null, max: 80 }) === "OK");
    check("but the exported row marks it HIGH against this chamber's 40",
      pm2Kit && pm2Kit.value === "60" && rangeStatus(pm2Kit.value, pm2Kit) === "HIGH",
      pm2Kit ? pm2Kit.value + " vs max " + pm2Kit.max : "missing");
    check("overriding one chamber leaves its twin alone",
      countOverrides(DATA.tools[0].chambers[0]) === 0
        && countOverrides(DATA.tools[0].chambers[1]) === 1);
  } catch (e) {
    check("the self-test ran without crashing", false, e.name + ": " + e.message);
  } finally {
    // Whatever happened above, your real data goes back.
    DATA = realData;
  }

  var storedAfter = null;
  try { storedAfter = window.localStorage.getItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  check("YOUR SAVED DATA WAS NOT TOUCHED", storedBefore === storedAfter);

  bump("selfTestRuns");
  DIAG_SELFTEST = results;
  renderDiagnostics();

  var failed = 0;
  for (var i = 0; i < results.length; i++) if (!results[i].pass) failed++;
  setMsg("diagMsg", failed === 0 ? "ok" : "err",
    failed === 0 ? "All " + results.length + " checks passed."
                 : failed + " of " + results.length + " checks FAILED. Send me this report.");
}

// ---------------------------------------------------------------------------
// GETTING THE REPORT TO SOMEONE
// ---------------------------------------------------------------------------

// Downloading is the reliable route, so it is the one to trust. Copying is
// best effort, because clipboard permissions on a page opened from a file are
// inconsistent between browsers. If it fails, the text box is already
// selected and can be copied by hand.
function copyDiagnostics() {
  var box = document.getElementById("diagText");
  box.select();
  var done = function () { setMsg("diagMsg", "ok", "Copied. Paste it into your message."); };
  var failed = function () {
    setMsg("diagMsg", "info", "This browser would not let the page copy for you. "
      + "The text is selected - press Ctrl+C, or use Download as a file.");
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(done, failed);
      return;
    }
    if (document.execCommand && document.execCommand("copy")) { done(); return; }
    failed();
  } catch (e) {
    failed();
  }
}

function downloadDiagnostics() {
  var name = "pm_diagnostics_" + todayStr() + ".txt";
  downloadFile(buildReport(), name, "text/plain");
  setMsg("diagMsg", "ok", "Saved " + name + " to this tablet's download folder.");
}

function clearErrorLog() {
  if (!window.confirm("Clear the recorded errors?\n\nYour readings are not affected.")) return;
  var debug = loadDebug();
  debug.errors = [];
  saveDebug(debug);
  DIAG_SELFTEST = null;
  renderDiagnostics();
  setMsg("diagMsg", "ok", "Error log cleared. Readings untouched.");
}

// ---------------------------------------------------------------------------
// START UP
// ---------------------------------------------------------------------------
load();
render();

</script>
</body>
