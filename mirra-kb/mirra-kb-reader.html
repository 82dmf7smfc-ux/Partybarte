<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirra Knowledge Base Reader</title>
<style>
:root{
  --paper:#e9ecec; --panel:#fff; --panel-2:#f4f6f6;
  --ink:#131a19; --ink-2:#4d5a57; --ink-3:#7c8785;
  --rule:#ccd4d2; --rule-2:#dde3e1;
  --steel:#2c5f6b; --steel-lt:#e0eaec;
  --ok:#1f6f5c; --mid:#8a6516; --low:#8c2f27;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--steel)}
#app{display:flex;flex-direction:column;height:100vh}

header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--rule)}
header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-0.01em}
header h1 span{color:var(--ink-3);font-weight:400}
#mode{font:11px var(--mono);border:1px solid var(--rule);border-radius:2px;padding:1px 6px;color:var(--ink-2);background:var(--panel-2)}
#counts{font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
nav{margin-left:auto;display:flex;gap:2px;align-items:center}
nav button{background:none;border:1px solid transparent;border-radius:3px;padding:5px 11px;font-size:13.5px;color:var(--ink-2)}
nav button:hover{background:var(--panel-2)}
nav button[aria-current="true"]{background:var(--steel-lt);border-color:#bcd2d6;color:var(--steel);font-weight:600}
#save{margin-left:10px;border:1px solid var(--rule);border-radius:3px;padding:5px 11px;font-size:13px;background:var(--panel-2)}
#save.dirty{background:#f6e6c8;border-color:#d9bb79;color:#6b5316;font-weight:600}

main{flex:1;min-height:0;display:flex}
#side{width:310px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--rule)}
#searchwrap{padding:12px 14px 8px;border-bottom:1px solid var(--rule-2)}
#search{width:100%;padding:7px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--panel-2);font:14px var(--sans)}
#search:focus{outline:2px solid var(--steel);outline-offset:-1px;background:#fff}
#filters{padding:8px 14px 10px;border-bottom:1px solid var(--rule-2)}
.frow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.frow:last-child{margin-bottom:0}
.chip{border:1px solid var(--rule);background:var(--panel-2);border-radius:2px;padding:2px 7px;font-size:11.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#listmeta{padding:6px 14px;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);border-bottom:1px solid var(--rule-2)}
#list{flex:1;overflow-y:auto}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-2);padding:9px 14px 9px 11px;border-left:3px solid transparent}
.item:hover{background:var(--panel-2)}
.item[aria-current="true"]{background:var(--steel-lt);border-left-color:var(--steel)}
.item b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.item small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.4}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}
.c-established{background:var(--ok)}.c-probable{background:var(--mid)}.c-uncertain{background:var(--low)}

#content{flex:1;min-width:0;overflow-y:auto;padding:26px 34px 80px}
.wrap{max-width:820px}
.empty{max-width:620px;margin:5vh auto 0}
.empty h2{font:400 27px/1.25 var(--serif);margin:0 0 10px}
.empty p{color:var(--ink-2);max-width:62ch;margin:0 0 18px}
.load{background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-bottom:12px}
.load h3{margin:0;padding:11px 16px;font-size:13.5px;border-bottom:1px solid var(--rule-2)}
.load > div{padding:14px 16px;font-size:13.5px;color:var(--ink-2)}
code{font:12.5px var(--mono);background:var(--panel-2);border:1px solid var(--rule-2);border-radius:2px;padding:1px 5px}
.btn{border:1px solid var(--steel);background:var(--steel);color:#fff;border-radius:3px;padding:7px 14px;font-size:13.5px;font-weight:500}
.btn:hover{background:#23505b}
.btn.ghost{background:none;color:var(--steel)}
.btn.ghost:hover{background:var(--steel-lt)}
#banner{padding:9px 20px;font-size:13px;background:#fbf3e0;border-bottom:1px solid #e6d6ae;color:#6b5316}
#banner.bad{background:#f9ebe9;border-color:#d9b0aa;color:var(--low)}
#banner button{background:none;border:0;text-decoration:underline;padding:0;margin-left:8px}
#drop{position:fixed;inset:0;background:rgba(19,26,25,.82);color:#fff;display:none;align-items:center;justify-content:center;font:400 22px var(--serif);z-index:50;text-align:center;padding:20px}
#drop.on{display:flex}

.head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
.head h2{margin:0 0 6px;font:600 27px/1.15 var(--sans);letter-spacing:-0.02em}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.alias{font-size:13px;color:var(--ink-3);margin:4px 0 8px;font-style:italic}
section.blk{margin-bottom:26px}
section.blk > h3{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule-2)}

.prose{font:16px/1.62 var(--serif);color:#1b2321;max-width:68ch}
.prose p{margin:0 0 .85em}
.prose h4{font:600 15px/1.4 var(--sans);margin:1.4em 0 .5em;color:var(--ink)}
.prose h5{font:600 13.5px/1.4 var(--sans);margin:1.2em 0 .4em;color:var(--ink-2)}
.prose ul,.prose ol{margin:0 0 .85em;padding-left:1.4em}
.prose li{margin-bottom:.3em}
.prose li > ul,.prose li > ol{margin:.3em 0 0}
.prose code{font:13.5px var(--mono);background:var(--panel-2);padding:1px 4px;border-radius:2px}
.prose pre{background:var(--panel);border:1px solid var(--rule-2);border-left:3px solid var(--rule);padding:11px 14px;margin:.9em 0;overflow-x:auto;font:13px/1.5 var(--mono)}
.prose pre code{background:none;padding:0;font-size:inherit}
.prose blockquote{margin:.9em 0;padding:2px 0 2px 14px;border-left:3px solid var(--rule);color:var(--ink-2)}
.prose blockquote p:last-child{margin:0}
.prose hr{border:0;border-top:1px solid var(--rule);margin:1.4em 0}
.prose table{border-collapse:collapse;margin:.9em 0;font:14px var(--sans);width:auto}
.prose th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--rule);padding:4px 16px 5px 0}
.prose td{padding:5px 16px 5px 0;border-bottom:1px solid var(--rule-2);vertical-align:top}
.prose .eq{display:block;background:var(--panel);border-left:3px solid var(--steel);padding:11px 14px;margin:.9em 0;font:15px/1.7 var(--mono);white-space:pre-wrap;overflow-x:auto}
.prose dl.vars{margin:.6em 0 1.1em;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font:14px/1.5 var(--sans);align-items:baseline}
.prose dl.vars dt{font:14px var(--mono);color:var(--steel);white-space:nowrap}
.prose dl.vars dd{margin:0;color:var(--ink-2)}

.rels{display:flex;flex-direction:column;gap:9px}
.rel{display:flex;gap:11px;align-items:baseline;font-size:14px}
.rel span{flex:none;width:132px;text-align:right;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.rel button{background:none;border:0;border-bottom:1px solid var(--rule);padding:0 0 1px;color:var(--steel);text-align:left}
.rel button:hover{border-bottom-color:var(--steel)}
.rel em{color:var(--ink-3);font-size:12.5px;font-style:normal}
.src{border-top:1px solid var(--rule-2);padding:9px 0;font-size:13.5px}
.src:first-of-type{border-top:0}
.src small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.tier{display:inline-block;font:11px var(--mono);border-radius:2px;padding:1px 5px;margin-right:7px;border:1px solid}
.t0{color:#463a86;border-color:#b7aedb;background:#f1effa;font-weight:600}
.t1,.t2{color:var(--ok);border-color:#a8ccc2;background:#eaf4f1}
.t3{color:var(--mid);border-color:#dcc78e;background:#faf3e3}
.t4,.t5{color:var(--low);border-color:#d9b0aa;background:#f9ebe9}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--rule);border-radius:2px;padding:1px 6px;background:var(--panel-2);color:var(--ink-2)}
.tag.spec-mirra{background:#e6f0f2;border-color:#a9c7cd;color:var(--steel);font-weight:600}
.tag.spec-cmp{background:var(--panel-2)}
.tag.spec-general{background:#fff;border-style:dashed;color:var(--ink-3)}
.warn{color:var(--low)}
.cit{font:11px var(--mono);background:var(--steel-lt);border:1px solid #bcd2d6;color:var(--steel);
  border-radius:2px;padding:0 4px;margin:0 1px;vertical-align:1px;white-space:nowrap;cursor:default}
.cit.missing{background:#f9ebe9;border-color:#d9b0aa;color:var(--low)}
.badge{font:10.5px var(--sans);font-weight:600;border-radius:2px;padding:1px 5px;margin-left:8px;
  border:1px solid;text-transform:none;letter-spacing:0}
.badge.b-established{color:var(--ok);border-color:#a8ccc2;background:#eaf4f1}
.badge.b-probable{color:var(--mid);border-color:#dcc78e;background:#faf3e3}
.badge.b-uncertain{color:var(--low);border-color:#d9b0aa;background:#f9ebe9}
.contested{background:#faf3e3;border:1px solid #dcc78e;border-left:3px solid var(--mid);
  padding:10px 14px;margin:0 0 20px;font-size:13.5px;color:#6b5316;border-radius:2px}
.contested b{display:block;font-size:11.5px;margin-bottom:3px}
#map{width:100%;height:290px;display:block}
#map text{font:11.5px var(--sans);fill:var(--ink-2)}
#map text.self{font-weight:600;fill:var(--ink);font-size:13px}
#map line{stroke:var(--rule);stroke-width:1.5}
#map .hit{cursor:pointer}
#map .hit:hover text{fill:var(--steel)}

table.grid{border-collapse:collapse;width:100%;font-size:13.5px}
.grid th{text-align:left;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:0 12px 6px 0;border-bottom:1px solid var(--rule)}
.grid td{padding:7px 12px 7px 0;border-bottom:1px solid var(--rule-2);vertical-align:top}
.grid td button{background:none;border:0;padding:0;color:var(--steel);text-align:left}
.grid td button:hover{text-decoration:underline}
.bar{height:7px;background:var(--rule-2);border-radius:1px;overflow:hidden;min-width:110px}
.bar i{display:block;height:100%;background:var(--steel)}
h2.view{font:600 21px var(--sans);margin:0 0 4px;letter-spacing:-0.01em}
p.lede{color:var(--ink-2);margin:0 0 22px;max-width:64ch;font-size:14px}
.stat{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:26px}
.stat div b{display:block;font:600 25px var(--mono);line-height:1.1}
.stat div span{font-size:12px;color:var(--ink-3)}

#sql{width:100%;min-height:132px;font:13.5px/1.55 var(--mono);padding:12px 14px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);resize:vertical}
#sql:focus{outline:2px solid var(--steel);outline-offset:-1px}
.qbar{display:flex;gap:8px;align-items:center;margin:10px 0 20px;flex-wrap:wrap}
.qbar small{color:var(--ink-3);font-size:12.5px;margin-left:auto;font-family:var(--mono)}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.presets button{border:1px solid var(--rule);background:var(--panel);border-radius:2px;padding:3px 9px;font-size:12.5px;color:var(--ink-2)}
.presets button:hover{border-color:var(--steel);color:var(--steel)}
.res{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:3px}
.res table{font:13px var(--mono);width:auto;min-width:100%;border-collapse:collapse}
.res th{padding:8px 14px;background:var(--panel-2);white-space:nowrap;text-align:left;font-size:11.5px;color:var(--ink-3)}
.res td{padding:6px 14px;white-space:nowrap;max-width:520px;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--rule-2)}
.err{background:#f9ebe9;border:1px solid #d9b0aa;color:var(--low);padding:12px 14px;border-radius:3px;font:13px var(--mono);white-space:pre-wrap}

:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media (max-width:820px){
  main{flex-direction:column}
  #side{width:auto;max-height:44vh;border-right:0;border-bottom:1px solid var(--rule)}
  #content{padding:20px 18px 60px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Mirra Knowledge Base <span>/ reader v3.3.1</span></h1>
    <span id="mode" hidden></span>
    <div id="counts"></div>
    <nav>
      <button data-view="browse" aria-current="true">Browse</button>
      <button data-view="query" hidden>Query</button>
      <button data-view="health">Health</button>
      <button data-view="sources">Sources</button>
      <button data-view="gaps">Gaps</button>
      <button id="save" hidden>Save a copy</button>
    </nav>
  </header>
  <div id="banner" hidden></div>
  <main>
    <aside id="side">
      <div id="searchwrap"><input id="search" type="search" placeholder="Search terms, press /" autocomplete="off"></div>
      <div id="filters"></div>
      <div id="listmeta"></div>
      <div id="list"></div>
    </aside>
    <div id="content"><div class="wrap" id="cw"></div></div>
  </main>
</div>
<div id="drop">Drop a .db file, or a folder of CSVs</div>

<script>
"use strict";

/* =====================================================================
   1. Markdown. Deliberately tolerant. Nothing is ever dropped.
   ===================================================================== */
function esc(s){return String(s??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}

function inline(s){
  let t = esc(s);
  const code=[];
  t = t.replace(/`([^`]+)`/g,(m,c)=>{code.push(c);return "\u0000"+(code.length-1)+"\u0000";});
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  // inline claim-level citations: [stg-1997], [pat-us5738574 spec] or [pat-us5738574 claims; zan-2004]
  t = t.replace(/\[([a-z0-9]+(?:[-.][a-z0-9]+)+(?:\s+[a-z]+)?(?:\s*[;,]\s*[a-z0-9]+(?:[-.][a-z0-9]+)+(?:\s+[a-z]+)?)*)\]/gi,
    (m,ids)=>ids.split(/\s*[;,]\s*/).map(tok=>{
      const id = tok.split(/\s+/)[0];
      const qual = tok.slice(id.length).trim();
      const miss = DB.srcById && Object.keys(DB.srcById).length && !DB.srcById[id];
      return '<span class="cit'+(miss?" missing":"")+'" title="'+
        (miss?"not in the source table":(DB.srcById[id]?DB.srcById[id].title:id))+'">'+id+(qual?" "+qual:"")+"</span>";
    }).join(""));
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/__([^_]+)__/g,"<strong>$1</strong>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  t = t.replace(/\u0000(\d+)\u0000/g,(m,i)=>"<code>"+code[+i]+"</code>");
  return t;
}

function assignment(line){
  const m = line.match(/^\s*([^\s=]{1,24})\s*=\s*(.+?)\s*$/);
  if(!m) return null;
  const lhs = m[1];
  if(!/^[A-Za-z\u0370-\u03FF\u2202\u0394\u03A3]/.test(lhs)) return null;
  if(!/^[A-Za-z0-9_,.()\u0370-\u03FF\u2080-\u209F\u2202\u0394\u03A3]+$/.test(lhs)) return null;
  return {lhs, rhs:m[2]};
}
function looksLikeProse(rhs){
  return (rhs.match(/[A-Za-z]{4,}/g)||[]).length >= 2;
}

const BLOCK_START = l =>
  /^\s*(#{1,6}\s|[-*+]\s|\d+[.)]\s|>\s?|```|~~~|\$\$|(-{3,}|\*{3,}|_{3,})\s*$)/.test(l);

function renderMD(md){
  const lines = String(md??"").replace(/\r\n?/g,"\n").split("\n");
  const out=[]; let i=0;

  const listBlock=(ordered)=>{
    const items=[]; const tag=ordered?"ol":"ul";
    const re = ordered ? /^(\s*)\d+[.)]\s+(.*)$/ : /^(\s*)[-*+]\s+(.*)$/;
    while(i<lines.length){
      const m=lines[i].match(re);
      if(!m){
        if(items.length && lines[i].trim() && !BLOCK_START(lines[i])){
          items[items.length-1]+=" "+lines[i].trim(); i++; continue;
        }
        break;
      }
      items.push(m[2]); i++;
    }
    out.push("<"+tag+">"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</"+tag+">");
  };

  const tableBlock=()=>{
    const rows=[];
    while(i<lines.length && lines[i].includes("|") && lines[i].trim()){ rows.push(lines[i]); i++; }
    const cells = r => r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
    const head = cells(rows[0]);
    const body = rows.slice(2).map(cells);
    out.push("<table><thead><tr>"+head.map(h=>"<th>"+inline(h)+"</th>").join("")+"</tr></thead><tbody>"
      + body.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")
      + "</tbody></table>");
  };

  while(i<lines.length){
    const line = lines[i];
    if(!line.trim()){ i++; continue; }

    let f = line.match(/^\s*(```|~~~)\s*(\w*)/);
    if(f){
      const fence=f[1], lang=(f[2]||"").toLowerCase(); i++;
      const buf=[];
      while(i<lines.length && !lines[i].trim().startsWith(fence)){ buf.push(lines[i]); i++; }
      i++;
      out.push(/^(eq|math|equation|latex)$/.test(lang)
        ? '<span class="eq">'+esc(buf.join("\n"))+"</span>"
        : "<pre><code>"+esc(buf.join("\n"))+"</code></pre>");
      continue;
    }
    if(/^\s*\$\$/.test(line)){
      i++; const buf=[];
      while(i<lines.length && !/\$\$/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push('<span class="eq">'+esc(buf.join("\n"))+"</span>"); continue;
    }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push("<hr>"); i++; continue; }
    let h = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if(h){ const lv=h[1].length<=2?4:5;
      out.push("<h"+lv+">"+inline(h[2].replace(/#+\s*$/,""))+"</h"+lv+">"); i++; continue; }
    if(/^\s*>\s?/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      out.push("<blockquote>"+renderMD(buf.join("\n"))+"</blockquote>"); continue;
    }
    if(line.includes("|") && lines[i+1] && /^[\s|:\-]+$/.test(lines[i+1]) && lines[i+1].includes("-")){
      tableBlock(); continue;
    }
    if(/^\s*\d+[.)]\s/.test(line)){ listBlock(true); continue; }
    if(/^\s*[-*+]\s/.test(line)){ listBlock(false); continue; }

    const a = assignment(line);
    if(a){
      if(!looksLikeProse(a.rhs)){
        const buf=[];
        while(i<lines.length){
          const b=assignment(lines[i]);
          if(b && !looksLikeProse(b.rhs)){ buf.push(lines[i].trim()); i++; }
          else break;
        }
        out.push('<span class="eq">'+esc(buf.join("\n"))+"</span>"); continue;
      }
      const defs=[];
      while(i<lines.length){
        const b=assignment(lines[i]);
        if(b && looksLikeProse(b.rhs)){ defs.push(b); i++; }
        else break;
      }
      out.push('<dl class="vars">'+defs.map(d=>
        "<dt>"+esc(d.lhs)+"</dt><dd>"+inline(d.rhs)+"</dd>").join("")+"</dl>");
      continue;
    }

    const buf=[];
    while(i<lines.length && lines[i].trim() && !BLOCK_START(lines[i]) && !assignment(lines[i])){
      buf.push(lines[i].trim()); i++;
    }
    if(buf.length) out.push("<p>"+inline(buf.join(" "))+"</p>");
    else { out.push("<p>"+inline(lines[i])+"</p>"); i++; }
  }
  return out.join("");
}

/* =====================================================================
   2. Section mapping. Unknown headings are kept, never dropped.
   ===================================================================== */
const SLOTS = [
  ["definition",       ["definition","what it is","summary","overview","meaning"]],
  ["mirra_application",["mirra application","on the mirra","application","tool application",
                        "mirra specifics","in practice","on the tool"]],
  ["physics",          ["physics","physics and math","theory","governing physics","math",
                        "mechanism","how it works"]],
  ["typical_values",   ["typical values","values","numbers","ranges","specifications","specs"]],
  ["open_questions",   ["open questions","questions","unknowns","gaps","to verify"]],
  ["contested",        ["contested","disagreement","sources disagree","dispute","conflicting"]],
];
const SKIP = ["relations","connections","links","sources","references","citations"];

function normHead(h){ return h.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function slotFor(h){
  const n = normHead(h);
  for(const [slot,names] of SLOTS){
    if(names.includes(n)) return slot;
    if(names.some(x=>n.startsWith(x)||x.startsWith(n))) return slot;
  }
  if(SKIP.some(s=>n.startsWith(s))) return "_skip";
  return null;
}
function parseNodeFile(md){
  let text = String(md||"").replace(/\r\n?/g,"\n");
  text = text.replace(/^---\n[\s\S]*?\n---\n?/,"");
  const slots={extra:[]};
  let cur=null, buf=[], curHead=null;
  const flush=()=>{
    const body=buf.join("\n").trim(); buf=[];
    if(!body) return;
    if(cur===null){ if(!slots.definition) slots.definition=body; else slots.extra.push([null,body]); }
    else if(cur==="_skip"){ /* relations and sources come from the tables */ }
    else if(cur==="_extra") slots.extra.push([curHead,body]);
    else slots[cur]=(slots[cur]?slots[cur]+"\n\n":"")+body;
  };
  for(const line of text.split("\n")){
    const m=line.match(/^\s*#{1,6}\s+(.*)$/);
    if(m){ flush(); const s=slotFor(m[1]); curHead=m[1].trim(); cur = s===null?"_extra":s; }
    else buf.push(line);
  }
  flush();
  return slots;
}

/* =====================================================================
   4. CSV parsing, tolerant of quotes, newlines and separators
   ===================================================================== */
function sniffDelim(text){
  const line=text.split("\n").find(l=>l.trim())||"";
  const t=(line.match(/\t/g)||[]).length, s=(line.match(/;/g)||[]).length,
        c=(line.match(/,/g)||[]).length;
  return t>c?"\t":(s>c?";":",");
}
function parseCSV(text){
  if(!text||!text.trim()) return [];
  text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  const D=sniffDelim(text);
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"'){q=true;}
    else if(c===D){row.push(cell);cell="";}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=c;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(v=>v.trim()!==""))
    .map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]??"").trim());return o;});
}

const pick=(o,...names)=>{ for(const n of names) if(o[n]!==undefined&&o[n]!=="") return o[n]; return ""; };
function normNode(r){
  return {
    id: pick(r,"id","node_id","slug"),
    term: pick(r,"term","name","title")||pick(r,"id"),
    aliases: pick(r,"aliases","alias","also"),
    type: pick(r,"type","node_type")||"concept",
    domain: pick(r,"domain","area","category")||"process",
    gloss: pick(r,"gloss","summary","one_liner","short"),
    value_status: pick(r,"value_status","values","status")||"unknown",
    confidence: pick(r,"confidence","certainty")||"uncertain",
    confidence_mirra: pick(r,"confidence_mirra","mirra_confidence")||"",
    specificity: pick(r,"specificity","scope")||"cmp",
    applies_to: pick(r,"applies_to","subsystem_scope","platform")||"polisher",
    head_gen: pick(r,"head_gen","head_generation","head"),
    applications: pick(r,"applications","application","apps"),
    verify: pick(r,"verify","verify_by","next_step"),
    contested: pick(r,"contested","dispute"),
    wafer_note: pick(r,"wafer_note","wafer_size_note","wafer"),
    definition: pick(r,"definition"),
    mirra_application: pick(r,"mirra_application"),
    physics: pick(r,"physics"),
    typical_values: pick(r,"typical_values"),
    open_questions: pick(r,"open_questions"),
    extra: []
  };
}
function normSource(r){
  let title = pick(r,"title","title_slug","name");
  if(title && !/\s/.test(title) && title.includes("-")) title=title.replace(/-/g," ");
  return {id:pick(r,"id","source_id"), title:title||pick(r,"id"),
    author_or_assignee:pick(r,"author_or_assignee","author","assignee"),
    year:pick(r,"year"), source_type:pick(r,"source_type","type"),
    url:pick(r,"url","link"), access:pick(r,"access")||"open",
    observed_on:pick(r,"observed_on","observed","when"),
    tier:String(pick(r,"tier")??"5")};
}
function splitAliases(s){ return String(s||"").split(/[;|,]/).map(x=>x.trim()).filter(Boolean); }

function indexAll(){
  DB.byId={};DB.nodes.forEach(n=>DB.byId[n.id]=n);
  DB.srcById={};DB.sources.forEach(s=>DB.srcById[s.id]=s);
  DB.loaded=DB.nodes.length>0;
}

/* =====================================================================
   5. Loaders
   ===================================================================== */
async function loadCSVSet(get){
  const nodesText = await get("nodes.csv");
  if(nodesText===null) return false;
  DB.nodes = parseCSV(nodesText).map(normNode).filter(n=>n.id);
  if(!DB.nodes.length) return false;
  DB.edges = parseCSV(await get("edges.csv")||"").map(r=>({
    from_id:pick(r,"from_id","from","source_node"),
    to_id:pick(r,"to_id","to","target_node"),
    relation:pick(r,"relation","rel","type"),
    note:pick(r,"note","notes"), source_id:pick(r,"source_id")}))
    .filter(e=>e.from_id&&e.to_id);
  DB.sources = parseCSV(await get("sources.csv")||"").map(normSource).filter(s=>s.id);
  DB.citations = parseCSV(await get("citations.csv")||"").map(r=>({
    node_id:pick(r,"node_id","node","id"), source_id:pick(r,"source_id","source"),
    field:pick(r,"field")||"general"})).filter(c=>c.node_id&&c.source_id);
  // parallel, in chunks, so 500 nodes does not serialize into 500 round trips
  for(let i=0;i<DB.nodes.length;i+=25){
    await Promise.all(DB.nodes.slice(i,i+25).map(async n=>{
      const md = await get("nodes/"+n.id+".md");
      if(md===null) return;
      const s=parseNodeFile(md);
      for(const k of ["definition","mirra_application","physics","typical_values",
                      "open_questions","contested"])
        if(s[k]) n[k]=s[k];
      n.extra=s.extra||[];
    }));
  }
  MODE="csv"; indexAll(); return true;
}

async function initSql(){
  if(SQL) return;
  const CDNS=["https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/",
              "https://cdn.jsdelivr.net/npm/sql.js@1/dist/",
              "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/","./"];
  for(const base of CDNS){
    try{
      await new Promise((res,rej)=>{const s=document.createElement("script");
        s.src=base+"sql-wasm.js";s.onload=res;s.onerror=()=>rej();document.head.append(s);});
      SQL=await initSqlJs({locateFile:f=>base+f});
      return;
    }catch(e){}
  }
  throw new Error("sql.js unavailable");
}
function sq(sql,params){
  const st=sqldb.prepare(sql); if(params) st.bind(params);
  const rows=[]; while(st.step()) rows.push(st.getAsObject());
  st.free(); return rows;
}
function reloadSqlite(){
  DB.nodes=sq("SELECT * FROM node").map(r=>{const n=normNode(r);
    n.definition=r.definition||"";n.mirra_application=r.mirra_application||"";
    n.physics=r.physics||"";n.typical_values=r.typical_values||"";
    n.open_questions=r.open_questions||"";n.extra=[];
    if(r.notes) n.extra.push(["Notes",r.notes]);
    return n;});
  DB.nodes.sort((a,b)=>a.term.localeCompare(b.term));
  DB.edges=sq("SELECT * FROM edge");
  DB.sources=sq("SELECT * FROM source").map(normSource);
  DB.citations=sq("SELECT * FROM citation");
  indexAll();
}
async function openSqliteBuffer(buf,name){
  await initSql();
  sqldb=new SQL.Database(new Uint8Array(buf));
  sqldb.run("PRAGMA foreign_keys = ON;");
  sq("SELECT count(*) FROM node");
  MODE="sqlite"; FILENAME=name||"mirra_kb.db"; DIRTY=false;
  reloadSqlite();
}

  s.hidden=false;s.classList.add("dirty");s.textContent="Save changes"; }
function download(){
  const blob=new Blob([sqldb.export()],{type:"application/octet-stream"});
  const a=el("a",{href:URL.createObjectURL(blob),download:FILENAME});
  document.body.append(a);a.click();a.remove();

async function ingest(fileList){
  const files=[...fileList];
  const dbFile = files.find(f=>/\.(db|sqlite3?|kb)$/i.test(f.name));
  if(dbFile){
    try{
      await openSqliteBuffer(await dbFile.arrayBuffer(), dbFile.name);
      $("#save").hidden=false; setBanner(""); UI.sel=DB.nodes[0]?.id||null; render();
    }catch(e){ setBanner("That file did not open as a knowledge base. "+e.message,true); }
    return;
  }
  const byName={};
  for(const f of files) byName[(f.webkitRelativePath||f.name).replace(/^[^/]*\//,"")]=f;
  const get = async path => {
    const f = byName[path] || files.find(x=>(x.webkitRelativePath||x.name).endsWith(path));
    return f ? await f.text() : null;
  };
  if(await loadCSVSet(get)){ setBanner(""); UI.sel=DB.nodes[0]?.id||null; render(); }
  else setBanner("No nodes.csv and no .db file in that selection. Pick the folder that holds them.",true);
}

function filtered(){
  const s=UI.q.toLowerCase();
  return DB.nodes.filter(n=>{
    for(const k of ["domain","applies_to","specificity","confidence"])
      if(UI.f[k].size&&!UI.f[k].has(n[k])) return false;
    if(UI.f.applications.size){
      const own=appList(n);
      if(!own.includes("all") && !own.some(a=>UI.f.applications.has(a))) return false;
    }
    if(!s) return true;
    return (n.term+" "+n.id+" "+n.aliases+" "+n.gloss).toLowerCase().includes(s);
  }).sort((a,b)=>a.term.localeCompare(b.term));
}
function neighbours(id){
  const out=[],inc=[];
  for(const e of DB.edges){
    if(e.from_id===id&&DB.byId[e.to_id]) out.push({id:e.to_id,rel:e.relation,note:e.note});
    if(e.to_id===id&&DB.byId[e.from_id]) inc.push({id:e.from_id,rel:e.relation,note:e.note,inv:true});
  }
  return {out,inc};
}

function drawMap(id){
  const {out,inc}=neighbours(id); const all=[...out,...inc].slice(0,12);
  if(!all.length) return null;
  const W=700,H=290,cx=W/2,cy=H/2,R=Math.min(112,40+all.length*8),NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.id="map";
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  all.forEach((nb,i)=>{
    const ang=(i/all.length)*Math.PI*2-Math.PI/2;
    const x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R*0.82;
    svg.append(mk("line",{x1:cx,y1:cy,x2:x,y2:y}));
    const g=mk("g",{class:"hit"});
    g.append(mk("circle",{cx:x,cy:y,r:5,fill:"var(--steel)"}));
    const t=mk("text",{x,y:y-11,"text-anchor":x<cx-20?"end":(x>cx+20?"start":"middle")});
    t.textContent=DB.byId[nb.id].term; g.append(t);
    g.addEventListener("click",()=>{UI.sel=nb.id;render();$("#content").scrollTop=0;});
    svg.append(g);
  });
  svg.append(mk("circle",{cx,cy,r:7,fill:"var(--ink)"}));
  const t=mk("text",{x:cx,y:cy+26,"text-anchor":"middle",class:"self"});
  t.textContent=DB.byId[id].term; svg.append(t);
  return svg;
}

const PRESETS=[
["Uncited terms",`SELECT id, term, domain FROM node
WHERE id NOT IN (SELECT node_id FROM citation) ORDER BY domain, term;`],
["Weak sourcing only",`SELECT n.id, n.term, MIN(s.tier) AS best_tier
FROM node n JOIN citation c ON c.node_id=n.id JOIN source s ON s.id=c.source_id
GROUP BY n.id HAVING best_tier >= 4;`],
["Orphan terms",`SELECT id, term, domain FROM node
WHERE id NOT IN (SELECT from_id FROM edge) AND id NOT IN (SELECT to_id FROM edge);`],
["Coverage by domain",`SELECT domain, COUNT(*) AS terms,
  SUM(definition IS NOT NULL AND definition <> '') AS written,
  SUM(confidence='uncertain') AS uncertain
FROM node GROUP BY domain ORDER BY domain;`],
["Gap list",`SELECT id, term, domain, open_questions FROM node
WHERE value_status='unknown' AND confidence='uncertain' ORDER BY domain, term;`],
["Paywalled sources",`SELECT id, title, url FROM source WHERE access='paywalled';`],
["Go look at the tool",`SELECT id, term, domain, open_questions FROM node
WHERE verify = 'on-tool' ORDER BY domain, term;`],
["Observation only",`SELECT n.id, n.term, MAX(s.tier) AS best
FROM node n JOIN citation c ON c.node_id=n.id JOIN source s ON s.id=c.source_id
GROUP BY n.id HAVING best = 0;`],
["Relation usage",`SELECT relation, COUNT(*) AS n FROM edge GROUP BY relation ORDER BY n DESC;`],
["Two hops from Preston",`WITH RECURSIVE reach(id, depth) AS (
  SELECT 'preston-equation', 0
  UNION
  SELECT CASE WHEN e.from_id=r.id THEN e.to_id ELSE e.from_id END, r.depth+1
  FROM edge e JOIN reach r ON r.id IN (e.from_id, e.to_id)
  WHERE r.depth < 2
)
SELECT n.term, MIN(reach.depth) AS hops FROM reach JOIN node n ON n.id=reach.id
GROUP BY n.id ORDER BY hops, n.term;`]
];
function runSQL(){
  UI.err=null;UI.res=null;
  const sql=UI.sql.trim(); if(!sql) return;
  const body=sql.split("\n").filter(l=>!/^\s*--/.test(l)).join("\n").trim();
  const writes=/^\s*(insert|update|delete|create|drop|alter|replace)/i.test(body);
  try{
    const res=sqldb.exec(sql);
    UI.res=res.length?res[res.length-1]:{columns:[],values:[]};
    if(writes){markDirty();reloadSqlite();}
  }catch(e){UI.err=e.message;}
  render();
}

document.addEventListener("drop",async e=>{
  e.preventDefault();
  const files=[];
  const walk=async(entry,path="")=>{
    if(entry.isFile){
      const f=await new Promise(r=>entry.file(r));
      try{Object.defineProperty(f,"webkitRelativePath",{value:path+f.name});}catch(x){}
      files.push(f);
    } else if(entry.isDirectory){
      const rd=entry.createReader();
      let ents; do{ ents=await new Promise(r=>rd.readEntries(r));
        for(const en of ents) await walk(en,path+entry.name+"/"); } while(ents.length);
    }
  };
  for(const item of e.dataTransfer.items){
    const en=item.webkitGetAsEntry&&item.webkitGetAsEntry();
    if(en) await walk(en);
  }
  if(!files.length && e.dataTransfer.files.length) files.push(...e.dataTransfer.files);
  if(files.length) ingest(files);
});

const DDL=`
PRAGMA foreign_keys = ON;
CREATE TABLE IF NOT EXISTS source (
  id TEXT PRIMARY KEY, title TEXT NOT NULL, author_or_assignee TEXT, year INTEGER,
  source_type TEXT NOT NULL CHECK (source_type IN ('patent','standard','journal','book','thesis','conference','appnote','report','web','observation')),
  url TEXT, access TEXT NOT NULL DEFAULT 'open' CHECK (access IN ('open','paywalled','partial','offline')),
  tier INTEGER NOT NULL CHECK (tier BETWEEN 0 AND 5),
  observed_on TEXT, notes TEXT);
CREATE TABLE IF NOT EXISTS node (
  id TEXT PRIMARY KEY, term TEXT NOT NULL UNIQUE, aliases TEXT,
  type TEXT NOT NULL CHECK (type IN ('concept','subsystem','component','consumable','principle','equation','parameter','signal','failure_mode','metric','procedure','standard')),
  domain TEXT NOT NULL CHECK (domain IN ('hardware','consumables','process','controls','clean')),
  specificity TEXT NOT NULL DEFAULT 'cmp' CHECK (specificity IN ('mirra','cmp','general')),
  applies_to TEXT NOT NULL DEFAULT 'polisher' CHECK (applies_to IN ('polisher','mesa','both')),
  head_gen TEXT CHECK (head_gen IN ('titan','titan-profiler','either','custom','unknown')),
  applications TEXT,
  verify TEXT CHECK (verify IN ('on-tool','research','unknowable')),
  gloss TEXT NOT NULL, definition TEXT, mirra_application TEXT, physics TEXT, typical_values TEXT,
  value_status TEXT DEFAULT 'unknown' CHECK (value_status IN ('published','inferred','unknown')),
  wafer_size_note TEXT,
  confidence TEXT NOT NULL DEFAULT 'uncertain' CHECK (confidence IN ('established','probable','uncertain')),
  confidence_mirra TEXT CHECK (confidence_mirra IN ('established','probable','uncertain')),
  contested TEXT,
  open_questions TEXT, notes TEXT, created_session INTEGER, updated_session INTEGER);
CREATE TABLE IF NOT EXISTS edge (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  from_id TEXT NOT NULL REFERENCES node(id) ON DELETE CASCADE,
  to_id   TEXT NOT NULL REFERENCES node(id) ON DELETE CASCADE,
  relation TEXT NOT NULL CHECK (relation IN ('part_of','governed_by','measured_by','controlled_by','causes','mitigates','trades_off_with','prerequisite_for','alias_of','contrasted_with')),
  note TEXT, source_id TEXT REFERENCES source(id), UNIQUE (from_id,to_id,relation));
CREATE TABLE IF NOT EXISTS citation (
  node_id TEXT NOT NULL REFERENCES node(id) ON DELETE CASCADE,
  source_id TEXT NOT NULL REFERENCES source(id),
  field TEXT CHECK (field IN ('definition','mirra_application','physics','typical_values','general')),
  note TEXT, PRIMARY KEY (node_id,source_id,field));
CREATE TABLE IF NOT EXISTS session (id INTEGER PRIMARY KEY, date TEXT, focus TEXT, summary TEXT);
CREATE TABLE IF NOT EXISTS search_log (
  id INTEGER PRIMARY KEY AUTOINCREMENT, session_id INTEGER, query TEXT NOT NULL,
  where_run TEXT, outcome TEXT CHECK (outcome IN ('hit','thin','empty')), note TEXT);
CREATE TABLE IF NOT EXISTS meta (key TEXT PRIMARY KEY, value TEXT);
INSERT OR REPLACE INTO meta (key,value) VALUES ('schema_version','3.3');
INSERT OR IGNORE INTO meta (key,value) VALUES ('created','');
`;

async function newDatabase(){
  try{ await initSql(); }
  catch(e){ setBanner("Could not fetch the SQLite engine. Put sql-wasm.js and sql-wasm.wasm next to this file, or work in CSV mode.",true); return; }
  sqldb=new SQL.Database(); sqldb.run(DDL);
  MODE="sqlite"; FILENAME="mirra_kb.db"; DEMO=false;
  reloadSqlite(); markDirty();
  setBanner("Empty database created with the full schema. Save it, then start adding rows from the Query tab.");
  UI.view="query";
  UI.sql="-- Paste the INSERT statements from a session here, then Run.";
  render();
}

async function loadDemo(kind){
  if(kind==="sqlite"){
    try{ await initSql(); }
    catch(e){ setBanner("Could not fetch the SQLite engine, showing the sample in CSV mode instead.",true); kind="csv"; }
  }
  if(kind==="sqlite"){
    sqldb=new SQL.Database(); sqldb.run(DDL);
    for(const s of SAMPLE_SOURCES)
      sqldb.run("INSERT INTO source (id,title,author_or_assignee,year,source_type,url,access,tier) VALUES (?,?,?,?,?,?,?,?)",s);
    sqldb.run("UPDATE source SET observed_on='tool A, 2026-04' WHERE id='obs-tool-a'");
    for(const n of SAMPLE_NODES)
      sqldb.run(`INSERT INTO node (id,term,aliases,type,domain,specificity,applies_to,head_gen,
        applications,verify,gloss,definition,mirra_application,physics,typical_values,
        value_status,wafer_size_note,confidence,confidence_mirra,contested,open_questions,
        updated_session)
        VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,'unknown',?,?,?,?,?,0)`,
        [n.id,n.term,n.alias||null,n.type,n.domain,specOf(n.id),appliesOf(n.id),
         SAMPLE_HEAD[n.id]||null,SAMPLE_APPS[n.id]||null,SAMPLE_VERIFY[n.id]||null,
         n.gloss,n.definition||null,
         n.app||null,n.physics||null,n.values||null,n.wafer||null,n.conf,
         SAMPLE_MCONF[n.id]||null,SAMPLE_CONTESTED[n.id]||null,n.oq||null]);
    for(const [f,t,r,note] of SAMPLE_EDGES)
      { try{ sqldb.run("INSERT INTO edge (from_id,to_id,relation,note) VALUES (?,?,?,?)",[f,t,r,note||null]); }catch(e){} }
    for(const c of SAMPLE_CITES)
      { try{ sqldb.run("INSERT INTO citation (node_id,source_id,field) VALUES (?,?,?)",c); }catch(e){} }
    MODE="sqlite"; FILENAME="mirra_kb_sample.db"; reloadSqlite();
    $("#save").hidden=false; $("#save").textContent="Save a copy";
  } else {
    DB.nodes=SAMPLE_NODES.map(n=>({id:n.id,term:n.term,aliases:n.alias||"",type:n.type,
      domain:n.domain,specificity:specOf(n.id),applies_to:appliesOf(n.id),
      head_gen:SAMPLE_HEAD[n.id]||"",applications:SAMPLE_APPS[n.id]||"",
      verify:SAMPLE_VERIFY[n.id]||"",gloss:n.gloss,value_status:"unknown",
      confidence:n.conf,confidence_mirra:SAMPLE_MCONF[n.id]||"",
      contested:SAMPLE_CONTESTED[n.id]||"",
      wafer_note:n.wafer||"na",definition:n.definition||"",mirra_application:n.app||"",
      physics:n.physics||"",typical_values:n.values||"",open_questions:n.oq||"",extra:[]}));
    DB.edges=SAMPLE_EDGES.map(([f,t,r,note])=>({from_id:f,to_id:t,relation:r,note,source_id:""}));
    DB.sources=SAMPLE_SOURCES.map(([id,title,a,y,st,url,acc,tier])=>

        tier:String(tier),observed_on:id==="obs-tool-a"?"tool A, 2026-04":""}));
    DB.citations=SAMPLE_CITES.map(([node_id,source_id,field])=>({node_id,source_id,field}));

  render();
}

(async ()=>{
  if(location.protocol.startsWith("http")){
    try{
      const r=await fetch("mirra_kb.db",{cache:"no-store"});
      if(r.ok){
        const buf=await r.arrayBuffer();
        const magic=new TextDecoder().decode(new Uint8Array(buf,0,15));
        if(magic.startsWith("SQLite format")){
          await openSqliteBuffer(buf,"mirra_kb.db");
          $("#save").hidden=false; UI.sel=DB.nodes[0]?.id||null; render(); return;
        }
      }
    }catch(e){}
    try{
      const get=async p=>{const r=await fetch(p,{cache:"no-store"});return r.ok?await r.text():null;};
      if(await loadCSVSet(get)){ UI.sel=DB.nodes[0]?.id||null; render(); return; }
    }catch(e){}
  }
  render();
})();
