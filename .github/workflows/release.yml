name: Release

# Builds the two zip packages and publishes them as a GitHub Release.
#
# Three ways to start it:
#   1. Push a version tag like v1.0.0.
#   2. Run it by hand from the Actions tab (workflow_dispatch) and type the
#      version. This is handy when you cannot push a tag from your machine.
#   3. Called by the release-on-stamp workflow, which notices a new version
#      heading landing in CHANGELOG.md on main and cuts the release for you.
#
# To cut a release by tag:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# There is no separate tagging step. "gh release create" makes the tag when it
# does not exist yet, so routes 2 and 3 do not need push access to a tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, for example v1.0.0"
        required: true
        default: "v1.0.0"
  workflow_call:
    inputs:
      version:
        description: "Version tag to create, for example v1.0.0"
        required: true
        type: string

permissions:
  # The job needs to create a release and attach files to it.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests before releasing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      - name: Build the zips
        run: python tools/build_zips.py

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # When started by a tag push, github.ref_name is the tag. When started
          # by hand or by the release-on-stamp workflow, the version comes in as
          # an input. The inputs context covers both of those, and is empty on a
          # tag push, so this one line handles all three routes.
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # Create the release if it does not exist yet. If it already exists,
          # just upload the zips and overwrite any old copies. This makes a
          # re-run safe.
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" \
              dist/alarm_pareto_browser.zip \
              dist/alarm_pareto_python.zip \
              --clobber
          else
            gh release create "${VERSION}" \
              --target main \
              dist/alarm_pareto_browser.zip \
              dist/alarm_pareto_python.zip \
              --title "${VERSION}" \
              --generate-notes
          fi
