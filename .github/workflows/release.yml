name: Release

# Builds the zip packages and publishes them as a GitHub Release.
#
# Two ways to start it:
#   1. Push a version tag like v1.0.0.
#   2. Run it by hand from the Actions tab (workflow_dispatch) and type the
#      version. This is handy when you cannot push a tag from your machine.
#
# To cut a release by tag:
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, for example v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  # The job needs to create a release and attach files to it.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests before releasing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      - name: Build the zips
        run: python tools/build_zips.py

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # When started by a tag push, github.ref_name is the tag. When started
          # by hand, we use the version typed into the form.
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "${VERSION}" \
            --target main \
            dist/alarm_pareto_browser.zip \
            dist/alarm_pareto_python.zip \
            dist/pm_logger.zip \
            --title "${VERSION}" \
            --generate-notes
