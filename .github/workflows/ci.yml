name: CI

# Runs on every push and every pull request. Two jobs: the Python test suite
# checks the analysis math, and the browser-tests job drives a real headless
# Chromium against alarm_pareto.html to check the import and analysis there.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Cheap and dependency-free, so it runs first and fails fast. It catches the
  # version number drifting apart between the changelog and the package, which
  # went unnoticed for three releases once.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version numbers agree
        run: python tools/check_version.py

  test:
    runs-on: ubuntu-latest
    strategy:
      # numpy 1.26.4 and pandas 2.2.2 support Python 3.11 and 3.12. We test both.
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the tests
        run: pytest -q

      - name: Build the distributable zips
        run: python tools/build_zips.py

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Node 22 ships a built-in WebSocket, which the harness uses to speak the
      # Chrome DevTools Protocol. No npm packages are installed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run the browser tests
        run: node tests/browser/run.mjs
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
