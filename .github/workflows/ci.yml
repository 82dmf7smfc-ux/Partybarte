name: CI

# Runs the checks on every push and every pull request.
#
# Two things are checked. First, the Python analysis still gives the right
# answers. Second, the browser tool gives the same answers as the Python tool.
# The second check matters because the analysis is written twice, once in each
# language, and nothing else notices when the two drift apart.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # numpy 1.26.4 and pandas 2.2.2 support Python 3.11 and 3.12. We test both.
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node for the browser parity check
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the browser tool against the golden numbers
        # This runs the real JavaScript out of alarm_pareto.html and compares its
        # results to the same golden files the Python tests use. It is listed
        # before the test suite so a parity failure is easy to spot in the log.
        run: node tools/check_parity.mjs

      - name: Run the tests
        run: pytest -q

      - name: Build the distributable zips
        run: python tools/build_zips.py
